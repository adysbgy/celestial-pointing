name: Diagnostik guard berkas v3 (sementara)

# Sementara: menunjuk langkah MANA yang membuat `Tools/render-visuals.py`
# menyimpang dari HEAD di CI, padahal pohon kerjanya bersih di dev.
# Tidak untuk di-merge ke main.
#
# v1 tidak menyertakan `swift test` — satu-satunya langkah job asli yang
# belum dijalankan. v2 gagal di langkah pertamanya sendiri karena `git`
# menolak repo (dubious ownership) sebelum safe.directory diset.
on: [push, workflow_dispatch]

jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Pasang python3 + izinkan git membaca repo
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          git config --global --add safe.directory '*'

      - name: Titik nol
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"
          echo "sha_head=$(git cat-file -p HEAD:Tools/render-visuals.py | sha256sum | cut -d' ' -f1)"
          stat -c 'mode=%a size=%s' Tools/render-visuals.py

      - name: LANGKAH 1 asli — swift test CelestialEngine
        run: swift test --package-path Packages/CelestialEngine >/dev/null 2>&1; echo "swifttest=$?"

      - name: Selepas LANGKAH 1
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"
          git status --porcelain | head
          git diff HEAD -- Tools/render-visuals.py | head -20

      - name: LANGKAH 2 asli — sapu UI
        run: ./swift-ui-lint.sh >/dev/null 2>&1; echo "lint=$?"

      - name: Selepas LANGKAH 2
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"

      - name: LANGKAH 3 asli — red-lint
        run: |
          ./red-lint.sh Apps/Shared/CelestialVisualView.swift \
            '    private static func warnaUji() -> Color {
                  Color(red: 0.62, green: 0.30, blue: 0.16)
              }
          ' 'Aturan 15' >/dev/null 2>&1; echo "redlint=$?"

      - name: Selepas LANGKAH 3
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"

      - name: LANGKAH 4 asli — gerbang gambar
        run: python3 Tools/check-visuals.py --check >/dev/null 2>&1; echo "gate=$?"

      - name: Selepas LANGKAH 4
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"
          git status --porcelain | head
          git diff HEAD -- Tools/render-visuals.py | head -30

      - name: LANGKAH 5 asli — bukti aksen
        run: python3 Tools/bukti-mutasi-aksen.py >/dev/null 2>&1; echo "aksen=$?"

      - name: Selepas LANGKAH 5
        run: |
          echo "guard=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          echo "sha_file=$(sha256sum Tools/render-visuals.py | cut -d' ' -f1)"
          git status --porcelain | head
          echo "== diff mentah =="; git diff HEAD -- Tools/render-visuals.py | head -40

      - name: LANGKAH 6 asli — bukti bintang (yang menyalak)
        run: |
          echo "guard_sebelum=$(git diff --quiet HEAD -- Tools/render-visuals.py; echo $?)"
          python3 Tools/bukti-mutasi-bintang.py 2>&1 | tail -10
          echo "bintang_exit=${PIPESTATUS[0]}"
