name: Diagnostik guard berkas v2 (sementara)

# Sementara: menunjuk langkah MANA yang membuat `Tools/render-visuals.py`
# menyimpang dari HEAD di CI, padahal pohon kerjanya bersih di dev.
# Tidak untuk di-merge ke main.
on: [push, workflow_dispatch]

jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Pasang python3
        run: |
          apt-get update -qq
          apt-get install -y -qq python3

      - name: Cara checkout menandai safe.directory
        run: |
          echo "== config core =="; git config --list --show-origin | grep -i core || echo "(kosong)"
          echo "== owner =="; stat -c '%u %g %a %n' . Tools/render-visuals.py
          echo "== dirty? =="; git status --porcelain; echo "porcelain_exit=$?"
          echo "== diff mentah =="; git diff HEAD -- Tools/render-visuals.py | head -40
          echo "== mode di index vs kerja =="; git ls-files -s Tools/render-visuals.py; stat -c '%a %s %Y' Tools/render-visuals.py
          echo "== sha =="; sha256sum Tools/render-visuals.py; git cat-file -p HEAD:Tools/render-visuals.py | sha256sum

      - name: Uji CelestialEngine (langkah 1 asli)
        run: swift test --package-path Packages/CelestialEngine >/dev/null 2>&1; echo "swifttest=$?"
        continue-on-error: true

      - name: Selepas swift test
        run: |
          echo "== dirty? =="; git status --porcelain | head; git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard=$?"
          git diff HEAD -- Tools/render-visuals.py | head -20

      - name: Sapu UI (langkah 2 asli)
        run: ./swift-ui-lint.sh >/dev/null 2>&1; echo "lint=$?"

      - name: Selepas sapu UI
        run: |
          git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard=$?"
          git diff HEAD -- Tools/render-visuals.py | head -20

      - name: Red-lint (langkah 3 asli)
        run: |
          ./red-lint.sh Apps/Shared/CelestialVisualView.swift \
            '    private static func warnaUji() -> Color {
                  Color(red: 0.62, green: 0.30, blue: 0.16)
              }
          ' 'Aturan 15' >/dev/null 2>&1; echo "redlint=$?"

      - name: Selepas red-lint
        run: |
          git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard=$?"
          git status --porcelain | head
          git diff HEAD -- Tools/render-visuals.py | head -20

      - name: Gerbang gambar (langkah 4 asli)
        run: python3 Tools/check-visuals.py --check >/dev/null 2>&1; echo "gate=$?"

      - name: Selepas gerbang gambar
        run: |
          git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard=$?"
          git status --porcelain | head
          echo "== diff mentah =="; git diff HEAD -- Tools/render-visuals.py | head -40
          echo "== sha =="; sha256sum Tools/render-visuals.py; git cat-file -p HEAD:Tools/render-visuals.py | sha256sum

      - name: Bukti aksen (langkah 5 asli)
        run: python3 Tools/bukti-mutasi-aksen.py >/dev/null 2>&1; echo "aksen=$?"

      - name: Selepas bukti aksen
        run: |
          git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard=$?"
          git status --porcelain | head
          echo "== diff mentah =="; git diff HEAD -- Tools/render-visuals.py | head -40
          echo "== sha =="; sha256sum Tools/render-visuals.py; git cat-file -p HEAD:Tools/render-visuals.py | sha256sum

      - name: Bukti bintang (langkah 6 asli — yang menyalak)
        run: |
          git diff --quiet HEAD -- Tools/render-visuals.py; echo "guard_sebelum=$?"
          python3 Tools/bukti-mutasi-bintang.py 2>&1 | tail -12; echo "bintang=${PIPESTATUS[0]}"
