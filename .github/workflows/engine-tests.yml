name: Engine Tests (Linux)
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      # `fetch-depth: 0`, bukan bawaan `1`.
      #
      # Dua harness (`bukti-mutasi-label-bawaan.py`,
      # `bukti-mutasi-anggota-bertahap.py`) membuktikan arah kedua: cacat yang
      # ditutup sebuah perbaikan **dulu lolos**. Itu butuh `swift-ui-lint.sh`
      # versi **sebelum** perbaikan, yang ditambat ke commit induk perbaikan.
      #
      # Terukur: pada `fetch-depth: 1` hanya `HEAD` dan `origin/main` yang
      # terbaca; `git show <sha-induk>` gagal, dan kegagalan itu membuat
      # "versi lama" menjadi **skrip kosong** — nol temuan, yaitu hijau.
      # Arah kedua lalu lulus persis pada keadaan yang seharusnya
      # membuktikannya, dan harness melaporkan "SEMUA SESUAI" atas nol
      # pembuktian. Riwayat penuh harganya kecil (klon penuh repo ini ~4 MB)
      # dibanding gerbang yang berhenti mengukur tanpa suara.
      #
      # Penambat `origin/main` **bukan** pengganti yang sah: ia mengikuti
      # cabang, jadi ia berhenti mengukur tepat pada commit yang
      # memperkenalkan perbaikan (dan memang begitu `main` sempat merah).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `swift:6.0` (Ubuntu 24.04) **tidak memuat Python**. Sebelas aturan di
      # `swift-ui-lint.sh` dijalankan lewat `python3 - <<'PY'`; tanpanya
      # masing-masing mengembalikan string kosong dan dilaporkan "Bersih"
      # tanpa memeriksa apa pun — gerbang keluar 0, seluruh CI hijau.
      #
      # Ini pernah benar-benar terjadi dan tidak terlihat berbulan-bulan:
      # yang menyingkapnya adalah satu aturan yang baru ditambahkan dan
      # kebetulan berbunyi. `swift-ui-lint.sh` kini berhenti keras bila
      # python3 tidak ada (supaya ia tidak bisa lagi diam-diam lulus), dan
      # langkah ini yang memastikannya tersedia.
      - name: Pasang python3 (gerbang sapu UI)
        run: |
          apt-get update -qq
          apt-get install -y -qq python3

      # Dua paket, bukan satu.
      #
      # Kriteria "ENGINE SIAP" di ROADMAP.md menyatakan suite hijau di Linux
      # **tanpa Mac** untuk keduanya (166 CelestialEngine + 143 PointingKit).
      # Sebelumnya job ini hanya menjalankan CelestialEngine, sehingga separuh
      # kriteria itu tidak pernah ditegakkan di CI: perubahan pada PointingKit
      # hanya akan tertangkap job macOS yang jauh lebih lambat. Karena seluruh
      # keputusan produk yang bisa salah hidup di PointingKit (kapan yakin,
      # kapan menolak, apa yang direkam), gerbang cepatnya justru yang paling
      # perlu memeriksanya.
      - name: Uji CelestialEngine
        run: swift test --package-path Packages/CelestialEngine

      # Aturan UI yang tidak bisa ditegakkan compiler: ukuran font tetap
      # mengabaikan Dynamic Type. `swiftc` tidak peduli, dan berkas SwiftUI
      # tidak ikut terbangun di Linux — jadi ini satu-satunya penjaga. Sapunya
      # murni teks, sehingga ia bisa berjalan di Linux tanpa Apple SDK.
      - name: Gerbang sapu UI (font tetap)
        run: ./swift-ui-lint.sh

      # Buktikan gerbang di atas **berbunyi**, bukan sekadar mencetak
      # "Bersih".
      #
      # Aturan 15 (warna mode malam) pertama kali ditulis dan langsung hijau
      # — lalu tetap hijau ketika cacat yang persis seperti yang pernah
      # nyata disuntikkan. Sebabnya: batas fungsinya memakai
      # `rfind("\nfunc")`, yang tidak pernah cocok dengan
      # `private static func`, sehingga rentangnya jatuh ke seluruh berkas.
      # Gerbang itu lulus pada kode benar **dan** pada kode salah.
      #
      # `./red-lint.sh` menyuntik cacat itu, mewajibkan gerbang keluar
      # bukan-nol, lalu memulihkan berkasnya. Tanpa langkah ini, cacat pada
      # gerbang hanya akan ketahuan kalau kebetulan ada yang mengujinya.
      - name: Buktikan gerbang warna mode malam berbunyi
        run: |
          ./red-lint.sh Apps/Shared/CelestialVisualView.swift \
            '    private static func warnaUji() -> Color {
                  Color(red: 0.62, green: 0.30, blue: 0.16)
              }
          ' 'Aturan 15'

      # Aturan 3 (aksara non-Latin) memakai daftar rentang **tangan**, dan
      # daftar tangan selalu ketinggalan abjad yang tidak disebut. Terukur:
      # satu huruf Arab (U+0627, ALEF) benar-benar pernah masuk ke
      # `swift-ui-lint.sh` sendiri — menyelinap di dalam komentar Aturan 7 —
      # dan aturan itu melaporkan "Bersih", karena daftarnya tidak pernah
      # punya rentang Arabic.
      #
      # Yang disuntik di sini huruf Arab, bukan CJK: CJK sudah tertangkap
      # daftar lama, jadi menyuntiknya membuktikan apa yang sudah terbukti.
      # Yang perlu dibuktikan adalah abjad yang **tidak** ada di daftar itu.
      #
      # Harfiahnya lahir dari `python3`, bukan `printf`: langkah ini berjalan
      # di bawah `sh` (dash), dan `printf` dash **tidak** mengenal escape
      # `\uXXXX` — ia mencetaknya apa adanya, jadi yang disuntik adalah teks
      # "// \u0627…" dan gerbangnya benar-benar tetap hijau. Itu bukan
      # hipotesis: langkah ini merah di CI karena sebab itu, sementara di
      # shell lokal (bash, yang `printf`-nya mengenal `\u`) ia lulus. Uji
      # yang lulus hanya di shell penulisnya bukan uji.
      #
      # Berkasnya sendiri juga harus Latin: Aturan 3 menyapu `*.yml`, jadi
      # harfiah Arab yang ditulis langsung akan memerah pada gerbangnya
      # sendiri.
      - name: Buktikan gerbang aksara non-Latin berbunyi
        run: |
          ./red-lint.sh Apps/PointAndKnowWatch/Sources/WatchTheme.swift \
            "$(python3 -c 'print("// \u0627\u0644\u0633\u0645\u0627\u0621 selip")')" \
            'Aturan 3'

      # Aturan 1 (font tetap) punya cacat yang **sama lagi**, dan polanya
      # sudah jelas sekarang: setiap gerbang yang memotong komentar dengan
      # `//` pertama pada baris akan buta pada baris yang memuat `//` di
      # dalam literal. Disuntik dan diukur:
      #
      #   Text("https://example.com/x").font(.system(size: 11))
      #   → "Bersih: tidak ada .system(size:) pada kode di Apps/"
      #
      # Baris dengan URL atau path di dalamnya justru bentuk yang paling
      # mungkin dialam, dan itu satu-satunya yang tidak terlihat. Yang
      # disuntik di sini sengaja memuat literal itu, bukan bentuk polos yang
      # sudah tertangkap versi lama.
      - name: Buktikan gerbang font tetap berbunyi
        run: |
          ./red-lint.sh Apps/PointAndKnowWatch/Sources/ReducedLuminanceView.swift \
            'private func mutasiUrl() -> some View {
                 Text("https://example.com/x").font(.system(size: 11))
             }
          ' 'Aturan 1'

      # Aturan 7 punya bentuk cacat yang **sama**, dan itu bukan kebetulan:
      # batas cakupannya juga dulu diturunkan dari bentuk berkas, bukan dari
      # tempat API itu benar-benar dipanggil. Versi pertamanya menanyakan
      # penjaganya ke seluruh berkas lalu `break` setelah satu laporan —
      # sehingga `withAnimation` baru di fungsi baru di berkas yang sudah
      # menyebut `motion` **hijau**, walau tidak ada penjaga di dekatnya.
      #
      # Yang disuntik di sini sengaja diletakkan di `PointingView.swift`,
      # berkas yang **sudah** punya penjaga gerak yang sah. Berkas seperti
      # itulah yang paling aman menurut versi lama, dan justru itu yang
      # membuatnya paling mudah ditambahi gerak tanpa penjaga.
      - name: Buktikan gerbang reduce-motion berbunyi
        run: |
          ./red-lint.sh Apps/PointAndKnowWatch/Sources/PointingView.swift \
            'private func mutasiTanpaPenjaga() -> some View {
                 Text("x").withAnimation(.linear(duration: 0.3)) { _ in }
             }
          ' 'Aturan 7'

      # Dan `red-lint.sh` di atas hanya membuktikan **satu** bentuk cacat di
      # **satu** berkas. Cakupan aturannya lebih luas dari itu, dan sampai
      # siklus ini tidak ada yang mengukurnya.
      #
      # Bentuk yang lolos ditemukan dengan menyuntik, bukan membaca: versi
      # aturannya membuang komentar tetapi **tidak** isi literal string, jadi
      # satu baris `_ = "MotionPolicy(reduceMotion: false)"` di dalam blok
      # membuat setiap API gerak di blok itu lolos — "Bersih". Kalimat yang
      # menyebut penjaga bukan penjaga, dan repo ini menulis
      # `motion.allowsTransitions` di dalam teks yang dijelaskan ke pengguna.
      #
      # Harness ini menutup kelasnya dengan sembilan keadaan: cacat yang harus
      # berbunyi, bentuk sah yang harus diam (termasuk `MotionPolicy(reduceMotion:
      # false)` yang selalu melarang — batas yang dinyatakan sebagai harapan,
      # bukan catatan), dan **satu pengukuran non-vakuositas**: keadaan
      # "penjaga hanya di dalam string" dijalankan ulang tanpa `blank_strings`
      # dan wajib berbalik hijau.
      - name: Buktikan Aturan 7 berbunyi pada kelasnya, bukan satu bentuknya
        run: python3 Tools/bukti-mutasi-gerbang-gerak.py

      # Aturan 39 menutup kelas galat yang **tidak bisa dilihat Linux mana pun**:
      # anggota `static` yang dipanggil pada instance (`visual.spokenStarClassLine(…)`).
      # `swift-typecheck.sh` hanya `-parse`, dan `Apps/` tidak pernah dibangun di
      # sini, jadi bentuk itu baru memerah di runner macOS. Aturan ini pertama
      # kali ditulis salah tiga kali berturut-turut dan melapor "Bersih" dengan
      # indeks **kosong**; harness ini yang menangkapnya, dan ia menanyakan
      # anggota yang persis dibutuhkan (`phaseGeometry` sebagai instance) supaya
      # indeks yang salah-tipe tidak bisa lolos lagi.
      - name: Buktikan Aturan 39 berbunyi pada bentuk yang gagal di CI macOS
        run: python3 Tools/bukti-mutasi-aturan39-statis.py

      # Gambar objek tidak bisa diperiksa di sini: `CelestialVisualView` hanya
      # terbangun di macOS, dan job ini berjalan di Linux. Karena itu lapisan
      # menggambarnya **diport ke Python** (`Tools/render-visuals.py`) dan
      # hasilnya diukur (`Tools/check-visuals.py`).
      #
      # Yang diukur bukan "gambarnya bagus" — itu tetap perlu mata manusia.
      # Yang diukur adalah hal-hal yang punya jawaban benar/salah dan selama
      # ini tidak dijaga oleh apa pun: apakah luas sabit yang tergambar
      # mengikuti fraksi iluminasi, apakah sisi terangnya menghadap arah yang
      # benar, dan apakah ciri pengenal planet benar-benar **hilang** saat
      # engine ragu. Ketiganya pernah salah di repo ini.
      #
      # Tanpa langkah ini, `Tools/check-visuals.py` hanya alat yang dipakai
      # kalau ada yang ingat menjalankannya. Gerbang yang harus diingat adalah
      # gerbang yang akan dilewati.
      - name: Gerbang gambar objek (port Python)
        run: python3 Tools/check-visuals.py --check

      # Buktikan gerbang gambar di atas **berbunyi**, bukan sekadar mencetak
      # "0 gagal".
      #
      # `red-lint.sh` (langkah di atas) melakukan ini untuk `swift-ui-lint.sh`,
      # tapi belum ada yang setara untuk gerbang gambar — dan justru di sana
      # buktinya paling dibutuhkan: gerbang gambar membaca **teks** sumber lalu
      # menyimpulkan sesuatu tentang gambar, jadi gerbang teks yang salah
      # membaca akan hijau selamanya tanpa ada yang tahu.
      #
      # Ini bukan upacara. Harness ini **menemukan dua cacat nyata** di
      # gerbangnya sendiri saat ditulis: (1) `"nama" in view` menghitung
      # komentar `// TODO …moonPhaseUnknown` sebagai pemakaian, dan (2)
      # `let aksen = CelestialVisual.accents` lalu `aksen.moonPhaseUnknown`
      # — kode yang benar — merah. Ia juga menangkap gerbang versi lama
      # (pemeriksaan ejaan) pada 9 dari 13 keadaan, termasuk setiap keadaan
      # "kode benar" — persis cacat yang membuat `main` merah dua commit.
      #
      # Ia memanggil fungsi pemeriksaan yang **sama** lewat parameter sumber,
      # bukan jalur kedua: gerbang penuh ~6 menit, ini <1 detik. Gerbang yang
      # terlalu lambat untuk dijalankan adalah gerbang yang dilewati.
      - name: Buktikan gerbang aksen gambar berbunyi
        run: python3 Tools/bukti-mutasi-aksen.py

      # Dan bukti yang sama untuk pemeriksaan ukuran bintang — cacat yang
      # ditemukan siklus ini: **setiap** kasus bintang bernama digambar dengan
      # `relative_size=size_from_magnitude(0.0)`, satu magnitudo untuk Sirius
      # (−1.46) dan Vega (+0.03). Sirius 4,3× lebih terang dari Rigel, dan pada
      # ukuran kartu jam keduanya terukur **0 piksel berbeda**: tidak ada satu
      # pun gambar di repo ini yang pernah membuktikan ukuran mengikuti
      # magnitudo. Yang berbohong bukan jamnya, melainkan perlengkapan
      # render — dan perlengkapan itulah yang diukur gerbang gambar.
      #
      # Harness ini menempuh jalur gerbang yang sama, atas tiga keadaan yang
      # memang salah: fixture kembali ke satu magnitudo, penggambar mengabaikan
      # `relative_size`, dan pembaca magnitudo bergeser. Keadaan ketiga itulah
      # yang memperlihatkan pemeriksaan pertama saya masih membandingkan
      # pembaca dengan dirinya sendiri.
      - name: Buktikan gerbang ukuran bintang berbunyi
        run: python3 Tools/bukti-mutasi-bintang.py

      # Dan bukti yang sama untuk **denyut bintang** — gerbang yang menutup
      # satu-satunya hal yang tidak bisa dilihat gerbang gambar mana pun yang
      # sudah ada: **geraknya**. Setiap gerbang lain di repo ini menggambar
      # pada satu fase, dan `star-pulse-peak` ada di `build_cases()` sejak
      # siklus pertama tanpa pernah disebut satu gerbang pun. Terukur:
      # `pulse_factor = 1.0` → 17 pemeriksaan bintang, **0 merah**; pada
      # 200 px piksel menyala turun 7044 → 3724 dan tidak ada yang melihat.
      #
      # Gerbangnya mengukur **amplitudo yang dipulihkan dari gambar** (akar
      # dari nisbah luas, karena yang dikalikan denyut adalah radius cakram),
      # lalu membandingkannya dengan `pulseAmplitude` **dari model Swift**.
      # Bentuk yang salah karena itu terbaca sebagai tanda yang salah:
      # `cos` membalik puncaknya, `sin²` membalik palungnya — masing-masing
      # berjarak 0.20 dari model, sementara kode benar terukur dalam 0.005.
      #
      # Harness ini menuntut pemeriksaan **mana** yang berbunyi, bukan
      # berapa: keadaan 1 dan 2 harus menyalakan pemeriksaan amplitudo yang
      # **berbeda** (puncak vs palung). Kalau keduanya menyalakan yang sama,
      # separuh gerbangnya mubazir — dan tidak ada yang akan tahu.
      # Keadaan 5 wajib **hijau**: sukunya dibalik tanpa mengubah hasil,
      # jadi gerbang yang sebenarnya cuma mencocokkan tulisan akan tertangkap
      # di sana, bukan di lima keadaan lainnya.
      - name: Buktikan gerbang denyut bintang berbunyi
        run: python3 Tools/bukti-mutasi-denyut.py

      # Dan bukti yang sama untuk pemeriksaan **penekanan bentuk saat ragu** —
      # satu pemeriksaan yang dipisah keluar dari `check_features_disappear_when_uncertain`
      # justru karena dua versi pertamanya hijau pada kode yang jelas salah.
      #
      # Versi pertama memakai `diff > 0` mentah, dan karena hanya gambar "ragu"
      # yang memakai lencana "?", seluruh selisihnya bisa **hanya** lencana:
      # terukur, penekanan bentuk dihapus seluruhnya dari port dan pemeriksaan
      # itu tetap hijau (3434 piksel, semuanya lencana). Versi kedua
      # membandingkan keenam morfologi terhadap **satu** kabut netral
      # ber-morfologi `galaxy`, jadi `galaxy` dibandingkan dengan dirinya
      # sendiri — nol piksel selamanya — sementara kelima yang lain "lulus"
      # pada 6073…6881 piksel yang seluruhnya **warna**, bukan bentuk.
      #
      # Harness ini menjalankan pemeriksaan yang sama atas empat keadaan dan
      # menuntut pemeriksaan mana yang berbunyi, bukan berapa yang merah.
      # Keadaan ketiga ("bentuk diabaikan selamanya, warna tetap benar") hijau
      # di **seluruh** 42 pemeriksaan morfologi lain — hanya arah "bentuk
      # sampai ke gambar saat terkunci" yang melihatnya.
      - name: Buktikan gerbang penekanan bentuk langit dalam berbunyi
        run: python3 Tools/bukti-mutasi-langit-dalam.py

      # Dan bukti yang sama untuk **arah fase saat benda mengecil** — gerbang
      # yang lahir dari celah yang tidak dijaga satu pun gerbang lain.
      #
      # `terminatorRotationRadians` punya dua jalur: pita yang dasarnya di
      # kanan (membesar) memakai sudut Matahari apa adanya, dan pita yang
      # dasarnya di **kiri** (mengecil) membalikkannya dengan `+ pi`. Sebelum
      # lima kasus `is_waxing=False` ditambahkan bersama gerbang baru, seluruh
      # katalog render repo ini hanya berisi `waxing=True`, dan di seluruh
      # `check-visuals.py` tidak ada satu pun `is_waxing=False` — jadi jalur
      # kedua tidak pernah digambar dan tidak pernah diukur.
      #
      # Terukur: dengan `+ pi` dihapus, `check_crescent_direction` (4
      # pemeriksaan), `check_inner_planet_phase` (5), `check_moon_phase_fraction`
      # (9), dan `check_moon_phase_survives_uncertainty` (3) semuanya tetap
      # **0 merah**. Yang terjadi bukan pemeriksaan merah, melainkan Bulan
      # yang mengecil menghadap berlawanan arah — sabit yang masih berbentuk
      # sabit, sehingga tidak ada teks di layar mana pun yang bisa
      # membuktikannya. Harness ini menjalankan keempat gerbang itu **plus**
      # yang baru, dan menuntut keadaan itu menyalakan **hanya** gerbang baru.
      - name: Buktikan gerbang arah fase saat mengecil berbunyi
        run: python3 Tools/bukti-mutasi-fase.py

      # Dan bukti yang sama untuk **Bintik Merah Besar** — ciri permukaan
      # terakhir yang belum pernah disapu, dan yang gerbangnya punya lubang
      # yang sama dengan pita Jupiter: ciri digambar sebagai elips warna
      # **rata** di atas bola yang sudah dinaungi gradien, jadi lengkung bola
      # di dalamnya terhapus. Untuk pita itu sudah dijaga
      # `check_banded_disc_keeps_its_curvature` — tetapi gerbang itu mengukur
      # **baris ekuator**, sementara bintiknya duduk di `centerY = +0.31`.
      # Diukur pada baris pusat bintik: bola di bawahnya meredup 0.580 → 0.532
      # (lengkung +8.4%), baris yang sama **dengan** bintik menanjak
      # 0.449 → 0.532 (lengkung −18.4%) — tandanya terbalik.
      #
      # Harness ini menguji **dua** gerbang sekaligus: yang piksel (lengkung
      # + ciri masih terbaca) dan yang teks (tiga entri baru di
      # `check_port_matches_swift_constants`, supaya view tidak bisa berhenti
      # memanggil pemulihannya atau menulis angkanya sendiri).
      #
      # Keadaan "`clip_ellipse` dihapus" sengaja **tidak** ada di sini: percobaan
      # pertama siklus ini menambah parameter itu ke `Canvas.ellipse`, dan
      # terukur ia mengubah **0 piksel** (elipsnya sudah membatasi diri ke
      # bentuknya sendiri). Ia dihapus dari port, bukan dijaga gerbang.
      - name: Buktikan gerbang bintik Jupiter berbunyi
        run: python3 Tools/bukti-mutasi-bintik.py

      # `moonSphereGradientEndRadius` adalah konstanta yang **dipakai dua
      # pemanggil** — piringan Bulan dan pita terang planet dalam — tetapi
      # sampai siklus ini hanya Bulan yang membacanya. Jalur planet menulis
      # `1.15` sendiri di view **dan** di port, jadi mengubah konstantanya
      # memindahkan nol piksel pada Venus/Merkurius: konstanta yang ada,
      # dinamai, dibandingkan gerbang drift, diuji di Linux, dan tidak
      # mengatur apa pun di separuh pemanggilnya. Tidak ada galat kompilasi.
      #
      # Harness ini menguji kelima keadaan, termasuk satu yang **diharapkan
      # hijau** (jalur Bulan memakai literal — gerbang ini mengukur planet
      # dalam, jadi batas cakupannya teruji, bukan tersirat).
      - name: Buktikan gerbang radius akhir gradien berbunyi
        run: python3 Tools/bukti-mutasi-radius-akhir.py

      # Pembaca gerbang di atas (`_gradient_end_factors`) ikut diubah oleh
      # perbaikan itu: ia hanya mengenali `radius * 1.15`, sehingga pada kode
      # yang sudah **benar** ia melaporkan "limb tidak terbaca" — gerbang yang
      # merah pada kode benar, kelas cacat yang lebih berbahaya dari gerbang
      # yang hijau pada kode salah, karena orang yang sedang terburu-buru akan
      # mengembalikan kodenya ke bentuk salah supaya gerbangnya diam.
      #
      # Harness ini membuktikan perluasan pembacanya tidak membuatnya tumpul:
      # tujuh keadaan, termasuk satu yang **diharapkan hijau** (kedua bahasa
      # sepakat) dan satu yang hanya terlihat oleh pemeriksaan "para pemanggil
      # sepakat" (dua pemanggil gradien limb tidak sepakat).
      - name: Buktikan pembaca radius akhir gradien masih menggigit
        run: python3 Tools/bukti-mutasi-radius-gradasi.py

      # Dan bukti yang sama untuk **kesinambungan cangkang nebula planetari** —
      # gerbang yang lahir dari cacat yang dilihat mata lebih dulu daripada
      # diukur alat.
      #
      # `testPlanetaryNebulaShellSitsOnOneRadius` menuntut semua blobnya sejauh
      # sama dari pusat; `testPlanetaryNebulaIsHollowAtTheCentre` menuntut
      # bagian tengahnya kosong. Keduanya benar, dan keduanya tetap benar pada
      # gambar yang rusak — **untaian delapan manik juga duduk pada satu radius
      # dan juga berongga di tengah.** Yang tidak dijaga siapa pun adalah apakah
      # manik-manik itu **bertemu**. Terukur pada 132 pt: celah di antara blob
      # turun ke 0.18 dari puncaknya, dan penilaian atas gambarnya menyebutnya
      # persis begitu — "string of pearls". Pada tata letak 16-blob sekarang
      # celah itu 0.77.
      #
      # Versi pertama gerbangnya memakai perbandingan terang/gelap dan **buta
      # justru pada cacat yang diklaimnya**: opasitas blob terbesar 0.54, jadi
      # puncaknya tersaturasi sementara celahnya tidak, dan versi 16-blob
      # terukur *lebih buruk* (1.13) daripada 8-blob (0.15) — persis terbalik.
      # Harness ini menuntut gerbangnya merah pada tata letak lama, dan tetap
      # merah pada mutasi paling tajam: 8 titik @45° pada lebar **sekarang**,
      # yang berbeda hanya jaraknya.
      - name: Buktikan gerbang cangkang nebula planetari berbunyi
        run: python3 Tools/bukti-mutasi-cangkang.py

      # Dan bukti yang sama untuk **bentuk lengan spiral** — gerbang yang
      # lahir dari lubang yang paling sulit dilihat: gerbang lengan yang sudah
      # ada (`check_spiral_arms_stay_continuous`) benar, dan ia merah kalau
      # lengannya dihapus dari model. Yang tidak bisa dilihatnya adalah
      # **bentuk**.
      #
      # Terukur: tata letak `.spiralGalaxy` diganti dengan **cincin** —
      # jari-jari blob lengan sama persis, tiap jari-jari disebar merata ke
      # delapan arah — dan seluruh **45 pemeriksaannya hijau**. Cincin adalah
      # kebalikan dari galaksi berlengan: M51 dan M101 dikenali justru dari
      # lengannya yang melengkung. Dan tata letak cincin bukan karangan — itu
      # bentuk yang dihasilkan cacat yang paling mungkin terjadi saat
      # menyunting spiral, menyalin satu titik lengan dan memutarnya alih-alih
      # melanjutkan kurvanya.
      #
      # Gerbang lama buta di sana karena mengukur "ada goresan terang di
      # jari-jari ini", dan cincin punya goresan terang di **setiap**
      # jari-jari. Gerbang barunya mengukur yang membedakan keduanya:
      # **pergeseran sudut punggungannya**. Diukur pada ukuran jam — spiral
      # asli +88°, cincin 8 arah +0°, cincin 4 arah −2°, cakram polos −2°,
      # lengan dihapus −2°.
      #
      # Keadaan 5 ("lengan diredupkan sampai tak terlihat") sengaja ada: ia
      # **hijau** di pemeriksaan pergeseran (+79°, murni kebisingan karena
      # profilnya nyaris rata) dan hanya merah di lantai kekuatan punggungan.
      # Tanpa keadaan itu, lantai tersebut bisa dihapus dan tidak ada satu pun
      # keadaan di sini yang akan tahu.
      #
      # Keadaan 7 ("dicerminkan") **wajib hijau**, dan itu batas yang
      # dinyatakan: gerbangnya mengukur ada-tidaknya lengkungan, bukan arah
      # putaran.
      #
      # Keadaan 8–11 memutasi **berkas gerbangnya sendiri**, bukan port render:
      # yang diuji di sana bukan gambarnya melainkan **angka yang ditulis
      # tentang gambar itu**. Gerbang ini lahir dengan dua tabel angka di
      # berkas yang sama yang saling bertentangan (+111° lawan +88° untuk
      # pengukuran yang sama) dan tidak satu pun cocok dengan render — cincin 4
      # arah tertulis 13.1 padahal 16.0, cakram polos tertulis 14.0 padahal 0.0,
      # dan "redup 10% memberi +160°" padahal +79°. Gerbang paritas
      # `check_spiral_arm_docstring_quotes_measured_values` menutupnya, dan
      # keempat keadaan ini membuktikan ia berbunyi:
      #
      #   8.  satu angka komentar digeser (gambar tak berubah) → merah
      #   9.  satu dari dua tabel digeser                  → merah (kedua tabel
      #                                                        tak lagi sepakat)
      #   10. **kedua** tabel digeser bersama-sama         → merah (sepakat,
      #        tapi sama-sama salah: arah 1 saja tidak cukup)
      #   11. ambang lantai digeser, tak dikutip di tabel  → WAJIB HIJAU
      #
      # Keadaan 11 yang menjaga gerbangnya tetap berarti: tanpa dia, gerbang
      # yang berbunyi pada **setiap** suntingan berkas ini akan terlihat sama
      # dengan gerbang yang berbunyi pada angka yang melenceng.
      - name: Buktikan gerbang bentuk lengan spiral berbunyi
        run: python3 Tools/bukti-mutasi-lengan.py

      # Dan bukti untuk gerbang **inti bintang gugus** — gerbang yang versi
      # pertamanya hijau pada gugus tanpa satu pun bintang.
      #
      # Versi pertama hanya mengukur puncak inti di atas lengkungan sekitarnya,
      # pada **satu** render. Lengkungan itu milik **kabut** yang menaungi
      # inti, bukan intinya, jadi dengan inti dihapus seluruhnya dari port
      # (`for star in []:`) keempat pemeriksaannya tetap hijau — gugus bola
      # 38 pt pada 0.2035 terhadap ambang 0.20. Gerbangnya mengesahkan gugus
      # tanpa bintang dan menyebutnya "inti bintang gugus terbaca".
      #
      # Gerbangnya sekarang mengukur **dua** nisbah, dan harness ini menuntut
      # masing-masing berbunyi pada kelasnya sendiri: kontras (dengan inti vs
      # tanpa inti) menangkap inti yang hilang, ketajaman (puncak di atas
      # lengkungan) menangkap inti yang menyatu dengan halonya. Keadaan #2
      # penting justru karena ia hijau di seluruh pemeriksaan kontras — tanpa
      # dia, `MIN_CLUSTER_CORE_SHARPNESS` tidak dijaga siapa pun.
      - name: Buktikan gerbang inti bintang gugus berbunyi
        run: python3 Tools/bukti-mutasi-inti-gugus.py

      # Dan bukti untuk **M27 sebagai cangkang yang dipetkan**, bukan cangkang
      # bulat: siluet yang memipih, lubang yang tetap terbuka, dan — yang baru
      # dan paling mudah hilang — **model yang berhenti memetkan sementara port
      # tetap memetkan**. Yang terakhir itu tidak bisa dilihat pemeriksaan
      # siluet mana pun, karena semuanya membaca port: port menggambar M27
      # memanjang, jam menggambarnya bulat, dan tidak satu pun PNG berubah.
      # Hanya gerbang drift antar-bahasa yang melihatnya, dan sampai siklus ini
      # komponen y cangkang tidak punya gerbang drift sama sekali — cangkangnya
      # belum pernah dipetkan.
      - name: Buktikan gerbang Dumbel (M27) berbunyi
        run: python3 Tools/bukti-mutasi-dumbel.py

      # Dan bukti untuk gerbang **bola netral planet tak dikenal** — jalur
      # jujur PRD di kelas planet, yang tidak dijaga siapa pun.
      #
      # Seluruh `build_cases()` disaring terhadap nama yang pernah disebut
      # `check-visuals.py`: dua kasus tidak pernah disebut, dan
      # `planet-unknown-confirmed` salah satunya. Terukur: mengganti cabang
      # `planet is None` dengan palet Mars — di port **dan** di view —
      # menghasilkan 0 piksel berbeda dari gambar Mars, dan seluruh 654
      # pemeriksaan tetap hijau. Jadi engine bisa menampilkan bola Mars untuk
      # planet yang tidak dikenali, menyatakan identitas yang tidak
      # dimilikinya, tanpa satu pun gerbang berbunyi.
      #
      # Keadaan #2 dan #3 penting justru karena keduanya **tidak menggerakkan
      # satu piksel pun**: yang diukur gerbang piksel adalah port, sedangkan
      # yang dikirim ke jam adalah view. Tanpa keduanya, sisi view bisa
      # menyimpang dari port tanpa ada yang tahu.
      - name: Buktikan gerbang bola netral planet tak dikenal berbunyi
        run: python3 Tools/bukti-mutasi-bola-netral.py

      # Dan bukti untuk gerbang **piringan kedua Saturnus** — gerbang yang
      # menutup kelas cacat yang tidak bisa dilihat gerbang lain mana pun.
      #
      # `drawPlanet` menggambar bola 1.0 R, lalu `drawRings` menggambar
      # bolanya sendiri pada 0.53 R; yang sampai ke layar dua piringan
      # bersarang, dan cakram 1.0 R-nya bocor ke seluruh frame di luar bidang
      # cincin. Gerbang terdekat ("cincin lebih lebar dari bola", ambang
      # `reach > 0.8`) **buta** terhadapnya: cakram bocor itu sendiri
      # menjangkau 1.0 R, jadi ambangnya dilewati — terukur, gerbang itu tetap
      # hijau bahkan ketika cincinnya dihapus seluruhnya.
      #
      # **Harness ini sempat tidak berjalan di CI sama sekali**, dan itu
      # bentuk kegagalan yang khas: berkasnya ada, isinya benar, dan tidak ada
      # yang mengeksekusinya. Ia ditemukan karena daftar `Tools/bukti-mutasi-*`
      # di disk (13) tidak sama dengan yang dirujuk alur kerja (12).
      - name: Buktikan gerbang piringan kedua Saturnus berbunyi
        run: python3 Tools/bukti-mutasi-piringan.py

      # Dan bukti untuk gerbang **urutan cincin Saturnus** — paruh belakang
      # harus tergambar sebelum bola, sehingga bola menutupinya.
      #
      # Kelas cacatnya adalah kebalikan dari piringan kedua di atas: yang itu
      # **menonjol keluar**, yang ini **menutupi ke dalam**. Dua pemeriksaan
      # cincin yang sudah ada menyampel hanya di luar bola
      # (`saturn_ring_band_values` membuang `abs(xr) <= body + 0.02`), jadi
      # keduanya buta pada urutannya. Terukur: seluruh enam pemeriksaan
      # Saturnus dijalankan ulang dengan urutan dibalik, dan **nol** di
      # antaranya berubah warna — sementara gerbang baru merah di 1 533
      # piksel di dalam bola (@200px) dan 232 (@76px, ukuran kartu jam).
      #
      # Keadaan #2 adalah arah sebaliknya, dan justru yang paling penting:
      # tanpa gerbang pasangannya, cara termurah memenuhi "nol piksel di dalam
      # bola" adalah berhenti menggambar paruh belakang sama sekali. Ia harus
      # menyalakan **hanya** gerbang urutan, bukan gerbang tetangganya.
      #
      # Keadaan #3 membuktikan sisi **view** diperiksa, bukan cuma diklaim:
      # piksel port tidak berubah di sana (gerbang gambar mengukur port), jadi
      # hanya pemeriksaan urutan teks yang bisa melihatnya.
      - name: Buktikan gerbang urutan cincin Saturnus berbunyi
        run: python3 Tools/bukti-mutasi-urutan-cincin.py

      # Dan bukti untuk **angka di docstring** gerbang urutan cincin itu.
      #
      # Gerbangnya hijau pada hari ditulis, dan docstringnya memuat lima
      # angka sebagai bukti mengapa ambangnya layak dipercaya. Empat di
      # antaranya **tidak pernah dihasilkan alat ukurnya**:
      #
      #     49,7% (24 064 dari 48 400)      dikutip: 50% (110 dari 220)
      #     36 hasil tetangga               dikutip: 35
      #     margin 0 -> 14 px @200 / 6 @76  dikutip: "nol piksel"
      #     cacat @76px -> 232 px           dikutip: 245 px
      #
      # Yang paling merusak bukan selisihnya, melainkan **arahnya** pada
      # margin: kalimat aslinya menyatakan kode yang benar memberi nol piksel
      # di dalam bola pada `margin 0`, sehingga ambangnya terbaca aman-saja.
      # Kebalikannya yang benar — pada `margin 0` kode yang benar memberi 14
      # dan 6 piksel (anti-aliasing di limb), dan ambang 0,02 R-lah yang
      # membuatnya nol. Tanpa ambang itu gerbangnya merah pada gambar benar.
      #
      # Gerbang paritas `check_saturn_ring_order_docstring_quotes_measured_values`
      # menutupnya dengan menghitung ulang keempat angka. Harness ini
      # membuktikan ia **bisa merah**, satu keadaan per angka — karena
      # keempatnya punya jalan berbeda menuju kesalahan, dan satu mutasi
      # hanya membuktikan satu jalan.
      - name: Buktikan gerbang angka docstring urutan cincin berbunyi
        run: python3 Tools/bukti-mutasi-angka-urutan-cincin.py

      # Dan bukti untuk gerbang **setengah-lebar spike bintang**.
      #
      # `spikeRootWidthFactor` (0.18) dan `spikeTipWidthFactor` (0.035)
      # adalah lebar **penuh**; kedua bahasa mengalikannya `0.5` sebelum
      # dipakai sebagai setengah-lebar. Angka itu yang menjaga spike terbaca
      # sebagai cahaya, bukan penanda bidik.
      #
      # Sampai siklus ini **hanya port** yang dijaga
      # (`check_port_constants_reach_the_drawing` menuntut `* 0.5` di sana),
      # sedangkan sisi view tidak dijaga apa pun. Terukur: menghapus `* 0.5`
      # dari kedua baris view meninggalkan **22 pemeriksaan bintang hijau,
      # 0 merah** — termasuk `check_star_geometry_matches_the_model` dan
      # `check_star_pulse_reaches_the_picture`. Kelasnya sama dengan celah
      # klem opasitas bibir kawah: klem yang hidup di satu bahasa saja.
      #
      # Harness ini membuktikan gerbang barunya bisa merah, satu keadaan per
      # baris (pangkal, ujung) plus sisi port dan satu kontrol negatif —
      # karena kedua baris ditulis terpisah dan satu mutasi hanya membuktikan
      # satu jalan.
      - name: Buktikan gerbang setengah-lebar spike bintang berbunyi
        run: python3 Tools/bukti-mutasi-setengah-spike.py

      # Dan bukti untuk gerbang **ciri planet berfase tidak bocor ke sisi
      # gelap** — akibat dari pemotongan yang tidak diukur siapa pun.
      #
      # Kawah Merkurius dan kabut Venus digambar di dalam pita yang menyala di
      # kedua bahasa, tapi sampai gerbang ini ada, tidak satu pun dari 666
      # pemeriksaan mengukur **akibatnya**. Terukur: melepas `inside_lit` dari
      # pemanggilan `_draw_craters` di port membuat kawah melompat keluar
      # sabit — 2004 piksel menyala di belahan gelap pada 200 px, 71 di ukuran
      # kartu jam — dan seluruh `check-visuals.py --check` tetap 0 gagal.
      # Untuk Venus, melepas potongan kabutnya mengisi seluruh belahan gelap:
      # 14714 piksel pada 200 px.
      #
      # Keadaan #3 adalah arah sebaliknya, dan justru yang paling penting:
      # tanpa gerbang pasangannya, cara termurah memenuhi "nol piksel di
      # belahan gelap" adalah berhenti menggambar cirinya sama sekali. Ia harus
      # menyalakan **hanya** gerbang "masih tergambar", bukan gerbang
      # pemotongan — kalau keduanya berbunyi, gerbangnya tidak memisahkan
      # "dipotong" dari "dihapus", dan itu dua perbaikan yang berlawanan arah.
      - name: Buktikan gerbang ciri planet berfase tidak bocor berbunyi
        run: python3 Tools/bukti-mutasi-fase-ciri.py

      # Dan bukti untuk gerbang **maria Bulan tidak bocor ke belahan gelap**
      # — kelas yang tidak bisa ditutup gerbang planet berfase.
      #
      # Gerbang itu mengukur piksel **menyala** di belahan gelap terhadap
      # latar sudut frame. Piringan gelap Bulan (moonUnlit 0.13) lebih terang
      # dari latar (0.058), jadi memasukkannya ke daftar kasus planet
      # berfase akan melaporkan 14714 piksel "menyala" di belahan gelap pada
      # berkas yang BERSIH — seluruh piringan gelapnya, bukan maria. Bercak
      # gelap yang bocor karena itu butuh ukuran lain: selisih terhadap
      # gambar tanpa ciri itu. Terukur dengan ukuran itu: melepas klip maria
      # di port memunculkan 5516 piksel di belahan gelap pada 200 px dan 236
      # di ukuran kartu jam, sementara `check-visuals.py --check` tetap
      # 688 pemeriksaan, 0 gagal.
      #
      # Keadaan #2 adalah arah sebaliknya, dan justru yang paling penting:
      # tanpa gerbang pasangannya, cara termurah memenuhi "nol piksel di
      # belahan gelap" adalah berhenti menggambar maria sama sekali. Ia harus
      # menyalakan **hanya** gerbang "masih tergambar", bukan gerbang
      # kebocoran — kalau keduanya berbunyi, gerbangnya tidak memisahkan
      # "dipotong" dari "dihapus".
      - name: Buktikan gerbang maria Bulan tidak bocor berbunyi
        run: python3 Tools/bukti-mutasi-maria.py

      # Dan bukti untuk gerbang **cembung mengecil (f > 0.5, waning)** —
      # satu-satunya cabang fase yang tidak dibaca gerbang mana pun.
      #
      # `check_phase_direction_on_the_waning_half` menjaga jalur `waning`,
      # tetapi hanya pada kasus **sabit**; `check_moon_phase_fraction` hanya
      # menjalankan `is_waxing=True`. Cembung mengecil jatuh di celah
      # keduanya. Terukur: membalik tanda `terminator_offset` pada f > 0.5
      # mengubah 13.944 piksel, meruntuhkan luas tersinari 0,715 -> 0,275,
      # dan **nol** dari 14 pemeriksaan fase yang ada menjadi merah.
      #
      # Keadaan #2 menuntut pemeriksaan **arah** berbunyi sendiri: tanpa dia,
      # menggambar piringan penuh untuk setiap fase akan memenuhi lantai
      # luasnya (1,0) sementara gambarnya tidak lagi punya fase sama sekali.
      - name: Buktikan gerbang cembung mengecil berbunyi
        run: python3 Tools/bukti-mutasi-cembung-mengecil.py

      # Dan bukti untuk gerbang **lengkung piringan Bulan** — cacatnya bukan
      # bahwa gerbangnya longgar, melainkan bahwa dua pemeriksaan terakhirnya
      # **berbohong**.
      #
      # `check_moon_disc_keeps_its_curvature` menuntut view "membaca radius
      # akhir gradien dari model, bukan menulis angkanya" dengan mencari
      # `CelestialVisual.moonSphereGradientEndRadius` di **seluruh berkas**
      # view. Berkas itu memuat dua pemanggil konstanta yang sama:
      # `sphereGradient` (jalur Bulan, baris 178) dan `drawPlanet` (jalur
      # planet, baris 265). Terukur: mengganti baris 178 saja menjadi literal
      # membiarkan ketiga gerbang hijau — baris 265 menyumbang tokennya,
      # gerbang planet hanya melihat `drawPlanet`, dan pikselnya mengukur
      # port yang tak diubah.
      #
      # Dua cacat berikutnya ditemukan **oleh** harness ini, bukan oleh
      # gerbangnya. (1) Pemeriksaan "tidak menulis angkanya sendiri" mencari
      # `radius * 1.15`, padahal kode Swift nyata menulis
      # `radius * CGFloat(1.15)` — polanya tidak pernah cocok, jadi
      # pemeriksaan itu hijau persis pada keadaan yang ia ada untuk
      # menangkapnya, di **kedua** gerbang. (2) Sisi port tidak punya
      # penjaga sama sekali: mengganti pemakaian di `_moon_sphere_gradient`
      # menjadi literal tidak menggerakkan satu pun pemeriksaan, karena
      # gambarnya identik.
      #
      # Tujuh keadaan, termasuk keadaan yang **wajib hijau** (jalur planet
      # diubah, jalur Bulan utuh — kalau kedua pemeriksaan sama-sama memerah,
      # berarti pembatasan tubuh fungsi tidak bekerja).
      - name: Buktikan gerbang lengkung piringan Bulan berbunyi
        run: python3 Tools/bukti-mutasi-lengkung-bulan.py

      # Dan bukti untuk gerbang **penambahan opasitas inti gugus** — kelas
      # cacat yang sama dengan lengkung piringan Bulan di atas: satu angka,
      # dua bahasa, nol penjaga.
      #
      # `0.25` hidup sebagai literal di `core.opacity(min(1, star.opacity +
      # 0.25))` (view) dan `op + 0.25` (port). Terukur
      # (`Tools/bukti-mutasi-inti-opasitas.py`):
      # menggantinya di **view** membiarkan seluruh 22 gerbang yang membaca
      # berkas view hijau — 0 merah — jadi jam bisa kehilangan inti gugusnya
      # tanpa suara. Menggantinya di **port** berbunyi, tetapi **bukan karena
      # gerbang yang menyebut angka ini**: yang merah adalah docstring yang
      # mengutip piksel yang kebetulan bergeser, dan itu berhenti berbunyi
      # begitu docstring-nya disunting.
      #
      # Empat keadaan, termasuk satu yang **wajib hijau** pada pemeriksaan
      # kesamaan (model dan port berubah bersama: tidak ada penyimpangan).
      - name: Buktikan gerbang penambahan opasitas inti gugus berbunyi
        run: python3 Tools/bukti-mutasi-inti-opasitas.py

      # Dan bukti untuk gerbang **riak maria** — kelas yang sama sekali berbeda
      # dari yang di atas: bukan satu angka, melainkan **larik 11 pasangan**
      # yang hidup di dua bahasa dan tidak terbaca bentuknya oleh gerbang yang
      # ada.
      #
      # `check_feature_arrays_match_the_view` membaca larik **triple**
      # (`dx, dy, size`) lewat `swift_tuple_triples`; `mariaRipple` adalah
      # larik **pasangan** (amplitudo, fase), jadi ia lolos dari bentuk
      # pembacanya. `check_port_matches_swift_constants` hanya membandingkan
      # konstanta yang **didaftarkan** di `checks`, dan `mariaRipple` tidak ada
      # di sana. Akibatnya terukur: mengubah riak di view saja membuat jam
      # menggambar siluet yang tidak pernah diukur 729 pemeriksaan piksel.
      #
      # Empat keadaan, dua di antaranya **arah berlawanan** (view vs port) —
      # karena gerbang yang hanya membaca satu berkas akan lolos kalau cuma
      # satu arah yang diuji. Keadaan keempat **wajib hijau**: kedua bahasa
      # berubah bersama berarti tidak ada penyimpangan, dan gerbang yang merah
      # di situ sedang menyematkan nilai, bukan menjaga kesepakatan.
      - name: Buktikan gerbang riak maria berbunyi
        run: python3 Tools/bukti-mutasi-riak-maria.py

      # Dan bukti untuk gerbang **setiap gerbang wajib mengisi results** — kelas
      # cacat yang tersisa diam tanpa ia ada: `check_feature_arrays_match_the_view`
      # pernah mencapai `main` sebagai docstring tanpa tubuh (nol `results.append`,
      # dipanggil, menyumbang nol pemeriksaan) dan lolos dari **tiga** gerbang
      # meta yang sudah ada. Gerbang ini menutup kelasnya, dan harness di bawah
      # membuktikan ia berbunyi pada empat keadaan — termasuk keadaan di mana
      # `results.append` hanya hidup di dalam teks (bukan panggilan AST), dan
      # keadaan di mana daftar pengecualian dulu digunakan sebagai tombol
      # bungkam dibuang seluruhnya.
      - name: Buktikan gerbang "setiap gerbang mengisi results" berbunyi
        run: python3 Tools/bukti-mutasi-gerbang-kosong.py

      # Dan bukti untuk gerbang **warna identitas planet saat engine ragu** —
      # kelas cacat yang lolos ke `main` dan baru ketahuan siklus ini.
      #
      # `drawPlanet` sudah lama menutup **ciri** planet saat ragu (`guard
      # isConfirmed` sebelum pita/cincin/kutub), dan itu dijaga
      # `check_features_disappear_when_uncertain`. Yang tidak pernah ditutup:
      # **warna bolanya**, diteruskan apa adanya. Terukur dari piksel: Mars
      # tampil (120, 55, 36) — merah khas Mars — di sebelah lencana "Ragu",
      # dan jarak antar-kandidat tetap 62…112, jadi mata tetap bisa membaca
      # "itu Mars" dari gambar yang seharusnya belum mengklaim apa pun.
      #
      # Gerbangnya sendiri hijau pada hari ia ditulis — itu bukan bukti apa
      # pun. Harness ini yang membuktikannya **bisa merah**, dan merah pada
      # keadaan yang memang salah: lima keadaan, termasuk satu yang **wajib
      # hijau** (batas yang dinyatakan: gerbang membaca piksel paling terang,
      # jadi menetralkan `light` saja sudah memenuhinya walaupun `dark` masih
      # membawa palet planetnya — batas itu direkam, bukan diklaim tertutup).
      #
      # **Harness ini sempat tidak berjalan di CI sama sekali**, dan itu
      # bentuk kegagalan yang persis sama dengan `bukti-mutasi-piringan.py`
      # sebelumnya: berkasnya ada, isinya benar, dan tidak ada yang
      # mengeksekusinya. Ditemukan dengan cara yang sama — membandingkan
      # daftar `Tools/bukti-mutasi-*` di disk dengan yang dirujuk alur kerja.
      - name: Buktikan gerbang warna identitas planet saat ragu berbunyi
        run: python3 Tools/bukti-mutasi-warna-ragu.py

      # Dan bukti untuk gerbang **warna spektral bintang** — dua gerbang yang
      # menamai diri mereka "warna" sementara salah satunya bisa hijau
      # sepenuhnya tanpa satu pun warna sampai ke gambar.
      #
      # `check_star_colour_order` membandingkan `R − B` piksel paling terang
      # antara Betelgeuse dan Rigel. Arah keduanya di dalam
      # `check_star_colour_not_a_claim_when_uncertain` — "dua bintang berbeda
      # tetap berbeda saat yakin" — membandingkan dua **kasus render**, dan
      # kedua kasus itu membawa `relative_size` yang berbeda (0.398 lawan
      # 0.472, karena ukuran memang mengikuti magnitudo). Terukur: dengan
      # `star_rgb` dipaksa mengembalikan satu warna untuk **semua** indeks,
      # arah itu tetap **hijau** — yang terukur adalah besarnya titik, bukan
      # warnanya. Gerbang yang menamai dirinya "warna" sedang mengukur ukuran.
      #
      # Diperbaiki dengan menyamakan `relative_size` (dua probe, hanya
      # `color_index` berbeda), lalu harness ini membuktikan **ketiga**
      # keadaannya bisa merah:
      #
      #   1. warna spektral dibuang di sumber   -> 3 merah (urutan jarak nol,
      #                                            arah "tetap berbeda", dan
      #                                            warna-ragu lawan netral)
      #   2. penjaga keraguan dilewati          -> 2 merah (bintang ragu tidak
      #                                            lagi identik)
      #   3. urutan warna dibalik (panas↔dingin) -> 2 merah di gerbang urutan
      #                                            SAJA; gerbang keraguan tetap
      #                                            hijau — itulah pembeda
      #                                            "warna salah" dari "warna
      #                                            hilang", dan alasan kedua
      #                                            gerbang itu memang ada.
      - name: Buktikan gerbang warna spektral bintang berbunyi
        run: python3 Tools/bukti-mutasi-warna-bintang.py

      # Dan bukti untuk **konversi indeks B−V → RGB bintang**: koefisien yang
      # benar-benar mencapai piksel, dibaca dari kedua bahasa. Saudaranya
      # `bukti-mutasi-warna-bintang.py` sudah menjaga warna *hasil* di layar;
      # ini menutup sisi yang tidak dijaganya — ketujuh koefisien di
      # `CelestialVisual.starRGB` melawan `star_rgb` port. Tanpa ini, "model
      # berubah, port tidak ikut" (cacat dua bahasa yang paling mungkin) lolos
      # tanpa satu pun pemeriksaan berbunyi. Keadaan 5 menutup bentuk paling
      # sunyi: deklarasi utuh, baris tambahan menyalakan ulang warmth.
      - name: Buktikan gerbang konversi warna bintang berbunyi
        run: python3 Tools/bukti-mutasi-konversi-warna.py

      # Dan bukti untuk gerbang ciri planet di mode malam. Empat dari lima
      # ciri pengenal (cincin, kutub, kawah, kabut) diukur hanya di mode
      # siang; `NightVisual` memetakan setiap warna ke kanal merah saja,
      # sehingga ciri yang berhenti digambar di sana hilang tanpa gerbang
      # berbunyi. Harness ini juga membuktikan gerbang baru **tidak mubazir**:
      # pada cacat yang sama, gerbang siang yang sudah ada tetap 0 merah.
      - name: Buktikan gerbang ciri planet di mode malam berbunyi
        run: python3 Tools/bukti-mutasi-ciri-malam.py

      # Dan bukti untuk **keterbacaan ciri planet pada ukuran jam**. Tujuh
      # ciri planet punya bukti geometris di 38 pt, tetapi syaratnya
      # `diff > 0` — satu piksel berbeda pun lolos. Dua ciri punya gerbang
      # kekuatan sendiri; untuk kutub Mars dan kawah Merkurius tidak ada.
      # Harness ini membuktikan gerbang barunya **bisa merah** pada ciri yang
      # dicabut (Merkurius 19,02 -> 0,00; Mars 107,54 -> 0,00) **maupun pada
      # ciri yang digambar terlalu pudar** (0,12x) — arah yang tidak
      # tertangkap gerbang "ada bedanya?". Ia juga mengunci keputusan bahwa
      # **kabut Venus tidak diklaim** (metriknya tidak bergerak saat kabutnya
      # dihapus, karena `venusHaze()` menutupi hampir seluruh piringan).
      - name: Buktikan gerbang keterbacaan ciri planet di ukuran jam berbunyi
        run: python3 Tools/bukti-mutasi-ciri-terbaca.py

      # Dan bukti untuk **jangkauan corona Matahari**, klaim "satu angka, satu
      # sumber" yang tidak dijaga apa pun. Terukur: `sunCoronaReach` di model
      # diubah 1.45 -> 1.60 dan seluruh gerbang Matahari tetap hijau, karena
      # semuanya mengukur gambar **port** sementara yang menyimpang adalah
      # **view**. Keadaan 5 menutup bentuk yang paling sunyi: pemakaian
      # diganti literal (angka masih benar, jadi tak satu pun gerbang angka
      # berbunyi) -- yang hilang cuma ikatannya.
      - name: Buktikan gerbang jangkauan corona Matahari berbunyi
        run: python3 Tools/bukti-mutasi-jangkauan-corona.py

      # Dan bukti untuk **kekuatan earthshine** — lead yang ditinggalkan
      # siklus corona, dan kelas cacat yang persis sama satu langkah di
      # sebelahnya.
      #
      # Model punya fungsi bernama
      # (`CelestialVisual.earthshineStrength(illuminationFraction:)`),
      # sedangkan port menulis rumusnya **inline** (`strength = 1.0 - f`)
      # sambil mengklaim di komentarnya "sama seperti … di Swift". Terukur
      # dengan `Tools/ukur-earthshine.py`: rumus di **model** diubah
      # `1 - f` -> `(1 - f) * 0.5`, lalu -> `f`, dan **nol dari 8 gerbang
      # Bulan** berbunyi — karena semuanya mengukur gambar port, sementara
      # yang menyimpang adalah view.
      #
      # Bedanya dari kasus corona, dan ini yang membuatnya layak siklus
      # sendiri: arah "port menyimpang" sudah sebagian tertutup
      # `check_earthshine` (terukur: 2 merah saat port diubah sendiri).
      # Yang sama sekali terbuka adalah arah **"model berubah, port tidak
      # ikut"** dan arah **"view berhenti memakai namanya"** — yang kedua
      # menghasilkan 0 merah di seluruh 8 gerbang Bulan, dan hanya bisa
      # dilihat gerbang teks.
      #
      # Keadaan 5 wajib **hijau**: kedua bahasa diubah bersama ke rumus yang
      # sama, jadi tidak ada penyimpangan. Tanpa keadaan itu, harness tidak
      # bisa membedakan "gerbang ini mengukur penyimpangan" dari "gerbang ini
      # mengukur nilainya".
      - name: Buktikan gerbang kekuatan earthshine berbunyi
        run: python3 Tools/bukti-mutasi-earthshine.py

      # Gerbang **keterbacaan piringan bulan baru** (`check_moon_new_disc_reads_on_the_watch`)
      # menutup cacat terukur: pada `moonEarthshine` 0.15 piringan bulan baru jatuh
      # ke 1.32:1 terhadap latar kartu — kartu kosong di ukuran jam. Gerbangnya punya
      # ambang terkalibrasi (2.0:1) tetapi, seperti enam gerbang lain di `check-visuals.py`,
      # belum pernah dibuktikan bisa merah. Harness ini menuntut hasil **bernama**
      # supaya pemeriksaan yang diganti namanya tidak terbaca sebagai "gerbangnya ada".
      # Keadaan 5 (model Swift berubah, port tidak ikut) sengaja diharapkan hijau —
      # itu batas cakupannya, bukan kelulusan: gerbang ini mengukur gambar port, jadi
      # arah "model berubah" tetap terbuka dan tercatat, bukan disangka tertutup.
      - name: Buktikan gerbang keterbacaan bulan baru berbunyi
        run: python3 Tools/bukti-mutasi-piringan-bulan-baru.py

      # Gerbang **skala magnitudo** (`check_magnitude_scale_matches_the_
      # model`): juga nirsaksi, dan yang paling berbahaya dari yang tersisa.
      # `relative_size` — hasil `sizeFromMagnitude` — dipakai untuk warna
      # mode malam **dan** geometri bintang, jadi skala yang menyimpang
      # mengubah kecerahan mode malam yang diukur `check_night_mode_purity`
      # pada piksel yang tidak pernah ada di jam, **dan** membalik urutan
      # terang bintang: satu-satunya informasi yang tersisa setelah mode
      # malam membuang seluruh hue.
      #
      # Tujuh keadaan, semuanya dimutasi dalam bentuk yang **tetap terbaca**
      # parser. Itu disengaja: mutasi yang membuat fungsi tak terbaca
      # (`raw = 1.0`) hanya memerahkan "bentuk terbaca" — parser menyerah,
      # bukan angkanya yang diukur.
      #
      # Keadaan 5 (model dibalik) satu-satunya yang menyalakan "bintang
      # terang digambar lebih besar". Keadaan 6 menuntutnya tetap **hijau**
      # saat port yang dibalik: pemeriksaan itu membaca parameter model,
      # jadi tanpa keadaan 6, "merah di 5" bisa disangka berarti "menangkap
      # pembalikan di kedua bahasa" — padahal tidak. Itu batas cakupan yang
      # dinyatakan, bukan kelonggaran.
      #
      # Kontrol negatif (nama gerbang diubah jadi nama yang tak ada): keluar
      # 1 dengan daftar ketidakcocokan. Diperlukan karena versi pertama
      # harness ini hanya **mencetak** ketidakcocokan tanpa mencatatnya ke
      # `failures`, sehingga ia keluar 0 — selalu hijau — sementara semua
      # keadaannya gagal.
      - name: Buktikan gerbang skala magnitudo berbunyi
        run: python3 Tools/bukti-mutasi-skala-magnitudo.py

      # Dan bukti untuk **enam gerbang piksel yang tidak punya bukti sama
      # sekali** — ditemukan dengan membandingkan daftar `def check_*` di
      # `check-visuals.py` terhadap seluruh `check_*` yang dirujuk kedua
      # puluh satu harness `bukti-mutasi-*.py`. Yang nirsaksi bukan gerbang
      # pinggiran: mode malam (hijau/biru **nol**), "malam tak pernah lebih
      # terang dari siang", pita Jupiter menjangkau tepi bola, kutub Mars
      # menempel tepi, dan "fase tak dihitung bukan bulan baru".
      #
      # Harness ini menuntut **pemeriksaan bernama**, bukan sekadar "ada yang
      # merah", dan itu menemukan satu hal yang tidak terlihat sebelumnya:
      # pada keadaan 6 (fase tak diketahui kembali jadi piringan gelap rata),
      # pemeriksaan yang berbunyi **bukan** yang menamai cacatnya. Yang
      # menangkapnya adalah "piringan tak-diketahui di antara gelap &
      # terang"; arah "bukan bulan baru" tetap hijau, karena piringan gelap
      # itu masih membawa earthshine sehingga tetap berbeda dari `moon-new`.
      # Tanpa menuntut nama, harness akan melaporkan bahwa arah itu yang
      # menangkapnya — dan itu salah.
      - name: Buktikan gerbang piksel tanpa-bukti berbunyi
        run: python3 Tools/bukti-mutasi-gerbang-nirsaksi.py

      # Dan bukti untuk **tiga kawat fase** di berkas yang sama — kawat yang
      # versi pertama Aturan 31 lewatkan sambil mengutipnya di komentarnya.
      # Sembilan keadaan: tiga kawat x dua bentuk (argumen di-`nil`-kan, dan
      # nilainya di-`nil`-kan di baris penugasan) x dua cabang benda (planet,
      # Bulan), plus `isWaxing` yang diperiksa sebagai nilai.
      #
      # Diukur pada port, satu kawat dimatikan per keadaan, lalu seluruh 31
      # aturan UI dijalankan — semuanya tetap **hijau**:
      #   `brightLimbAngleRadians` (planet) -> nil : 10.254/40.000 (25,6%)
      #   `planetIlluminationFraction`       -> nil : 31.604/40.000 (79,0%)
      #   `moonIlluminationFraction`         -> nil : 31.604/40.000 (79,0%)
      #   `brightLimbAngleRadians` (Bulan)   -> nil :  8.686/40.000 (21,7%)
      #   `waxing` cabang Bulan              -> nil : 31.604/40.000 (79,0%)
      #   `waxing` cabang planet             -> nil : 31.604/40.000 (79,0%)
      #   `isWaxing:` (argumen)              -> nil : 31.604/40.000 (79,0%)
      #
      # Yang terakhir paling memalukan dan pelajarannya umum: kawat itu
      # diperiksa sebagai `"isWaxing:" in code`, yaitu **keberadaan namanya**,
      # sehingga `isWaxing: nil` hijau. Pemeriksaan yang mencari nama tidak
      # pernah bisa menangkap nilai yang salah.
      #
      # Yang fraksi paling parah: seluruh pita terang hilang dan benda
      # berfase tergambar sebagai **bola penuh** di setiap keadaan, termasuk
      # saat engine baru menghitung iluminasinya 0,22 — gambar yang
      # menyatakan kebalikan dari yang dihitung engine.
      #
      # Bentuk keduanya lebih halus: nilainya di-`nil`-kan di baris penugasan
      # dengan argumen tetap utuh, jadi pembaca yang hanya melihat argumennya
      # tidak melihat apa pun.
      #
      # Harness ini **tidak** memutasi sumber produksi: ia mengekstrak program
      # Aturan 31 dari `swift-ui-lint.sh` dan menjalankannya atas salinan
      # kawat yang dimutasi di direktori sementara.
      - name: Buktikan gerbang kawat fase Aturan 31 berbunyi
        run: python3 Tools/bukti-mutasi-aturan31-kawat.py

      # Aturan 31 juga harus menangkap **planet yang salah**, bukan hanya `nil`.
      # Kawat lama hanya membuktikan "fase hilang"; cacat yang lolos adalah
      # bentuk yang tetap sah: `CelestialVisual.Planet.venus` — bukan nil, tidak
      # hijau, tidak ada teks di layar yang bisa membantahnya. Harness ini
      # memasang planet tetap lalu mengulangnya tanpa pemeriksa identitas,
      # sehingga "berbunyi" tidak bisa diklaim sebagai bukti.
      - name: Buktikan Aturan 31 menangkap planet yang salah, bukan hanya nil
        run: python3 Tools/bukti-mutasi-planet-tetap.py

      # Aturan 32 menutup celah yang **terbukti tak terlihat**: baris
      # `if !isConfirmed { drawCandidateMarker(...) }` — satu-satunya penanda
      # di layar bahwa engine ragu — dihapus seluruhnya, lalu seluruh 31
      # aturan UI dan `./swift-typecheck.sh` dijalankan: keduanya lulus, exit
      # 0. `swift test` tidak bisa menolong karena berkas ini hidup di
      # `Apps/`, yang tidak dibangun runner Linux.
      #
      # Harness ini membuktikan aturan barunya berbunyi pada empat keadaan:
      # lencana dihapus, lencana tanpa syarat `!isConfirmed` (kebohongan pada
      # arah sebaliknya), cincin Saturnus bocor ke kandidat, dan satu kontrol
      # negatif. Program aturannya **diekstrak** dari `swift-ui-lint.sh`, bukan
      # disalin — menyalinnya membuat harness mengukur salinan yang tetap
      # hijau walau aturan aslinya dilonggarkan.
      - name: Buktikan gerbang lencana ragu Aturan 32 berbunyi
        run: python3 Tools/bukti-mutasi-lencana-ragu.py

      # Aturan 32 menjaga bahwa lencana itu **digambar**, bukan bahwa
      # warnanya benar. Sisi warnanya bocor lewat `Color.black.opacity(0.55)`
      # lewat `shadowAccent(...)`, yang tidak memetakan apa pun: di mode malam
      # lencana "engine belum pasti" jadi satu-satunya piksel bukan-merah di
      # layar. Gerbang warna Aturan 15 buta terhadapnya karena `Color.black`
      # adalah nama, bukan angka prosedural.
      #
      # Tokennya kini hidup di `CandidateMarker` (PointingKit) dan diuji
      # `CandidateMarkerTests` di Linux. Harness ini membuktikan uji itu
      # **berbunyi**: (1) isi lencana membawa hijau & biru seperti warna lama,
      # (2) cabang malam mengembalikan merah siang — keadaan ini sempat hijau
      # dan menyingkap uji yang tidak mengukur selisih malam/siang sama
      # sekali, jadi ia yang membuat uji itu ada, (3) simbol `?` diganti huruf
      # biasa. Keadaan 2 dan 3 tidak bisa saling menggantikan: 2 menjaga
      # terangnya, 3 menjaga bentuknya, dan mode malam membuang hue sehingga
      # yang tidak dijaga bentuknya akan hilang bersama warnanya.
      - name: Buktikan uji token lencana ragu berbunyi
        run: python3 Tools/bukti-mutasi-token-lencana.py

      # Aturan 33 (`SlewVerdictBanner`): ikon dan warna putusan GoTo harus
      # diambil dari putusannya, bukan ditulis di view. Empat keadaan —
      # ikon tetap, nada tetap, nada dihitung-lalu-dibuang, dan satu kontrol
      # negatif (baris `Image` diganti nama). Keadaan 1-3 tidak bisa saling
      # menggantikan: 1 menguji ikon, 2 warna, 3 bahwa warna itu benar-benar
      # sampai ke gambar.
      - name: Buktikan gerbang bobot putusan GoTo Aturan 33 berbunyi
        run: python3 Tools/bukti-mutasi-bobot-goto.py

      # Aturan 34 (penjaga identitas): enam aksesor model menerima
      # `isConfirmed:` supaya bisa menolak mengklaim identitas saat engine ragu
      # (warna bintang, morfologi kabut, palet planet, dan ketiga jalur
      # suaranya), plus `phaseGeometry(waxing:)` yang menerima `Bool?` dengan
      # alasan yang sama (`nil` = jangan pilih sisi). Sepuluh keadaan — tujuh
      # mutasi di dua berkas berbeda, plus dua kontrol negatif yang harus tetap
      # hijau (literal sah di `OnboardingView`/`#Preview`, dan aksesor tanpa
      # argumen keyakinan). Dua kontrol negatif itu bukan hiasan: gerbang yang
      # memerah pada kode yang benar akan dilonggarkan orang, dan gerbang yang
      # dilonggarkan tidak menjaga apa pun.
      - name: Buktikan gerbang penjaga identitas Aturan 34 berbunyi
        run: python3 Tools/bukti-mutasi-penjaga-identitas.py

      # Aturan 35 (fakta vs literal): berkas yang **membaca** sebuah fakta Bool
      # dari penerima tidak boleh mengirim literal `true`/`false` untuk
      # parameter itu di berkas yang sama. Cacatnya diukur pada `PointingView`:
      # ikon membaca `link.isReachable`, suara membaca
      # `LinkStatusText.linkSpeech(isReachable:)` — argumen suara diganti
      # `true`, dan lint lulus, typecheck lulus, 755 uji hijau. Ikon bisa
      # berkata "iPhone tidak terjangkau" sementara VoiceOver membacakan
      # "iPhone terhubung". Lima keadaan: tiga cacat di **tiga berkas berbeda**
      # (jalur suara tautan, arah fase planet, rekaman "dari jam") plus dua
      # kontrol negatif yang harus tetap hijau — literal sah pada ilustrasi
      # statis, dan `setSensorAvailable(false)` yang merupakan **perintah**,
      # bukan klaim. Keadaan 3 ada khusus supaya daftar parameternya terbukti
      # dibaca dari model: aturan yang menyalin `isReachable` sebagai
      # satu-satunya nama akan hijau di sana.
      - name: Buktikan gerbang fakta-vs-literal Aturan 35 berbunyi
        run: python3 Tools/bukti-mutasi-fakta-literal.py

      # Aturan 3 (aksara non-Latin) sudah punya saksi satu arah sejak lama:
      # langkah `./red-lint.sh … 'Aturan 3'` di atas membuktikan ia berbunyi
      # pada satu huruf Arab di sebuah `.swift` di `Apps/`. Yang tidak
      # diukur siapa pun adalah **cakupan berkasnya** -- dan itu lubang yang
      # lebih besar: 74 berkas `.py` di `Tools/` dan 2 berkas `.yml` di
      # `.github/workflows/` tidak pernah dipindai satu kali pun (cakupan
      # 168 -> 245 berkas sesudah diperluas). Di sanalah prosa Indonesia repo
      # ini paling padat, dan huruf Arab yang dulu benar-benar menyelinap
      # masuk ke `swift-ui-lint.sh` datang lewat **komentar**, yaitu bentuk
      # yang persis sama.
      #
      # Tujuh keadaan x dua cakupan: keadaan 2 dan 3 wajib hijau pada cakupan
      # LAMA dan merah pada cakupan baru, sehingga perluasan cakupannya
      # terbukti yang menutupnya. Empat kontrol negatif menyatakan batasnya
      # (Yunani yang dipakai sebagai simbol matematis, tanda baca non-ASCII,
      # dan `.md` yang mengutip aksara sebagai bukti cacat).
      #
      # Catatan metode, karena ia sendiri menemukan cacat: sapuan "aturan mana
      # yang nirsaksi" yang menyilangkan `Aturan N` di `swift-ui-lint.sh`
      # dengan berkas `bukti-mutasi-*.py` **menjatuhkan** Aturan 3 diam-diam
      # -- saksi berbentuk langkah `red-lint.sh` tidak hidup di berkas mana
      # pun di direktori itu. Aturan 2, 26, 28, dan 29 tetap terukur nirsaksi
      # sesudah metode itu diperbaiki.
      - name: Buktikan Aturan 3 berbunyi pada aksara terselip
        run: python3 Tools/bukti-mutasi-aturan3-aksara.py

      # Dan gerbang yang **menutup kelas cacat yang paling sering dibayar repo
      # ini**: mutasi harness yang tertinggal hidup di sumber produksi.
      #
      # Kelasnya sudah dua kali mendarat di `main`. Setiap harness
      # `bukti-mutasi-*.py` memutasi berkas produksi dengan sepasang string
      # (`find` harus ada, `replace` jadi gantinya) dan memulihkannya di
      # `finally` plus handler `SIGINT`/`SIGTERM` — tetapi **`SIGKILL` dan
      # timeout melewati keduanya**. Mutasi lalu tertinggal hidup.
      #
      # `mutasi_sumber.require_clean_sources` menahan akibatnya selama mutasi
      # itu **belum ter-commit**; begitu ia ikut ter-commit, berkas itu menjadi
      # HEAD, dan penjaganya puas selamanya. Terukur: `CLUSTER_CORE_HALO_SCALE
      # = 40.0` — nilai `replace` keadaan 2 `bukti-mutasi-inti-gugus.py` —
      # mendarat di `cf3c56b` (commit yang pesannya soal ciri planet) dan baru
      # tertangkap berjam-jam kemudian lewat gerbang drift `port == view`, yang
      # berhasil hanya karena view kebetulan memegang angka yang benar.
      #
      # Gerbang ini mengukur arah yang tidak dilihat siapa pun: **`find` sudah
      # tidak ada sementara `replace` ada.** Satu arah saja ("`find` hilang")
      # akan merah setiap kali jangkar harness diperbarui dengan sengaja —
      # dan itu terjadi rutin di repo ini. Cakupannya dibaca dari AST
      # `STATES` tiap harness (konstanta string **dan** konstanta path
      # di-resolve), bukan dari daftar tangan, supaya tidak jadi salinan kedua
      # yang menyusut diam-diam saat harness bertambah.
      - name: Gerbang jangkar harness (mutasi tertinggal)
        run: python3 Tools/check-jangkar-harness.py

      # Dan bukti bahwa gerbang jangkar di atas berbunyi, bukan sekadar
      # mencetak "OK". Tiga keadaan, dan yang ketiga yang paling berharga:
      #
      #   1. pohon utuh                     -> wajib hijau
      #   2. nilai model diganti persis dengan `replace` sebuah keadaan harness
      #      (`clusterCoreBrighten: Double = 0.25` -> `0.0`, bentuk yang sudah
      #      dua kali mendarat di `main`) -> wajib merah **dan menyebut
      #      harness-nya**; "ada yang merah" tidak cukup, karena keluaran
      #      gerbang ini juga memuat baris "jangkar hilang" yang bukan temuan
      #   3. pembaca `STATES` dilumpuhkan   -> wajib **bukan-nol**
      #
      # Keadaan 3 menemukan cacat **di dalam gerbangnya sendiri** saat
      # ditulis: dengan pembaca jangkar dilumpuhkan, gerbangnya mencetak
      # "OK: 0 jangkar; tidak ada mutasi tertinggal" dan keluar 0 — hijau
      # dengan alasan yang salah, tepat kelas cacat yang ia ada untuk menutup.
      # Gerbangnya sekarang memperlakukan cakupan nol sebagai kegagalan.
      - name: Buktikan gerbang jangkar harness berbunyi
        run: python3 Tools/bukti-mutasi-jangkar-harness.py

      # Penambat "versi lama" harness harus eksplisit dan gagal-tertutup.
      #
      # Dua harness membuktikan **arah kedua** (cacat yang ditutup sebuah
      # perbaikan dulu lolos), dan itu butuh `swift-ui-lint.sh` versi
      # **sebelum** perbaikan. Membacanya punya dua cara yang tampak benar dan
      # keduanya berhenti mengukur **tanpa suara**:
      #
      #   1. `git show origin/main:<berkas>` — penambat yang mengikuti cabang.
      #      Benar hanya selama perbaikannya belum ter-push; begitu sampai ke
      #      `main`, `origin/main` memuat perbaikan itu sendiri, dan arah
      #      kedua membandingkan perbaikan dengan dirinya sendiri.
      #   2. `subprocess.run(["git", "show", ...])` tanpa `-c safe.directory=`.
      #      Di job ini berkas di-checkout sebagai uid lain sementara langkah
      #      berjalan sebagai root, jadi git menolak repo (dubious ownership)
      #      dan hasilnya **kosong**. Skrip kosong sebagai "versi lama"
      #      menemukan nol temuan — yaitu hijau.
      #
      # Keduanya saling menutupi: di mesin pengembang yang berbunyi gejala (1),
      # di CI gejala (2). Karena itu yang dijaga di sini **bentuk
      # pembacaannya**: versi lama wajib lewat `mutasi_sumber.git_show` dengan
      # penambat commit SHA penuh. Terukur di kontainer: pembacaan tanpa
      # `safe.directory` mengembalikan 0 karakter dari 228.017.
      #
      # `fetch-depth: 0` di atas adalah syaratnya: `git show <sha-induk>`
      # tidak terbaca pada checkout satu-commit.
      - name: Gerbang penambat versi lama (gagal-tertutup)
        run: python3 Tools/check-anchor-versi-lama.py

      # Dan bukti bahwa gerbang penambat di atas berbunyi: kedua bentuk cacat
      # itu ditanamkan ke salinan pohon (wajib merah **dan menyebut
      # berkasnya**), sementara pohon utuh wajib hijau — gerbang yang memerah
      # pada kode benar akan dimatikan orang. Keadaan terakhir melumpuhkan
      # pola globnya: gerbang yang tidak menemukan berkas apa pun mencetak
      # "OK: 0 harness" dan keluar 0, jadi cakupan nol harus jadi kegagalan.
      - name: Buktikan gerbang penambat versi lama berbunyi
        run: python3 Tools/bukti-mutasi-anchor-versi-lama.py

      # Dan bukti untuk gerbang **sebutan uji di komentar produksi** — kelas
      # yang sampai siklus ini baru diukur oleh alat yang **tidak pernah
      # dijalankan CI**.
      #
      # Kalimat "dijaga `testX`" adalah **izin** bagi pembaca berikutnya untuk
      # membiarkan sebuah angka; `Tools/ukur-uji-menggantung.py` mengukur
      # keluarganya tetapi tidak dirujuk satu pun langkah alur kerja, dan tidak
      # bisa: `Apps/` tidak dibangun di Linux, jadi tidak ada uji Swift yang
      # bisa menegakkannya. Dua gerbang baru kini hidup di
      # `check-visuals.py --check` (yang memang berjalan di sini): setiap nama
      # uji yang disebut di **komentar** harus punya definisi, dan sumber yang
      # dikirim tidak boleh membawa penanda sementara.
      #
      # Harness ini menemukan **tiga cacat pembaca**, bukan satu, dan ketiganya
      # berbentuk sama: pembaca mencetak nama uji tetapi tidak memeriksanya.
      #
      #   1. penanda `///` menjadi bagian isi token — seluruh dokumentasi
      #      `Apps/` (tempat prosa terpadat) lolos tanpa diperiksa;
      #   2. kutip ganda berpasangan di satu baris membuat pembaca kehilangan
      #      awal string berikutnya, sehingga teks sesudahnya terbaca sebagai
      #      komentar — kontrol negatifnya yang merah;
      #   3. kutip tunggal (literal sah sejak Swift 5.9) tidak dikenal sama
      #      sekali, jadi teks di dalamnya terbaca sebagai kode.
      #
      # Keadaan 8 adalah pengukuran non-vakuositas: pembaca dilumpuhkan, dan
      # ringkasannya **wajib** merah — tanpa itu, gerbang yang berhenti
      # mengukur akan terbaca sama dengan gerbang yang tidak menemukan apa-apa.
      - name: Buktikan gerbang sebutan uji di komentar produksi berbunyi
        run: python3 Tools/bukti-mutasi-ilusi-cakupan.py

      # Bukti untuk Aturan 40 — gambar yang **tidak menyebut** fase denyutnya.
      #
      # Aturan 21 mengukur isi argumen `pulse:`, jadi ia buta pada bentuk yang
      # paling mungkin terjadi: pemanggil yang lupa menulisnya sama sekali.
      # Di situlah ilustrasi onboarding (bintang, layar pertama pengguna)
      # duduk tanpa denyut, dan nol gerbang berbunyi.
      #
      # Harness ini menanam kelalaian yang persis berbentuk begitu — di
      # onboarding, di kartu jam, dan di view yang baru ditambahkan — lalu
      # menuntut Aturan 40 berbunyi; dua bentuk sah dan satu keadaan
      # non-vakuositas menuntut ia diam.
      - name: Buktikan gerbang fase gambar berbunyi
        run: python3 Tools/bukti-mutasi-fase-gambar.py

      # Setiap harness `bukti-mutasi-*.py` di disk wajib dirujuk alur kerja
      # ini. Gerbang yang tidak pernah dijalankan selalu hijau, dan ia menutupi
      # cacat yang justru ditulisnya untuk menangkap — tanpa jejak apa pun di
      # laporan CI. Diukur: 13 berkas di disk, 12 dirujuk (piringan), lalu 17
      # di disk, 16 dirujuk (warna ragu) — dua kali kelas cacat yang sama.
      - name: Setiap harness bukti-mutasi dijalankan CI
        run: python3 Tools/check-harness-terdaftar.py

      # Dan bukti bahwa **gerbang sapu UI sendiri** berbunyi pada hal yang
      # mereka klaim -- dua cacat yang hidup di `main`, dan keduanya kelas yang
      # sama: hijau karena tidak mengukur apa pun.
      #
      # 1. `Aturan 18` (klaim identitas tidak boleh berbaku `true` -- aturan
      #    yang menegakkan larangan PRD paling keras) menuntut `var`/`let`
      #    sebagai token **pertama** di baris. Terukur dengan menyuntik satu
      #    per satu: `private var isConfirmed: Bool = true` HIJAU, begitu pula
      #    `static`, `@State`, `private(set)`, dan `@AppStorage("k")`. Hanya
      #    `var isConfirmed: Bool = true` polos yang tertangkap. Artinya
      #    seluruh properti SwiftUI di `Apps/` -- bentuk yang normal --
      #    tidak pernah dibaca aturan itu, jadi hijau-nya bukan bukti nilai
      #    bawaannya `false`.
      #
      # 2. `red-lint.sh` membuktikan **judulnya sendiri**. Syarat keduanya dulu
      #    `grep -qF "$NEEDLE"` ke seluruh keluaran, dan setiap aturan mencetak
      #    judulnya entah ia menemukan sesuatu atau tidak. Terukur:
      #    `./red-lint.sh WatchTheme.swift '<cacat font>' 'Aturan 31'`
      #    melaporkan "MERAH: gagal pada 'Aturan 31'" dengan exit 0 -- yang
      #    disuntik cacat **font** (Aturan 1), dan Aturan 31 soal arah fase
      #    tidak berhubungan. Keempat langkah `red-lint.sh` di atas karena itu
      #    hanya membuktikan satu hal: lint keluar bukan-nol.
      #
      # Harness ini menjalankan program aturannya **langsung** (bukan lewat
      # `red-lint.sh`), supaya cacat di pembuktinya tidak dilaporkan sebagai
      # cacat di aturannya. Ia mengukur dua arah untuk setiap keadaan: cacatnya
      # harus berbunyi, dan kode yang benar harus diam.
      - name: Buktikan Aturan 18 & red-lint.sh berbunyi pada hal yang diklaim
        run: python3 Tools/bukti-mutasi-aturan18-redlint.py

      # Dan bukti untuk enam aturan sapu yang **belum punya rekam jejak**
      # bahwa ia bisa keluar merah.
      #
      # Terukur: dari 35 aturan di `swift-ui-lint.sh`, hanya 13 yang punya
      # pembuktian (langkah `red-lint.sh` di atas, atau harness khusus). Dua
      # puluh dua sisanya hijau sejak hari ditulis -- dan di repo ini "hijau
      # sejak hari ditulis" sudah berkali-kali berarti "tidak mengukur apa
      # pun". Enam di antaranya dipilih siklus ini karena kegagalannya
      # terlihat pengguna, dan masing-masing punya situs suntik nyata:
      #
      #   Aturan 4  teks UI literal tanpa kunci katalog -- pengguna Bahasa
      #             Inggris membaca Bahasa Indonesia, diam-diam.
      #   Aturan 9  WidgetKit tanpa pemanggil reload -- complication membeku
      #             di objek pertama selamanya, dan tidak ada yang tahu karena
      #             complication hanya ada di perangkat.
      #   Aturan 10 angka uji di README menyimpang dari suite -- janji ke
      #             pembaca yang membusuk tanpa satu gerbang pun berbunyi.
      #   Aturan 14 izin sistem tanpa terjemahan InfoPlist.strings -- dialog
      #             izin berbahasa Indonesia untuk semua pengguna.
      #   Aturan 22 judul baris memakai kunci nilainya -- barisnya terbaca
      #             "Gelap: Gelap" dan tidak pernah menyebut apa yang diukur.
      #   Aturan 25 `CelestialVisual.X` yang bukan anggota -- build merah di
      #             macOS, satu siklus penuh terlambat.
      #
      # Harness ini menyuntik di atas **salinan** pohon (bukan memutasi sumber
      # produksi), dan menuntut dua arah per aturan: cacatnya berbunyi, kode
      # yang benar diam. Tanpa arah kedua, gerbang yang memerah pada segala
      # sesuatu akan lulus -- dan gerbang yang memerah pada kode benar akan
      # dimatikan orang.
      #
      # Dua cacat harness ditemukan saat menulisnya, keduanya lewat mengukur:
      # (1) ia menjalankan `swift-ui-lint.sh` repo dengan `cwd` salinan, padahal
      # skripnya `cd "$(dirname "$0")"` -- jadi ia selalu memeriksa repo
      # sungguhan dan melaporkan seluruh keadaan hijau; (2) salinannya mula-mula
      # hanya `Apps/`, sehingga aturan yang membaca `Packages/`, `project.yml`,
      # atau `Tools/` semuanya berbunyi dan menenggelamkan tanda yang dicari.
      - name: Buktikan tujuh aturan sapu UI berbunyi pada hal yang diklaim
        run: python3 Tools/bukti-mutasi-aturan-ui.py

      # Aturan 29 — kunci katalog yang berdiri di parameter bertipe `String`.
      #
      # `Text` punya dua inisialisator yang berlawanan: `Text("Terkunci")`
      # mencari katalog, `Text(someString)` mencetak apa adanya. Jadi
      # `row(_ title: String, _ value: String)` yang menerima "Keadaan"
      # mencetak kata Indonesia itu di **semua** bahasa, dan terjemahan yang
      # sudah ditulis tidak akan pernah tampil. Tiga gerbang lain menyentuh
      # permukaan ini dan ketiganya hijau: Aturan 4 (literal itu memang ada di
      # katalog), Aturan 6 (tidak melihat `Apps/`), dan Aturan 19 (mencari
      # teks kunci sebagai substring mentah, jadi kemunculannya sebagai teks
      # Indonesia **menghitung sebagai rujukan**).
      #
      # Sebelum harness ini tidak ada satu keadaan pun yang membuktikan Aturan
      # 29 bisa keluar bukan-nol.
      #
      # Dua cacat ketahuan saat menulisnya, keduanya lewat mengukur:
      # (1) salinan `Apps/` saja membuat indeks helpernya runtuh 69 -> 6,
      #     karena aturannya membaca tanda tangan helper dari **kedua** pohon;
      #     gerbangnya lalu melaporkan "Bersih" untuk suntikan yang di pohon
      #     lengkap MERAH -- kegagalan yang berbentuk hijau;
      # (2) satu keadaan arah A memakai `"Laju pergelangan: sudut"` sebagai
      #     "kunci katalog", padahal itu bukan kunci, jadi aturannya benar
      #     untuk diam dan harnessnya menuduh gerbangnya. Sekarang himpunan
      #     kuncinya dibaca dari katalog, dan kunci yang tidak ada
      #     **menghentikan** harness alih-alih dilaporkan hijau.
      #
      # Cakupan yang **tidak** dijangkau dinyatakan sebagai keadaan yang
      # dieksekusi (kunci di dalam interpolasi string; kunci lewat variabel
      # perantara), bukan disangka tertutup: keduanya hijau hari ini, dan
      # kalau kelak cakupannya meluas, harnessnya berhenti sesuai harapan.
      - name: Buktikan Aturan 29 berbunyi pada literal kunci di parameter String
        run: python3 Tools/bukti-mutasi-literal-string-param.py

      # Aturan 28 — label yang salah pada parameter bernilai bawaan.
      #
      # Aturan 28 melaporkan "55 pemanggilan ... cocok dengan deklarasi",
      # kalimat yang terdengar seperti bukti bahwa semuanya diperiksa.
      # Terukur: 4 argumen berlabel di `Apps/` lolos dengan label yang salah,
      # karena `matches()` membebaskan perbandingan label pada parameter yang
      # punya nilai bawaan (`if not ddef and gl != dl`), dan 94 dari 1489
      # statika terindeks punya celah itu.
      #
      # Yang membuat perbaikannya bukan sekadar menghapus `not ddef`: Swift
      # mengizinkan argumen berlabel dalam urutan apa pun, jadi mencocokkan
      # per posisi memerahkan `makeController(location:config:)` — sah, dan
      # ada di `PointingEngine.swift:92`. Keadaan 3 harness ini yang
      # membedakan "per nama" dari "per posisi"; tanpanya, perbaikan yang
      # memerahkan kode benar lulus semua keadaan cacatnya.
      - name: Buktikan Aturan 28 berbunyi pada label di parameter bawaan
        run: python3 Tools/bukti-mutasi-label-bawaan.py

      # Dan bukti untuk Aturan 26 — tingkat terdalam yang tidak pernah
      # dibaca.
      #
      # Aturan 26 mengklaim memeriksa keanggotaan `TipePaket.anggota` di
      # `Apps/`. Hingga siklus ini ia satu-satunya aturan tanpa saksi, dan
      # terukur ia punya cacat diam: `PAIR` memakai awalan negatif
      # `(?<![A-Za-z0-9_.])`, jadi dari `CelestialVisual.Planet.saturn` ia
      # hanya membaca `CelestialVisual.Planet` — anggota yang **paling
      # spesifik** tidak pernah diperiksa. Mengganti `.saturn` menjadi
      # `.salahAnggota` (galat kompilasi yang pasti) membiarkan aturan ini
      # melaporkan "Bersih".
      #
      # Yang membuatnya lebih dari daftar panjang: tingkat terdalam adalah
      # yang paling sering disunting, dan satu-satunya yang menangkapnya hari
      # ini adalah CI macOS — ~4 menit, plus satu push.
      #
      # Tujuh keadaan. Yang paling berharga bukan yang paling mudah:
      #
      #  - keadaan 1 & 2 (3 tingkat) hijau di `origin/main` dan merah sesudah
      #    perbaikan — itulah cacatnya;
      #  - keadaan 3 (2 tingkat) merah di **kedua** versi: arah yang sudah
      #    dijaga sebelum siklus ini, dan perbaikan ini tidak boleh
      #    merusaknya;
      #  - keadaan 4 membuktikan pelewatan `allCases` **bersyarat** pada
      #    konformansi `CaseIterable`, bukan lubang: cabut konformansinya di
      #    model dan baris yang sama menjadi cacat;
      #  - keadaan 5 & 6 menahan bahwa komentar dan literal string bukan kode.
      #
      # Non-vakuositasnya terukur: dengan `DEEP` dikembalikan ke `PAIR`,
      # harness ini merah **persis** pada keadaan 1, 2, dan 4 — dan tidak pada
      # keadaan 3, yang membuktikan keadaan 3 bukan yang menutup cacatnya.
      - name: Buktikan Aturan 26 berbunyi pada anggota berkualifikasi bertingkat
        run: python3 Tools/bukti-mutasi-anggota-bertahap.py

      # Dan bukti untuk Aturan 36 — penjaga identitas yang menerima **faktor
      # yang bukan faktornya**. Dua bentuk cacat yang mengompilasi dan
      # melewati kelima aturan identitas yang sudah ada:
      #
      #     isConfirmed: !isConfirmed    penjaga dibalik: ciri pengenal
      #                                  dipaksa muncul tepat saat engine ragu
      #     isConfirmed: isStale         fakta lain dipakai sebagai keyakinan
      #
      # Aturan 34 diam karena ia hanya menolak **literal**; Aturan 24 diam
      # karena ia menguji **substring** nama penjaganya. Yang terbaca di layar
      # sama pada keduanya: bintang tetap berwarna Betelgeuse, galaksi tetap
      # berpaluk, badge di sebelahnya bertuliskan "Ragu".
      #
      # Harness ini menguji **tiga** penjaga (palet planet, warna bintang,
      # bentuk langit dalam), tiga bentuk cacat, tiga bentuk sah, dan satu
      # pengukuran non-vakuositas. Bentuk sah diuji karena gerbang yang
      # memerah pada kode benar akan dilonggarkan orang.
      - name: Buktikan Aturan 36 berbunyi pada penjaga yang bukan faktornya
        run: python3 Tools/bukti-mutasi-penjaga-faktor.py

      # Aturan 38 lahir karena Aturan 36 menambat **satu nama**.
      #
      # Terukur pada pohon sebelum aturan itu ada (salinan utuh, proses baru,
      # `Apps/` + `Packages/` dibawa): 8 dari 12 mutasi atas dua saudara
      # `confirmsDisplayedIdentity` lolos tanpa satu pun berbunyi. Empat yang
      # tertangkap persis yang ditambat Aturan 36 — jadi yang lolos adalah
      # kelasnya, bukan kebetulan.
      #
      # Dua di antara yang lolos itu lebih parah dari yang ditutup Aturan 36,
      # dan tidak simetris: `isDisplayingStaleObject -> true` membuat
      # peringatan "sisa pandangan sebelumnya" menyala **terus-menerus** pada
      # jam (setiap hasil, betapapun segar, dituduh basi), dan
      # `carriesUncertaintyMarker -> false` membuat **nama kandidat** tampil
      # sebagai temuan di layar redup — persis keadaan yang menurut docstring
      # properti itu paling berbahaya, karena di sana nama kandidat menjadi
      # huruf terbesar di layar.
      #
      # Harness ini menguji **ketiga** permukaan (bukan satu), tujuh keadaan
      # masing-masing, dua bentuk sah, dan lima pengukuran non-vakuositas.
      # Keadaan sah yang terpenting adalah `confirmsDisplayedIdentity`:
      # namanya sengaja berbeda dari `confirmsIdentity`, jadi aturan yang
      # hanya mencocokkan nama akan melewatkan permukaan yang paling penting.
      - name: Buktikan Aturan 38 berbunyi pada permukaan kejujuran yang menyimpang
        run: python3 Tools/bukti-mutasi-permukaan-jujur.py

      # Aturan 42 mengawal **saudara yang bertipe lain** dari ketiga permukaan
      # di atas: `displayedObject`, `pointing`, dan `answeredIntent` semuanya
      # `Optional`, jadi badan `var x: Bool { ... }` milik Aturan 38 tidak
      # pernah mencocokkan badannya.
      #
      # Terukur pada pohon sebelum aturan itu ada (salinan utuh, proses baru,
      # `Apps/` + `Packages/` dibawa), dengan mutasi yang **mengompilasi**:
      # keempat bentuk di bawah membiarkan seluruh 41 aturan lulus (exit 0).
      # `displayedObject -> lastLockedObject` adalah yang paling berbahaya:
      # jam, panel iPhone, layar redup, dan Diagnostics serentak menyatakan
      # objek terakhir terkunci sebagai jawaban **sekarang** — pelanggaran
      # paling keras PRD, tanpa satu pun gerbang berbunyi.
      #
      # Harness ini menguji **ketiga** permukaan, lima keadaan masing-masing,
      # tiga bentuk sah, dan sembilan pengukuran non-vakuositas.
      - name: Buktikan Aturan 42 berbunyi pada permukaan bukan-Bool yang menyimpang
        run: python3 Tools/bukti-mutasi-permukaan-nilai.py

      # Dan bukti untuk Aturan 45 — pemilih palet tidak boleh ditulis sendiri
      # di `Apps/`.
      #
      # `SurfacePalette.active` memilih palet untuk 26 situs (latar, kartu, teks,
      # aksen, garis rambut, nada, badge, layar redup), hidup di `Apps/` yang
      # tidak pernah dibangun `swift-test.sh`. Empat mutasinya — `.day`,
      # `.night`, saklar dibalik, acak — **semuanya** lolos ke-44 aturan UI.
      # Yang paling sunyi (`return .day`) membuat mode malam memancarkan biru &
      # hijau penuh sementara tombol bulan menyala, merusak adaptasi gelap rod.
      #
      # Harness ini menjalankan Aturan 45 atas pohon yang dimutasi: bentuk lama
      # dan seluruh variannya wajib MERAH, pohon produksi apa adanya wajib HIJAU.
      - name: Buktikan Aturan 45 berbunyi pada pemilih palet yang ditulis sendiri di Apps/
        run: python3 Tools/bukti-mutasi-pemilih-palet-lint.py

      # Bukti kedua untuk Aturan 45 pada **sisi uji** (PointingKit), bukan
      # gerbang teks: pemetaan saklar → palet harus sepakat dengan klaim
      # `isNight` milik palet itu sendiri. Diukur dengan memutasi sumber
      # `NightPaletteSelector` di container yang sama dengan CI: `.day`,
      # `.night`, dan saklar dibalik semuanya membuat `SurfacePaletteTests`
      # merah, sedangkan pohon apa adanya hijau.
      - name: Buktikan uji pemilih palet merah pada pemetaan yang menyimpang
        run: python3 Tools/bukti-mutasi-pemilih-palet.py

      # Aturan 46 — peristiwa yang **berbunyi** tidak boleh dipilih sendiri di
      # `Apps/`.
      #
      # `Apps/Shared/AudioCue.swift` memutuskan peristiwa mana yang boleh
      # terdengar seperti berhasil (`events.contains(.lockSucceeded)`), dan
      # berkas itu hidup di `Apps/` yang tidak pernah dibangun
      # `swift-test.sh`. Terukur sebelum Aturan 46: empat mutasinya — termasuk
      # `|| .uncertain` yang membuat engine ragu berbunyi **persis** seperti
      # engine yakin — semuanya lolos ke-45 aturan UI. Bunyi adalah
      # satu-satunya saluran bagi pengguna yang tidak melihat layar, jadi tidak
      # ada teks di layar yang bisa membantahnya; itulah yang membuatnya
      # berbahaya.
      #
      # Harness ini menjalankan Aturan 46 atas pohon yang dimutasi: setiap
      # bentuk lama wajib MERAH, pohon produksi apa adanya wajib HIJAU.
      - name: Buktikan Aturan 46 berbunyi pada pemilihan peristiwa bunyi di Apps/
        run: python3 Tools/bukti-mutasi-suara-lint.py

      # Bukti kedua untuk Aturan 46 pada **sisi uji** (PointingKit): politik
      # `AudioEventPolicy` harus merah saat peristiwa audible-nya dimutasi,
      # saat semuanya dibisukan, dan saat saklar pengguna tidak digerbangi.
      - name: Buktikan uji kebijakan bunyi merah pada politik yang menyimpang
        run: python3 Tools/bukti-mutasi-suara.py

      # Bukti untuk Aturan 47 — kembar Aturan 46, pada saluran yang paling
      # sering dipakai tanpa melihat layar: getaran.
      #
      # Keputusan "ragu berbunyi pola yang berbeda dari berhasil" dulu ditulis
      # **dua kali** di Apps/ (jam dan iPhone), dan mengubah `.uncertain`
      # menjadi pola yang sama dengan `.lockSucceeded` tetap hijau pada semua
      # gerbang. Harness ini menjalankan Aturan 47 atas pohon yang dimutasi:
      # setiap bentuk lama wajib MERAH, pohon produksi apa adanya wajib HIJAU.
      - name: Buktikan Aturan 47 berbunyi pada pemilihan pola getaran di Apps/
        run: python3 Tools/bukti-mutasi-getaran-lint.py

      # Sisi uji Aturan 47: `HapticPolicyTests` harus merah saat pemetaan
      # peristiwa→pola menyimpang, dan sumber harus pulih byte-identik.
      - name: Buktikan uji kebijakan getaran merah pada pemetaan yang menyimpang
        run: python3 Tools/bukti-mutasi-getaran.py

      # Aturan 48: angka gerak (interval `TimelineView` dan bentuk pegas pop
      # saat kunci) tidak ditulis sendiri di Apps/.
      #
      # Kenapa ini butuh bukti sendiri. Aturan itu lahir dari pengukuran, dan
      # dua keadaan cacatnya **terukur hijau** pada 47 aturan sebelumnya:
      # `.spring(response: 0.90, dampingFraction: 0.30)` di jam, dan
      # `minimumInterval: 1.0 / 60.0` di iPhone. Keduanya mengompilasi, jadi
      # Apple Build pun tidak akan berbunyi. Yang paling penting: keadaan
      # **kontrol** di harness ini (komentar, variabel perantara, TimelineView
      # periodik 30 detik) wajib HIJAU — tanpa mereka, aturan yang melaporkan
      # setiap baris Apps/ akan lulus semua keadaan cacat.
      - name: Buktikan Aturan 48 berbunyi pada angka gerak yang ditulis di Apps/
        run: python3 Tools/bukti-mutasi-gerak-angka.py

      # Dan bukti untuk Aturan 49 — latar aplikasi yang hilang di layar pertama.
      #
      # Aturan 49 menutup kelas cacat yang **terukur hijau** pada 48 aturan:
      # `OnboardingView` — layar pertama yang dilihat pengguna — menggambar
      # `SurfacePalette.appBackground` mentah, bukan langit berbintang yang
      # dimiliki lima layar lain. Tidak ada *warning* untuk ini: `Apps/` tidak
      # pernah dibangun di Linux, `swiftc -parse` tidak peduli latar, dan
      # Apple Build hanya gagal pada *warning*. Yang paling menentukan: sapuan
      # "apakah layar memakai latar aplikasi" hijau, karena yang tidak
      # terlihat adalah **ketiadaan** di berkas keenam.
      #
      # Harness ini juga menahan keadaan **kontrol** yang wajib HIJAU (gradien
      # di dalam komentar, `appBackdrop(starfield:)` eksplisit, view kecil
      # tanpa latar sendiri). Tanpa mereka, aturan yang melaporkan setiap
      # berkas `Apps/` akan lulus semua keadaan cacat.
      - name: Buktikan Aturan 49 berbunyi pada latar yang hilang di Apps/
        run: python3 Tools/bukti-mutasi-latar-layar.py

      # Dan bukti untuk Aturan 21 — denyut gambar yang **tampak** digerbangi.
      #
      # Aturan 21 mengawal ongkos yang tidak terlihat di mana pun selain baterai:
      # `Canvas` digambar ulang setiap kali nilai yang ditangkapnya berubah, jadi
      # `pulse` yang bergerak memaksa planet, Bulan, dan Matahari digambar ulang
      # 20x/detik untuk piksel yang identik — denyut hanya dibaca `drawStar`.
      # Tidak ada *warning*, `Apps/` tidak pernah dibangun di Linux, dan tangkapan
      # layar statis tidak bisa membedakan 20 fps dari 1 fps.
      #
      # Cacat yang ditutup aturannya, dan yang membuatnya layak punya bukti
      # tersendiri: **menyebut `hasPulse` bukan gerbang**. Empat bentuk lolos
      # pada versi pertamanya dan semuanya terbaca sebagai sudah digerbangi pada
      # tinjauan kode — `!visual.hasPulse ? fase : 0` (denyut justru mengalir ke
      # planet dan mati pada bintang), `visual.hasPulse ? 0 : fase` (cabang
      # benarnya nol), `hasPulse` di argumen `visual:`, dan `hasPulse` sebagai
      # **label argumen**. Terukur di `HEAD` sebelum perbaikan: 1 dari 5 keadaan
      # cacat berbunyi.
      #
      # Harness ini menuntut kelima keadaan cacat merah **dan** dua kontrol
      # negatif hijau: kode apa adanya, dan `pulse: 0` — denyut nol adalah
      # keadaan yang sah (itulah yang dikirim jam saat layar redup), jadi
      # aturan yang memerah di sana memaksa gerbang untuk nilai yang memang
      # tidak bergerak.
      - name: Buktikan Aturan 21 berbunyi pada denyut yang tampak digerbangi
        run: python3 Tools/bukti-mutasi-gerbang-denyut.py

      # Dan bukti untuk Aturan 30 — rantai izin yang putusnya **tidak pernah
      # merah di mana pun**.
      #
      # Aturan 30 mengawal rantai: `Packages/` mendeklarasikan kunci
      # `NS*UsageDescription`, `project.yml` harus memuat padanannya
      # `INFOPLIST_KEY_*`, iOS membacanya, pengguna melihat dialog. Putus di
      # tengah dan `swiftc` diam, `swift test` di Linux hanya melihat ujung
      # yang mendeklarasi (bukan yang memakai), dan CI macOS hanya gagal pada
      # *warning*. Yang terjadi: iOS menolak akses tanpa peringatan — fitur
      # mati di tangan pengguna, hijau di mana-mana. Rantai ini juga yang
      # membuat Aturan 14 tidak bisa melihat cacatnya sendiri: himpunan
      # terjemahan Aturan 14 diambil dari `project.yml`, jadi kunci yang tidak
      # pernah sampai ke sana tidak punya terjemahan untuk diperiksa.
      #
      # Tiga keadaan, dan keadaan ketiga yang membuat dua pertama berarti:
      # kode benar harus diam, kunci yang dihapus harus berbunyi **menyebut
      # kuncinya**, dan deklarasi yang dihapus harus diam. Tanpa yang ketiga,
      # aturan yang memerah pada setiap keadaan lulus yang kedua. Yang ketiga
      # juga memisahkan dua kegagalan yang dari luar identik: himpunan
      # pencarian yang kosong (PERINGATAN) versus kepatuhan yang hilang
      # (temuan) — keduanya membuat `declared` tidak kosong.
      #
      # Non-vakuositasnya terukur: dengan program Aturan 30 dilumpuhkan,
      # harness ini merah pada keadaan kepatuhan saja.
      - name: Buktikan Aturan 30 berbunyi pada kunci izin yang hilang
        run: python3 Tools/bukti-mutasi-kunci-izin.py

      # Dan bukti untuk Aturan 20 — janji kontras yang paling keras di app ini.
      #
      # Brief menuntut teks **>= 4.5:1 (WCAG)**, dan satu-satunya cara janji itu
      # bertahan adalah kalau setiap permukaan kartu datang dari
      # `SurfacePalette` yang kontrasnya sudah dihitung terhadap semua nada.
      # View yang merakit latarnya sendiri dengan `tone.color.opacity(0.12)`
      # menghasilkan warna yang **tidak ada di palet**, jadi tidak satu pun uji
      # kontras melihatnya. Cacatnya nyata dan sudah dibayar: kartu tahap
      # kalibrasi dulu memakai bentuk itu, dan di mode malam nada `.neutral`
      # (merah 0.94) di atas latar malam jatuh ke **4.32:1** — di bawah ambang.
      #
      # Sampai siklus ini Aturan 20 tidak punya satu pun rekam jejak bahwa ia
      # bisa keluar merah. Dan versi lamanya mencocokkan polanya atas **satu
      # baris**, sehingga cacat asli yang sama lolos begitu ia diformat
      # multi-baris — yang menentukan apakah aturan itu menggigit adalah **gaya
      # pemformatan**, bukan ada tidaknya cacat. Argumennya sekarang diambil
      # berimbang (kurung dihitung), jadi `.background(\n …opacity(…))` dan
      # `pemanggilan bersarang(…)` ikut terbaca.
      #
      # Harness ini menuntut **badan Aturan 20** yang merah dan menyebut berkas
      # yang disuntik — bukan sekadar "ada yang merah", karena salinan pohon
      # yang tidak lengkap membuat aturan lain berbunyi. Lima bentuk cacat dan
      # tiga kontrol negatif (bayangan `Color.black`, `.surfaceCard`, dan pola
      # di dalam literal string).
      - name: Buktikan Aturan 20 berbunyi pada permukaan yang dirakit di view
        run: python3 Tools/bukti-mutasi-permukaan.py

      # Dan bukti bahwa Aturan 2 (singkatan visual di teks UI) benar-benar
      # berbunyi — dan, yang lebih penting, benar-benar **diam pada prosa**.
      #
      # Cacatnya adalah kebalikan dari cacat biasa: aturannya *terlalu*
      # berbunyi. Ia melaporkan 9 baris di repo ini dan **semuanya komentar** —
      # nol sinyal. Aturan yang selalu berbunyi sama tidak bergunanya dengan
      # aturan yang tidak pernah berbunyi, dan kelas cacat itu sudah dibayar
      # repo ini berkali-kali (Aturan 7, 20).
      #
      # Harness ini memulihkan tiga bentuk nyata — satuan di `Text`, di
      # `label:` aksesibilitas, dan di kunci `Localizable.xcstrings` (jalan
      # yang sebelumnya **tidak diperiksa siapa pun**, karena Aturan 4 menyapu
      # kode yang memakainya dan Aturan 6 hanya membandingkan paritas kunci) —
      # lalu menuntut lima kontrol negatif hijau: kalimat yang mengutip
      # singkatannya, komentar, dokumentasi `mag 2.5`, `magnitudo 2.5`, dan
      # frasa penuh terucap.
      #
      # Keadaan komentar adalah yang paling berharga: ia hijau pada versi baru
      # dan merah pada versi lama, jadi ia mengunci perbaikan itu, bukan
      # sekadar menemani.
      - name: Buktikan Aturan 2 berbunyi pada singkatan visual, dan diam pada kalimat
        run: python3 Tools/bukti-mutasi-singkatan-visual.py

      # Dan bukti bahwa Aturan 16 (kalimat aksesibilitas harus datang dari
      # katalog) benar-benar berbunyi.
      #
      # Cacatnya tidak terlihat siapa pun: kalimat VoiceOver ditulis langsung di
      # `Apps/`, sementara teks di baris yang sama sudah lewat katalog — jadi
      # komponennya terlihat benar di layar, dan yang salah hanya yang didengar.
      # `swiftc` tidak peduli, `swift test` di Linux tidak membangun `Apps/`,
      # dan CI macOS hanya gagal bila ada *warning*.
      #
      # Bentuk aslinya pernah hidup di `main`: `linkAccessibilityLabel` merakit
      # `"iPhone terhubung"` sendiri tepat di atas `linkRow`, yang sudah memakai
      # kunci katalog. Harness ini mengembalikan bentuk itu dan menuntut aturan
      # berbunyi **menyebut berkasnya**.
      #
      # Dua kontrol negatif menjaga agar keadaan 1-3 berarti: kalimat di
      # variabel yang **tidak** diumumkan, dan pengenal (`"pointing.state.lock"`)
      # di variabel yang diumumkan — keduanya harus hijau. Tanpa keduanya,
      # aturan yang memerah pada setiap literal akan lulus semuanya.
      - name: Buktikan Aturan 16 berbunyi pada kalimat aksesibilitas yang literal
        run: python3 Tools/bukti-mutasi-kalimat-a11y.py

      # Dan bukti bahwa Aturan 12 (kalimat tampilan tidak lahir sebagai literal)
      # benar-benar berbunyi.
      #
      # Aturan ini satu-satunya penjaga celah di antara dua gerbang lokalisasi
      # yang sudah ada: Aturan 4 menyapu literal **langsung di dalam** `Text(...)`,
      # sedangkan Aturan 12 menyapu literal yang ditugaskan ke properti
      # berakhiran Note/Label/Title/… lalu dirender lewat `Text(note)`. Kalimat
      # seperti itu tak pernah menyentuh `Text(...)` dan tak pernah punya kunci,
      # jadi **kedua** gerbang tetap hijau sementara pengguna Bahasa Inggris
      # membaca kalimat Indonesia.
      #
      # Cacatnya tidak terlihat salah: kalimatnya terbaca lancar di layar, lulus
      # tinjauan, dan tidak muncul di diff sebagai kesalahan. `swiftc` tidak
      # peduli, `swift test` di Linux tidak bisa membangun `Apps/` sama sekali,
      # dan CI macOS hanya gagal bila ada *warning*.
      #
      # Sebelum langkah ini, Aturan 12 **tidak punya satu pun rekam jejak** bahwa
      # ia bisa keluar merah: tiga langkah `red-lint.sh` di alur kerja ini hanya
      # menuntut Aturan 3, 18, dan 31. Empat keadaan di bawah menutupnya — satu
      # cacat yang wajib merah **dan menyebut berkasnya**, tiga kontrol negatif
      # (kunci katalog bertitik, literal satu kata, kode benar) yang wajib hijau,
      # karena aturan yang memerah pada setiap penugasan wajar akan dimatikan
      # orang dan berhenti menjaga apa pun.
      - name: Buktikan Aturan 12 berbunyi pada kalimat tampilan yang literal
        run: python3 Tools/bukti-mutasi-kalimat-literal.py

      # Dan bukti bahwa Aturan 13 (kalimat yang dirakit sebagai argumen harus
      # berkunci) benar-benar berbunyi.
      #
      # Kelas ini lolos dari **dua** gerbang lokalisasi yang sudah ada: Aturan 4
      # menyapu literal di dalam `Text(...)`, Aturan 12 menyapu literal yang
      # ditugaskan ke variabel berakhiran Note/Label. Kalimat di dalam
      # `String(format: …)` / `parts += […]` tidak menyentuh keduanya.
      #
      # Yang membuatnya berbahaya: ia **tidak terlihat salah**. Angka dan derajat
      # identik di semua bahasa, jadi diff dan tangkapan layar tidak menunjukkan
      # apa pun — yang berbeda adalah kata pengantar dan urutannya, dan itu hanya
      # terasa oleh pengguna yang membaca bahasa lain.
      #
      # Dua keadaan cacat menutup **dua cabang berbeda** (`String(format:` dan
      # `+=`), dan tiga kontrol negatif menjaga agar keduanya berarti: helper
      # katalog tanpa literal, interpolasi murni angka, dan satu kata tanpa
      # spasi. Tanpa kontrol, aturan yang memerah pada setiap literal di dalam
      # `append` akan lulus semuanya.
      - name: Buktikan Aturan 13 berbunyi pada kalimat yang dirakit sebagai argumen
        run: python3 Tools/bukti-mutasi-kalimat-dirakit.py

      # Dan bukti bahwa Aturan 11 (specifier katalog cocok tipe dengan template
      # kode) benar-benar berbunyi.
      #
      # Ini satu-satunya cacat di repo ini yang **menjatuhkan app**, bukan sekadar
      # salah kata. Bentuk yang paling wajar ditulis penerjemah — menukar posisi
      # dua specifier supaya angkanya di depan — bisa membuat `%.1f` menerima
      # sebuah `String`. Di CoreFoundation itu crash; glibc memaafkannya, jadi
      # `swift-test.sh` hijau ratusan uji dan hanya CI macOS yang merah. Bentuk
      # itu sudah pernah ada: `spokenError` mengirim `(String, Double, String)`
      # dengan template `"%@ %.1f %@"`.
      #
      # Karena perbedaan glibc vs CoreFoundation itulah penjaganya harus
      # perbandingan teks — uji runtime di Linux buta di sini.
      #
      # Tiga keadaan cacat (ditukar, tipe diganti, specifier hilang) dan satu
      # kontrol negatif yang paling penting: specifier **sejenis** yang cuma
      # dipindah harus tetap hijau. Tanpa itu, aturan yang membandingkan string
      # mentah akan lulus ketiganya dengan sempurna, dan setiap terjemahan yang
      # sah akan dilaporkan sebagai cacat.
      - name: Buktikan Aturan 11 berbunyi pada specifier katalog yang tidak cocok
        run: python3 Tools/bukti-mutasi-specifier.py

      # Dan bukti bahwa Aturan 19 (kunci katalog yatim) berbunyi pada **tiga
      # bentuk** kematian kunci, bukan satu.
      #
      # Versi lamanya mencari nama kunci sebagai potongan teks di seluruh
      # `.swift`, dan tiga kunci mati di katalog ini lolos dari tiga cara yang
      # berbeda: `'%lld gagal'` hidup dari teks bawaan (`id:`) kunci lain;
      # `'GoTo'` hidup dari komentar yang mendokumentasikan penghapusannya
      # sendiri; `'sisa'` hidup dari berkas uji yang justru menjaga keputusan
      # untuk tidak memakainya. Ketiganya dihapus, dan gerbangnya diperketat
      # pada dua sumbu — literal berkutip, komentar dikosongkan, berkas uji
      # dikeluarkan.
      #
      # Tiap sumbu menutup tepat satu bentuk, dan itu yang dibuktikan: dengan
      # pengetatan dikembalikan ke bentuk lama di worktree terpisah, harness ini
      # merah **persis pada keadaan 2, 3, dan 4** dan tetap hijau pada sisanya.
      # Tiga keadaan kontrol negatif (rujukan lewat `id:`, `key:`, dan
      # `Text("…")`) menahan arah sebaliknya: aturan yang memerah pada setiap
      # kunci yang dirujuk lewat `id:` akan lulus ketiga keadaan cacat dengan
      # sempurna, dan melaporkan setiap rujukan yang sah sebagai yatim.
      - name: Buktikan Aturan 19 berbunyi pada tiga bentuk kunci yatim
        run: python3 Tools/bukti-mutasi-kunci-yatim.py

      # Dan bukti untuk penjaga yang **melindungi semua harness di atas**.
      #
      # `mutasi_sumber.require_clean_sources` menolak jalan bila berkas
      # produksi yang akan dimutasi sudah menyimpang dari HEAD. Tanpa itu,
      # harness yang gagal pulih — mis. karena `timeout` di tengah langkah —
      # membuat harness **berikutnya** mengadopsi berkas yang sudah termutasi
      # sebagai «aslinya», lalu melaporkan «pulih persis» untuk perbandingan
      # dengan dirinya sendiri. Seluruh laporan hijau, dan tidak satu pun
      # angkanya berarti.
      #
      # Itu sudah terjadi pada 8 Okt: sebuah harness yang di-`timeout` di
      # tengah langkah meninggalkan satu baris mutasi hidup di
      # `render-visuals.py`, dan `bukti-mutasi-langit-dalam.py` berikutnya
      # melaporkan 15 kelemahan bukti **sekaligus** «pulih persis» atas berkas
      # yang tidak pernah pulih.
      #
      # Harness ini mengukur penjaganya sendiri, dan tiga keadaannya penting:
      # yang pertama **diharapkan lulus** (penjaga yang menyalak pada sumber
      # bersih akan dimatikan orang), yang kedua menuntut pesannya menyebut
      # **hanya** berkas yang kotor, dan yang ketiga menuntut penjaganya
      # **tidak lulus-terbuka** ketika `git diff` sendiri gagal.
      - name: Buktikan penjaga sumber-bersih harness mutasi berbunyi
        run: python3 Tools/bukti-penjaga-bersih.py

      # Gerbang `public` berlebih pada anggota `public extension`.
      #
      # Kenapa di sini, bukan di `swift-ui-lint.sh`: cacat ini hidup di
      # **paket**, bukan di `Apps/`, dan sapuan UI itu khusus SwiftUI. Kenapa
      # juga tidak cukup di `ios-build.yml`: job itu macOS dan butuh menit,
      # sementara ini gerbang teks yang berjalan dalam sekejap di Linux — dan
      # lebih cepat berbunyi, lebih murah diperbaiki.
      #
      # Cacat yang ditutupnya sudah pernah lolos ke `main`: 15 peringatan
      # produksi (`'public' modifier is redundant for … declared in a public
      # extension`) dari `CelestialVisual.swift` dan `NightVisual.swift`
      # duduk di setiap build tanpa satu pun gerbang melihatnya, karena
      # `ios-build.yml` hanya menyapu `Apps/`. Peringatan yang tak pernah
      # dibaca adalah cara paling halus untuk menutupi niat kode yang sudah
      # tidak berlaku.
      #
      # Dua arah, dan keduanya diuji di `prove_itself()` di dalam skripnya:
      # menemukan `public` yang berlebih, dan **tidak** menyentuh `public`
      # yang diperlukan pada anggota tipe bersarang — yang terakhir itu tidak
      # memicu peringatan apa pun, tapi membuat `Apps/` gagal dikompilasi.
      # Gerbang yang selalu keluar 0 terlihat persis sama dengan gerbang yang
      # bersih, jadi laporan ini sengaja keluar 1 saat ada temuan.
      - name: Gerbang `public` berlebih di public extension
        run: python3 Tools/bersihkan-public-berlebih.py

      # Setiap harness memanggil gerbang yang **benar-benar ada**.
      #
      # Ini melengkapi `check-harness-terdaftar.py`, yang menutup arah lain:
      # berkas harness di disk wajib dirujuk alur kerja. Yang tidak
      # ditutupnya adalah **isi** berkas yang menjadi sandaran harness.
      #
      # Occurrence ketiga dari pola yang sama (13/12, 17/16, 12/10), dan yang
      # ketiga punya bentuk baru: berkasnya ada, dirujuk, dan berjalan — tapi
      # ia memanggil `check_star_spike_halving_reaches_both_languages` yang
      # saat itu hanya ada di WIP tak-ter-commit `Tools/check-visuals.py`.
      # Terukur pada checkout bersih `fbb67f7`: grep gerbang itu = 0, dan CI
      # gagal **setelah 37 menit** dengan enam keadaan `PROBE GAGAL JALAN:
      # AttributeError`. `check-harness-terdaftar.py` hijau sepanjang itu.
      #
      # Bentuknya yang berbahaya: gerbang lama tetap hijau (daftar lengkap),
      # dan yang gagal bukan yang salah (harness-nya benar, sandarannya belum
      # ada). Jadi satu-satunya yang bisa menangkapnya adalah gerbang yang
      # membandingkan **panggilan** dengan **definisi**.
      - name: Buktikan setiap harness memanggil gerbang yang ada
        run: python3 Tools/bukti-mutasi-gerbang-dijalankan.py

      # Dan bukti untuk **dua gerbang PNG** — yang menjaga berkas keluaran
      # `render-visuals.py` benar-benar PNG yang bisa dibaca dunia luar, bukan
      # hanya oleh pembaca toleran di repo ini. Keduanya hijau pada hari
      # ditulis dan tidak dirujuk harness mana pun (16 gerbang nirsaksi).
      #
      # Kenapa keduanya layak: cacat yang ditutupnya **sudah pernah nyata**.
      # `to_png` dulu menulis barisnya tanpa byte filter sementara `_png()`
      # mengklaim menyisipkannya; arus IDAT jadi `h·w·4` sedangkan spesifikasi
      # menuntut `h·(w·4+1)`, sehingga Preview, browser, dan `ffmpeg` menolak
      # berkasnya — sementara `check_png_roundtrip` **lulus**, karena
      # `decode_png` toleran terhadap bentuk salah itu.
      #
      # Temuan yang menentukan bentuk harnessnya: **kedua gerbang tidak
      # mubazir, dan masing-masing merah di keadaan yang berbeda.**
      # Menghapus byte filter membuat `well_formed` merah sementara `roundtrip`
      # tetap **hijau** (dan itu benar — pembaca memilih cabang tanpa filter
      # lalu mengembalikan piksel yang persis). Sebaliknya, keadaan 3
      # (filter 1 dideklarasikan tanpa isinya difilter) panjangnya tepat
      # `h·(w·4+1)` sehingga `well_formed` hijau, tetapi 4032 dari 4096 piksel
      # berbeda setelah bolak-balik. Harness yang menuntut `roundtrip` merah
      # di keadaan 1 akan merah pada kode yang benar, dan orang berikutnya
      # akan melonggarkan gerbangnya.
      - name: Buktikan gerbang PNG berbunyi
        run: python3 Tools/bukti-mutasi-png.py

      # Bukti bahwa `check_crater_drawing_constants` bukan gerbang mati — dan
      # catat batas cakupannya dengan jujur. Harnessnya menjalankan gerbang di
      # proses baru atas sumber yang dimutasi dan menuntut subset nama hasil
      # yang diukur, bukan sekadar "ada yang merah". Keadaan 4b/4c membuktikan
      # klaim docstring gerbangnya salah (bukan invariansi skala), dan (a)–(c)
      # membuktikan kelas gambar kawah selebihnya tidak terbaca sama sekali.
      - name: Buktikan gerbang sabit bibir kawah berbunyi
        run: python3 Tools/bukti-mutasi-sabit-bibir-kawah.py

      # Bukti bahwa `check_candidate_marker_stays_inside_its_badge` berbunyi —
      # gerbang yang menjaga **satu-satunya penanda di layar** yang mengatakan
      # "engine ragu". Kalau ia hanya hijau, yang tersisa adalah gambar objek
      # tanpa penanda, dan gambar tanpa penanda terbaca sebagai identitas yang
      # pasti — pelanggaran paling keras di PRD.
      #
      # Menjalankannya menemukan cacat **di dalam gerbangnya sendiri**, lebih
      # besar daripada yang ia klaim tutup: titik glif sudah absolut dalam
      # satuan radius frame, tetapi port menambahkan `center` lagi, sehingga
      # glif mendarat di (207, −35) pada kanvas 200 px dan **nol piksel**
      # tergambar. Terukur: menghapus `stroke_polyline`-nya mengubah nol
      # piksel sementara pemeriksaan "glif tanda tanya tergambar" tetap hijau
      # di 247 — karena 247 itu piksel **lencananya** (cakram isi, lingkaran
      # tepi, tetes), yang memang berada di dalam kotak yang diukur.
      #
      # Perbaikannya dua, dan keduanya perlu: port memakai `size / 2.0`, dan
      # gerbang mendapat pemeriksaan baru yang mengukur **selisih** piksel
      # dengan vs tanpa glif (316 lawan 247 pada keadaan benar, 0 lawan 247
      # pada keadaan cacat). Harness menuntut **pemeriksaan bernama**:
      # keadaan 1 (cacat asli) memerahkan hanya pemeriksaan sumbangan,
      # sementara pemeriksaan lama sengaja tetap hijau di sana — justru
      # itulah bukti bahwa gerbang lama tidak bisa melihat cacatnya.
      #
      # Keadaan 6 adalah kontrol negatif (komentar diubah): kalau harness
      # merah di sini, ia merah karena berkasnya berubah, bukan karena
      # cacatnya, dan ia tidak mengukur apa pun.
      - name: Buktikan gerbang glif lencana kandidat berbunyi
        run: python3 Tools/bukti-mutasi-glif-lencana.py

      # Bukti bahwa `check_crater_contrast_numbers_come_from_the_sampler`
      # berbunyi — satu dari 7 gerbang tersisa yang tidak punya harness.
      #
      # Gerbang ini menjaga **satu-satunya bukti yang dibaca orang** saat
      # menilai apakah gerbang kontras kawah layak dipercaya, yaitu angka di
      # docstring-nya. Empat rentang pernah dikutip di sana dan **tidak satu
      # pun keluar dari penyampelnya**: `−5,1` menyatakan hampir tidak ada
      # dinding terang yang hilang, padahal seluruh lima kawah menjadi lebih
      # gelap dari permukaannya.
      #
      # Mutasinya hidup di **docstring gerbang lain di berkas yang sama**
      # (`check_crater_floor_opacity_comes_from_the_model`), jadi tidak satu
      # pun berkas di `Apps/` atau `Packages/` yang disentuh.
      #
      # Empat keadaan pertama tidak saling menggantikan: 1 & 2 mengubah angka
      # pada dua keadaan berbeda (sebelum & sesudah), 3 menukar **sisi**
      # sementara angkanya tetap benar, dan 4 mengubah **bentuk** kutipan —
      # gerbangnya lalu berhenti lebih awal dan melaporkan satu hasil, bukan
      # empat, jadi himpunan hasilnya ikut dituntut persis.
      #
      # Keadaan 5 adalah kontrol negatif (prosa diubah): kalau harness merah
      # di sana, ia merah karena berkasnya berubah, bukan karena cacatnya.
      - name: Buktikan gerbang angka kontras kawah berbunyi
        run: python3 Tools/bukti-mutasi-angka-kawah.py

      # Bukti bahwa `check_every_planet_in_the_model_has_render_cases`
      # berbunyi — satu dari 7 gerbang tersisa yang tidak punya harness.
      #
      # Gerbang ini adalah **satu-satunya** penegak aturan kejujuran repo
      # ("ciri yang mengidentifikasi hilang saat ragu") untuk planet yang
      # belum ada. Kelima planet hari ini sudah punya pasangan kasus, jadi
      # gerbangnya hijau apa pun yang terjadi pada planet **berikutnya**:
      # Uranus ditambahkan ke model, tidak ada yang merah, dan visual Uranus
      # lalu tampil pasti saat engine masih ragu. Itu kelas cacat yang tidak
      # bisa dilihat uji Swift mana pun — tidak ada yang salah di sana.
      #
      # Harness ini menjalankan gerbangnya 9 kali: sekali pada sumber bersih,
      # tujuh kali pada sumber yang dirusak dengan cara berbeda, dan sekali
      # pada Uranus yang terpasang **lengkap**. Keadaan terakhir itu yang
      # paling penting dan paling mudah hilang: tanpa ia, harness yang merah
      # pada setiap suntingan planet mengajarkan bahwa gerbangnya menolak
      # pekerjaan, bukan menuntut kelengkapannya.
      #
      # Lima keadaan saling menggantikan dan tidak bisa diwakilkan: 1 & 2
      # memisahkan "ada drift antarbahasa" dari "kedua bahasa sepakat" —
      # keadaan sunyinya justru yang kedua, karena hanya gerbang ini yang
      # bisa melihatnya; 3 memerahkan satu-satunya kawat penjaga "tidak ada
      # ciri yang tidak dipakai planet mana pun"; 4 memerahkan satu-satunya
      # pemeriksaan yang membandingkan pembaca `switch` dengan pembaca tabel;
      # 5, 6, 7 masing-masing mengubah **gerbang**, bukan model, pada tiga
      # planet berbeda — dan 7 yang paling halus: nama kedua sisinya ada,
      # tetapi pasangannya menunjuk planet lain, jadi pemeriksaan yang hanya
      # menuntut "kelima planet ada" tetap hijau di sana.
      #
      # Tiga tebakan pada versi pertama harness terukur salah dan diperbaiki
      # di harapannya, bukan dengan melonggarkan gerbangnya; ketiganya
      # dicatat di docstring harness sebagai alasan kenapa "membaca gerbang"
      # bukan pengganti "menjalankan gerbang dalam keadaan rusak".
      - name: Buktikan gerbang kasus render planet berbunyi
        run: python3 Tools/bukti-mutasi-kasus-planet.py

      # Bukti bahwa `testMoonCataloguePositionIsNotItsCurrentPosition` berbunyi
      # — dan bahwa ia tidak bisa hijau karena kebetulan.
      #
      # Uji itu mengunci satu asumsi struktural yang menopang **seluruh** jalur
      # benda tata surya: posisinya datang dari `EphemerisSample` (apparent
      # of-date), bukan dari `raDeg`/`decDeg` tetap yang menempel pada
      # `CelestialObject`. Kedua cabang `consider` di `PointingResolver`
      # **terlihat identik** di layar kode, jadi satu argumen tertukar tidak
      # menghasilkan peringatan compiler apa pun.
      #
      # Empat uji kejujuran Bulan yang sudah ada menguji **penolakan** ("tidak
      # boleh lock"); tidak satu pun menguji **posisinya**. Terukur di keadaan
      # 1: dengan posisi benda tata surya dipaku ke koordinat tetap, tepat satu
      # uji merah — yang baru — dan tiga uji Bulan lain di suite itu tetap
      # hijau. Itulah bukti celahnya nyata dan tidak tertutup uji mana pun.
      #
      # Keadaan 2 adalah kontrol negatif yang arahnya berlawanan: koordinat
      # tetap di berkas uji justru **digeser**, dan seluruh suite tetap hijau —
      # membuktikan yang diukur uji adalah perilaku mesin, bukan salinan teks.
      #
      # Keadaan 3 menjaga kecukupan fixture. Dua tebakan pertamanya terukur
      # salah dan diperbaiki di harapannya, bukan dengan melonggarkan gerbang:
      # (a) `epoch.addingTimeInterval(0)` bukan fixture malam apa pun, dan
      # (b) jam malam yang dihitung sendiri (hari ke-8 pukul 07.0) **adalah**
      # jawaban `moonNightFixture()` — sehingga "memindahkannya" ke sana tidak
      # mengubah apa pun dan hijau tanpa membuktikan apa-apa.
      - name: Buktikan uji koordinat Bulan berbunyi
        run: python3 Tools/bukti-mutasi-koordinat-bulan.py

      # Bukti bahwa `check_every_morphology_in_the_model_has_render_cases`
      # berbunyi — satu dari 6 gerbang tersisa yang tidak punya harness.
      #
      # Gerbang ini menjaga aturan yang berlaku untuk **bentuk objek langit
      # dalam yang belum ada**: setiap morfologi di enum harus terbaca
      # pembaca gerbang, punya kasus render, punya layout di port, dan tidak
      # ada bentuk sisa di port. Keenam morfologi hari ini sudah memenuhi
      # keempatnya, jadi gerbangnya hijau apa pun yang terjadi pada bentuk
      # berikutnya.
      #
      # Gerbang tetangganya tampak menjaga hal yang sama dan tidak: ia
      # membandingkan per nama yang ia temukan di **kedua** sisi, dan daftar
      # namanya ditulis tangan. Keadaan 3 mengukurnya — bentuk baru
      # ditambahkan ke enum, switch gambar, dan kasus render, dan tetangganya
      # **hijau 8 dari 8** sementara gerbang ini merah dua kali. Itulah
      # keadaan sunyinya, dan ia terukur.
      #
      # Harness ini juga **menemukan cacat**, bukan sekadar membuktikan:
      # gerbangnya mati dengan traceback `ValueError` saat satu cabang
      # `switch` dirapikan, karena jangkar teksnya hilang. Gerbang tetangganya
      # sudah membungkus pembaca yang sama sejak awal. Perbaikannya ada di
      # gerbangnya, dan keadaan 5 adalah regresinya.
      #
      # Keadaan 5 dan 5b sengaja **berhenti lebih awal** (gerbang melaporkan
      # satu hasil lalu `return`), jadi himpunan hasilnya dituntut persis —
      # supaya "berhenti lebih awal" terlihat sebagai berhenti lebih awal,
      # bukan diam-diam dianggap lulus karena satu hasilnya merah.
      - name: Buktikan gerbang kasus render morfologi berbunyi
        run: python3 Tools/bukti-mutasi-kasus-morfologi.py

      # Bukti bahwa `check_star_colour_index_matches_the_model` berbunyi —
      # satu dari 4 gerbang tersisa yang tidak punya harness.
      #
      # Gerbang ini menjaga 25 indeks B−V yang ditulis **dua kali** (Swift dan
      # port). Tidak ada pemeriksaan lain yang membandingkan keduanya: setiap
      # pemeriksaan warna bintang yang ada mengukur gambar port, jadi
      # mengubah satu nilai di Swift membiarkan semuanya hijau sambil
      # mengukur warna yang tidak pernah ada.
      #
      # Keadaan 5 dan 6 adalah cermin satu sama lain — bintang yang sama
      # hilang, sekali dari model dan sekali dari port — dan keduanya
      # memerahkan pemeriksaan yang **berbeda**. Itu sebabnya harness ini
      # menuntut nama pemeriksaan yang merah, bukan sekadar "ada yang merah":
      # kalau salah satu arah tidak diperiksa, bintang yang hilang dari sisi
      # itu lewat tanpa suara.
      #
      # Keadaan 3 dan 4 hanya berbeda **tanda** (1.90 vs −1.85), dan itu
      # intinya: Betelgeuse +1.85 harus merah, Rigel −0.03 biru. Tanda yang
      # terbalik tidak akan pernah dilaporkan pengguna — bintang tetap tampak
      # sebagai titik bercahaya — jadi pemeriksaan tanda harus terbukti
      # berbunyi.
      #
      # Keadaan 7 menjaga gerbangnya tetap jujur: mengubah **kedua** sisi
      # menjadi nilai yang sama **bukan cacat**. Harness yang merah di sana
      # mengajarkan bahwa gerbangnya menolak pekerjaan yang benar.
      - name: Buktikan gerbang indeks warna bintang berbunyi
        run: python3 Tools/bukti-mutasi-indeks-warna.py

      # Bukti bahwa `check_deep_sky_catalogue_values_reach_the_picture` berbunyi
      # — salah satu dari tiga gerbang yang dulu tidak punya harness sama sekali.
      #
      # Ia menjaga **ragam visual** objek langit dalam: tiap entri katalog
      # digambar dengan angka fuzziness-nya sendiri, dan bedanya terlihat di
      # ukuran jam (38 pt). Dua arah diuji, karena keduanya hazard nyata:
      #   1. rumus `growth` model menyimpang dari port (model diedit di Mac,
      #      port tertinggal di Linux) — arah yang paling mungkin;
      #   2. satu entri katalog kehilangan keunikan fuzziness-nya (M31 -> 0.6),
      #      sementara rumus growth tetap hijau — membuktikan penjaga nilainya
      #      hidup, bukan hanya penjaga rumusnya.
      - name: Buktikan gerbang katalog langit dalam berbunyi
        run: python3 Tools/bukti-mutasi-katalog-langit-dalam.py

      # Bukti bahwa dua gerbang inti spiral berbunyi — sisa terakhir dari
      # tiga gerbang nirsaksi. Keduanya mengukur hal yang sama dari dua sisi
      # yang tidak bisa saling menggantikan: yang satu mengukur **gambarnya**
      # (selisih cakupan cincin dengan vs tanpa tonjolan), yang lain mengukur
      # **angka yang dikutip docstring-nya** keluar dari penyampelnya sendiri.
      #
      # Temuan utamanya terukur: mutasi "tonjolan diperkecil/diredupkan"
      # berbunyi lewat pemeriksaan **"sampel inti ada"** (batas sampel runtuh),
      # bukan lewat pemeriksaan selisih — persis yang dicatat docstringnya.
      # Keadaan 3 (tonjolan dihapus) beda lagi: indeksnya jatuh ke kabut
      # cakram, jadi sampelnya tidak runtuh dan yang berbunyi adalah
      # angka-angka docstring. Keadaan 4 kontrol negatif, harus tetap hijau.
      - name: Buktikan gerbang inti spiral berbunyi
        run: python3 Tools/bukti-mutasi-inti-spiral.py

      # Bukti bahwa `check_mars_caps_fade_into_the_surface` berbunyi — gerbang
      # baru yang lahir bersama luruhan tepi dalam kutub Mars.
      #
      # Gerbang ini mengukur kolom tengah di sekitar tepi **dalam** kutub, satu
      # tempat yang tidak dilihat satu pun dari 210 pemeriksaan lain: kutub
      # yang diisi warna rata menghasilkan langkah **111.5 luminans dalam satu
      # piksel** (utara) dan **139.7** (selatan) sementara bola Mars di baris
      # yang sama bergerak 0.9.
      #
      # Keadaan 2 adalah alasan harness ini ada: **satu tanda** dibalik
      # (`toward_pole`), seluruh nilai opasitas tetap sah, seluruh uji Linux
      # tetap hijau, dan seluruh 210 pemeriksaan lain tetap hijau — terukur.
      # Yang berubah hanya ujung mana yang kabur. Uji Linux tidak bisa
      # menangkapnya karena setiap nilai, satu per satu, tetap benar.
      #
      # Keadaan 3 dan 4 adalah batas cakupan yang **dinyatakan**: panjang
      # luruhan tidak dijaga (0.45 → 0.05 tetap hijau), dan gradien view tidak
      # dijaga (seluruh gerbang di berkas itu mengukur port Python). Keduanya
      # ditulis sebagai keadaan wajib hijau supaya batasnya terbaca sebagai
      # pernyataan, bukan sebagai gerbang yang ketinggalan.
      - name: Buktikan gerbang luruhan tepi dalam kutub Mars berbunyi
        run: python3 Tools/bukti-mutasi-luruh-kutub.py

      # Aturan 23 (penanda keraguan di complication) menegakkan **aturan
      # paling keras PRD** ("JANGAN pernah menampilkan visual yang mengklaim
      # identitas saat engine RAGU") pada permukaan terkecil di seluruh
      # perangkat: complication `accessoryInline`, yang tidak punya baris
      # kedua. Satu-satunya kanal yang tersisa di sana adalah ikon
      # `presentedSymbolName`, jadi tanpa ikon itu nama kandidat `.uncertain`
      # tampil **persis** seperti nama yang sudah terkunci.
      #
      # **Kenapa langkah ini baru ada sekarang.** Harness 422 baris ini
      # ditambahkan oleh commit `bef9a55` ("GERBANG: Aturan 23 kini menunjuk
      # cabang yang benar") yang **lupa** menambahkan langkah CI-nya, sehingga
      # `Tools/check-harness-terdaftar.py` — gerbang yang ada justru untuk
      # menangkap kelas cacat ini — gagal di `main` (exit 1) dan memblokir
      # setiap push berikutnya. Gerbang yang tidak pernah dijalankan selalu
      # hijau; yang di sini bahkan tidak sempat hijau, ia cuma tidak pernah
      # berbunyi.
      #
      # Empat keadaan: ikon dibuang dari `accessoryInline` (cacat aslinya),
      # ikon dibuang dari `default` (keluarga yang belum didesain, dan karena
      # itu paling mungkin rusak tanpa ada yang melihat), ikon ada tetapi
      # **bukan** `presentedSymbolName` (bentuk "ada ikon" yang salah — ikon
      # tetap, jadi ragu dan terkunci tampil sama), dan satu kontrol negatif
      # yang harus tetap hijau.
      - name: Buktikan gerbang penanda keraguan complication Aturan 23 berbunyi
        run: python3 Tools/bukti-mutasi-penanda-complication.py

      # Bukti bahwa `check_modeled_port_constants_match_the_model` berbunyi —
      # gerbang yang menjaga setiap konstanta port yang **mengaku** berasal
      # dari model Swift.
      #
      # Uranus dan Neptunus masuk bersama sembilan konstanta geometri di port,
      # masing-masing dengan komentar `# MODEL: CelestialVisual.<nama>` yang
      # menjanjikan angkanya sama dengan sumber Swift-nya. Diukur sebelum
      # gerbang ini ada: mengganti `URANUS_BAND_HALF_HEIGHT 0.30 -> 0.55`
      # **dan** `NEPTUNE_SPOT_OPACITY 0.55 -> 0.20` membiarkan seluruh gerbang
      # gambar repo ini pada jumlah merah yang **sama persis** seperti
      # sebelumnya. Komentar yang menjanjikan kesamaan bukan gerbang.
      #
      # Delapan keadaan, dan yang paling berharga adalah yang **terakhir**:
      # mengganti nama fungsi di model membuat ketiga token `URANUS_BAND_*`
      # kehilangan sumbernya, dan sebelum penjaga itu ada ketiganya menyusut
      # dari himpunan hasil sementara gerbangnya tetap hijau — berhenti
      # mengukur tepat ketika modelnya berubah. Dua arah penyimpangan (port dan
      # model) diuji terpisah karena keduanya memerahkan token yang berbeda,
      # dan keadaan 6 menuntut penyuntingan dua sisi yang sah tetap **hijau**.
      - name: Buktikan gerbang konstanta port yang mengaku dari model berbunyi
        run: python3 Tools/bukti-mutasi-sabuk-uranus.py

      # Dan bukti untuk Aturan 37 — `switch` di `Apps/` yang kehilangan satu
      # `case` ketika enum modelnya bertambah.
      #
      # Ini satu-satunya kelas di daftar ini yang cacatnya **sudah mendarat di
      # `main`**: commit `27dd677` menambahkan `.paleDisk`/`.blueDisk` ke
      # `enum DistinguishingFeature` dan memperbarui satu dari dua `switch`
      # atas `palette.feature`. Yang terlewat ada di jalur sabit. Pada commit
      # itu 216 + 799 uji hijau, seluruh aturan UI hijau, dan
      # `swift-typecheck.sh` hijau; yang merah hanya Apple Build (macos-15):
      #
      #     Apps/Shared/CelestialVisualView.swift:269:29:
      #       error: switch must be exhaustive
      #
      # Kenapa tidak ada gerbang cepat yang bisa menangkapnya, dan kenapa itu
      # bukan kelalaian yang bisa ditambal di tempat lain: runner Linux hanya
      # membangun `Packages/`, tidak pernah `Apps/`, dan kelengkapan `switch`
      # adalah pemeriksaan **semantik** yang butuh seluruh tipe diketahui —
      # `swiftc -parse` (yang dipakai `swift-typecheck.sh`) hanya membaca
      # sintaks. Jadi satu-satunya gerbang yang mampu adalah yang paling
      # lambat dan paling akhir, dan cacatnya lolos ke `main`.
      #
      # Harness ini **tidak** memutasi sumber produksi: ia mengekstrak program
      # Aturan 37 dari `swift-ui-lint.sh` — bukan menyalinnya, karena salinan
      # akan tetap hijau walau aturan aslinya dilonggarkan — lalu
      # menjalankannya di pohon salinan sementara. Pohon salinan wajib ada
      # karena aturan ini membaca **dua** tempat sekaligus (enum di
      # `Packages/PointingKit/Sources/`, `switch` di `Apps/`).
      #
      # Sembilan keadaan. Enam cacat wajib merah: `case` dihapus dari `switch`
      # jalur sabit (persis cacat yang mendarat di `main`), `case` dihapus
      # dari `switch` jalur gambar (situs berbeda, kelas sama — kalau aturannya
      # hanya melihat satu situs, keadaan ini hijau), dan **kasus baru**
      # ditambahkan ke enum model sementara kedua `switch` dibiarkan. Yang
      # terakhir itu alasan aturannya membaca himpunan kasus dari model,
      # bukan mencocokkan nama `.paleDisk`/`.blueDisk` — daftar nama akan
      # hijau lagi begitu kasus berikutnya ditambahkan. Tiga kontrol negatif:
      # pohon utuh, dan `default:` yang ditambahkan ke `switch` — di sana
      # compiler memang tidak menuntut kelengkapan, jadi aturan yang memerah
      # di sana akan dilonggarkan orang.
      #
      # Tiga keadaan sisanya mengukur **cakupan** aturan, dan masing-masing
      # dituntut hijau pada satu program pembanding supaya ia tidak hanya
      # sepakat dengan dirinya sendiri:
      #
      #   - `case .altitudeAzimuth` dihapus, dan kasus baru di `MountAxis`:
      #     `MountAxis` hidup di CelestialEngine, jadi keduanya hijau pada
      #     aturan versi lama (PointingKit saja).
      #   - `case .deepSky` dihapus dari `switch visual.kind`: situs itu
      #     punya dua kandidat enum berhimpunan kasus identik
      #     (`CelestialVisual.Kind` dan `ObjectKind`), jadi ia hijau pada
      #     "perluasan naif" (cakupan diperluas tanpa melonggarkan syarat
      #     kandidat) — alasan syaratnya harus berubah, bukan cuma cakupannya.
      #   - kasus baru di `Plan` (enum **bermuatan**): pembaca yang hanya
      #     mengenali `case nama` membuang seluruh enumnya, jadi `switch
      #     ReducedLuminanceVisual.plan(...)` tidak pernah diperiksa. Hijau
      #     pada aturan versi "tanpa kasus bermuatan" — alasan pembacanya
      #     harus mengenali `case nama(muatan)`, bukan cuma memperluas cakupan.
      #
      # Non-vakuositasnya diukur: dengan keputusan akhir aturan dilumpuhkan
      # di pohon salinan, ketujuh keadaan cacat berbalik hijau dan ketiga
      # kontrol tetap hijau.
      - name: Buktikan Aturan 37 berbunyi pada switch yang kehilangan kasus enum
        run: python3 Tools/bukti-mutasi-aturan37-lengkap.py

      # Kenapa dua aturan ini butuh langkah sendiri, padahal 35 aturan lain
      # tidak: terukur pada commit ini, Aturan 8 dan Aturan 17 adalah
      # **satu-satunya** aturan di `swift-ui-lint.sh` yang tidak punya keadaan
      # cacat yang dieksekusi. Keduanya muncul di harness lain hanya sebagai
      # pembatas blok (`END = "# ── Aturan 8:"`) atau sebagai prosa — tidak
      # satu pun menanam cacat lalu menuntut aturannya menyala. Gerbang yang
      # tidak pernah dibuktikan bisa merah adalah gerbang yang hijau karena
      # tidak memeriksa, dan itu kelas cacat termahal di repo ini.
      - name: Buktikan Aturan 8 & 17 berbunyi (kata asing; kunci ditulis ulang di Apps/)
        run: python3 Tools/bukti-mutasi-aturan8-17.py

      # Kenapa Aturan 41 butuh langkah sendiri.
      #
      # Cacat yang ditutupnya **tersembunyi oleh kode yang benar di atasnya**:
      # `ObjectDetailView.objectDisplayName` berbunyi `displayName ?? object.name`,
      # dan pemanggilnya di `PointingView` selalu meneruskan `displayName` —
      # jadi cabang yang salah tidak pernah dieksekusi. Terukur di salinan utuh
      # sebelum aturan ini ada: mengganti judul kartu menjadi `Text(object.name)`
      # membiarkan **ke-40 aturan tetap hijau** (exit 0), dan begitu pula
      # `displayedObjectName -> object.name` yang mengembalikan bentuk Indonesia
      # ke empat permukaan sekaligus.
      #
      # Harness-nya mengukur lima keadaan, dua di antaranya kontrol negatif:
      # bentuk yang sudah diperbaiki (`?? ObjectDisplayName.text(of:)`) dan
      # berkas apa adanya wajib **diam**. Gerbang yang merah pada kode yang
      # benar akan dilonggarkan orang — jadi kontrol itu yang menentukan
      # apakah aturan ini masih hidup enam bulan lagi.
      - name: Buktikan Aturan 41 berbunyi (nama jatuh kembali ke object.name)
        run: python3 Tools/bukti-mutasi-aturan41-nama.py

      # Dan bukti untuk bentuk **ketiga** dari kelas "gerbang mengutip sesuatu
      # yang tidak ada" — kali ini bukan nama gerbang, melainkan nama **uji**.
      #
      # Ditemukan dengan `Tools/ukur-uji-menggantung.py`: dari 43 nama `test…`
      # yang dikutip sumber produksi, **3** tidak punya definisi. Ketiganya
      # dikutip sebagai "penjaganya" di komentar yang menjelaskan **kenapa**
      # sebuah konstanta bernilai seperti itu — jadi pembaca komentar itu
      # menyimpulkan invariannya terjaga, padahal tidak ada yang menjaganya di
      # Linux: `check-visuals.py` tidak dijalankan `swift-test.sh`.
      #
      # Tiga keadaan, dan keadaan 3 yang paling penting. Gerbang ini membaca
      # dua himpunan (kutipan di produksi, definisi di berkas uji); setiap
      # himpunan bisa berhenti terbaca sendiri-sendiri, dan tiap cara gagal
      # terlihat sama di layar: hijau. Keadaan 1 menamai ulang **definisinya**
      # (kutipan menggantung), keadaan 2 menambah **kutipannya** (uji tidak
      # ada) — kalau salah satunya hijau, gerbangnya cuma membaca satu sisi.
      # Keadaan 3 membuat pola pembaca kutipan berhenti cocok: himpunan kutipan
      # kosong, tidak ada yang menggantung, dan gerbang yang naif akan hijau
      # **karena tidak mengukur apa pun**. Karena itu ia fail-closed, dan
      # keadaan 3 membuktikan cabang itu benar-benar berbunyi.
      #
      # Yang TIDAK diklaim: ini gerbang statis nama-vs-nama. Uji hampa
      # (`XCTAssertTrue(true)`) lolos di sini — yang dijaga adalah kutipannya
      # menunjuk sesuatu yang ada, bukan bahwa uji itu mengukur yang diklaim.
      - name: Buktikan gerbang nama uji yang dikutip produksi berbunyi
        run: python3 Tools/bukti-mutasi-uji-menggantung.py

      # Dan bentuk **keempat**: bukan nama uji, bukan nama gerbang, melainkan
      # **berkas alat**. Empat kalimat di tiga berkas menunjuk
      # `Tools/ukur-gugus.py` sebagai sumber angka yang mereka kutip, dan
      # berkas itu tidak pernah dikomit sama sekali.
      #
      # Angka yang dikutip masih berlaku — `star.opacity + 0.25` di view sudah
      # menjadi `+ CGFloat(VisualFrame.clusterCoreBrighten)` — jadi yang hilang
      # bukan pengukurannya, melainkan alamatnya. Yang diperbaiki rujukannya,
      # bukan dengan menulis ulang alat sekali-pakai yang sudah hilang: itu
      # berarti menebak kembali keadaan pohon yang sudah berubah.
      #
      # Keadaan 2 sengaja **wajib hijau**: gerbangnya hanya menghitung rujukan
      # berbentuk jalur (`Tools/x.py`), bukan penyebutan nama tanpa jalur.
      # Menuntut keduanya akan menuduh prosa biasa, dan gerbang yang menuntut
      # hal yang tidak benar akan dilonggarkan orang.
      - name: Buktikan gerbang berkas alat yang dirujuk berbunyi
        run: python3 Tools/bukti-mutasi-tool-dirujuk.py

      # Dan bukti bahwa Aturan 44 (objek yang digambar tidak dipilih sendiri di
      # `Apps/`) benar-benar berbunyi.
      #
      # Cacat yang ditutupnya terukur: mengganti `displayedObject` menjadi
      # `lastLockedObject` di `visualForDisplayedObject` membuat **seluruh**
      # `swift-ui-lint.sh` lulus (exit 0), sementara kartu jam menampilkan nama
      # Jupiter dengan gambar cincin Saturnus di sebelahnya. Dua pengikatan itu
      # sama-sama sah secara sintaks dan sama-sama bukan `nil`.
      #
      # Aturan 43 **tidak** menangkapnya — deteksinya menyapu `String`,
      # sedangkan properti itu mengembalikan `CelestialVisual?`. Itu diukur
      # berdampingan (4 keadaan cacat: Aturan 43 diam, Aturan 44 berbunyi),
      # dan koreksinya tertulis di docstring Aturan 43.
      - name: Buktikan Aturan 44 berbunyi pada objek gambar yang dipilih sendiri
        run: python3 Tools/bukti-mutasi-objek-gambar.py

      # Dan bukti untuk gerbang **"keraguan tidak boleh paling terang"**.
      #
      # PRD meminta visual **samar** saat engine ragu. Yang selama ini dijaga
      # hanya **bentuknya** (`drawableMorphology` mengembalikan `nil`), tidak
      # pernah **terangnya** — dan terukur kabut ragu memancarkan 1.197 pada
      # fuzziness 0.8, **paling terang dari seluruh katalog** langit dalam
      # (galaksi 0.368, gugus terbuka 0.149), karena `deepSky(nil)` dulu
      # mengembalikan `nebula()` — morfologi yang **sah diklaim**.
      #
      # Keadaan #2 adalah yang paling berharga: bentuknya benar tetapi
      # opasitasnya dinaikkan. Tanpa dia, harness akan menyatakan sifatnya
      # terjaga padahal jalan pintas "redupkan saja sedikit" masih terbuka.
      # Ujinya hidup di model Swift, jadi probe menjalankan `swift test`
      # (lewat Docker di sini, `swift` langsung di CI) dan menuntutnya merah.
      - name: Buktikan gerbang kabut ragu tidak paling terang berbunyi
        run: python3 Tools/bukti-mutasi-kabut-ragu.py

      - name: Uji PointingKit
        run: swift test --package-path Packages/PointingKit
