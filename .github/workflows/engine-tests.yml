name: Engine Tests (Linux)
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - uses: actions/checkout@v4

      # `swift:6.0` (Ubuntu 24.04) **tidak memuat Python**. Sebelas aturan di
      # `swift-ui-lint.sh` dijalankan lewat `python3 - <<'PY'`; tanpanya
      # masing-masing mengembalikan string kosong dan dilaporkan "Bersih"
      # tanpa memeriksa apa pun — gerbang keluar 0, seluruh CI hijau.
      #
      # Ini pernah benar-benar terjadi dan tidak terlihat berbulan-bulan:
      # yang menyingkapnya adalah satu aturan yang baru ditambahkan dan
      # kebetulan berbunyi. `swift-ui-lint.sh` kini berhenti keras bila
      # python3 tidak ada (supaya ia tidak bisa lagi diam-diam lulus), dan
      # langkah ini yang memastikannya tersedia.
      - name: Pasang python3 (gerbang sapu UI)
        run: |
          apt-get update -qq
          apt-get install -y -qq python3

      # Dua paket, bukan satu.
      #
      # Kriteria "ENGINE SIAP" di ROADMAP.md menyatakan suite hijau di Linux
      # **tanpa Mac** untuk keduanya (166 CelestialEngine + 143 PointingKit).
      # Sebelumnya job ini hanya menjalankan CelestialEngine, sehingga separuh
      # kriteria itu tidak pernah ditegakkan di CI: perubahan pada PointingKit
      # hanya akan tertangkap job macOS yang jauh lebih lambat. Karena seluruh
      # keputusan produk yang bisa salah hidup di PointingKit (kapan yakin,
      # kapan menolak, apa yang direkam), gerbang cepatnya justru yang paling
      # perlu memeriksanya.
      - name: Uji CelestialEngine
        run: swift test --package-path Packages/CelestialEngine

      # Aturan UI yang tidak bisa ditegakkan compiler: ukuran font tetap
      # mengabaikan Dynamic Type. `swiftc` tidak peduli, dan berkas SwiftUI
      # tidak ikut terbangun di Linux — jadi ini satu-satunya penjaga. Sapunya
      # murni teks, sehingga ia bisa berjalan di Linux tanpa Apple SDK.
      - name: Gerbang sapu UI (font tetap)
        run: ./swift-ui-lint.sh

      # Buktikan gerbang di atas **berbunyi**, bukan sekadar mencetak
      # "Bersih".
      #
      # Aturan 15 (warna mode malam) pertama kali ditulis dan langsung hijau
      # — lalu tetap hijau ketika cacat yang persis seperti yang pernah
      # nyata disuntikkan. Sebabnya: batas fungsinya memakai
      # `rfind("\nfunc")`, yang tidak pernah cocok dengan
      # `private static func`, sehingga rentangnya jatuh ke seluruh berkas.
      # Gerbang itu lulus pada kode benar **dan** pada kode salah.
      #
      # `./red-lint.sh` menyuntik cacat itu, mewajibkan gerbang keluar
      # bukan-nol, lalu memulihkan berkasnya. Tanpa langkah ini, cacat pada
      # gerbang hanya akan ketahuan kalau kebetulan ada yang mengujinya.
      - name: Buktikan gerbang warna mode malam berbunyi
        run: |
          ./red-lint.sh Apps/Shared/CelestialVisualView.swift \
            '    private static func warnaUji() -> Color {
                  Color(red: 0.62, green: 0.30, blue: 0.16)
              }
          ' 'Aturan 15'

      # Gambar objek tidak bisa diperiksa di sini: `CelestialVisualView` hanya
      # terbangun di macOS, dan job ini berjalan di Linux. Karena itu lapisan
      # menggambarnya **diport ke Python** (`Tools/render-visuals.py`) dan
      # hasilnya diukur (`Tools/check-visuals.py`).
      #
      # Yang diukur bukan "gambarnya bagus" — itu tetap perlu mata manusia.
      # Yang diukur adalah hal-hal yang punya jawaban benar/salah dan selama
      # ini tidak dijaga oleh apa pun: apakah luas sabit yang tergambar
      # mengikuti fraksi iluminasi, apakah sisi terangnya menghadap arah yang
      # benar, dan apakah ciri pengenal planet benar-benar **hilang** saat
      # engine ragu. Ketiganya pernah salah di repo ini.
      #
      # Tanpa langkah ini, `Tools/check-visuals.py` hanya alat yang dipakai
      # kalau ada yang ingat menjalankannya. Gerbang yang harus diingat adalah
      # gerbang yang akan dilewati.
      - name: Gerbang gambar objek (port Python)
        run: python3 Tools/check-visuals.py --check

      # Buktikan gerbang gambar di atas **berbunyi**, bukan sekadar mencetak
      # "0 gagal".
      #
      # `red-lint.sh` (langkah di atas) melakukan ini untuk `swift-ui-lint.sh`,
      # tapi belum ada yang setara untuk gerbang gambar — dan justru di sana
      # buktinya paling dibutuhkan: gerbang gambar membaca **teks** sumber lalu
      # menyimpulkan sesuatu tentang gambar, jadi gerbang teks yang salah
      # membaca akan hijau selamanya tanpa ada yang tahu.
      #
      # Ini bukan upacara. Harness ini **menemukan dua cacat nyata** di
      # gerbangnya sendiri saat ditulis: (1) `"nama" in view` menghitung
      # komentar `// TODO …moonPhaseUnknown` sebagai pemakaian, dan (2)
      # `let aksen = CelestialVisual.accents` lalu `aksen.moonPhaseUnknown`
      # — kode yang benar — merah. Ia juga menangkap gerbang versi lama
      # (pemeriksaan ejaan) pada 9 dari 13 keadaan, termasuk setiap keadaan
      # "kode benar" — persis cacat yang membuat `main` merah dua commit.
      #
      # Ia memanggil fungsi pemeriksaan yang **sama** lewat parameter sumber,
      # bukan jalur kedua: gerbang penuh ~6 menit, ini <1 detik. Gerbang yang
      # terlalu lambat untuk dijalankan adalah gerbang yang dilewati.
      - name: Buktikan gerbang aksen gambar berbunyi
        run: python3 Tools/bukti-mutasi-aksen.py

      # Dan bukti yang sama untuk pemeriksaan ukuran bintang — cacat yang
      # ditemukan siklus ini: **setiap** kasus bintang bernama digambar dengan
      # `relative_size=size_from_magnitude(0.0)`, satu magnitudo untuk Sirius
      # (−1.46) dan Vega (+0.03). Sirius 4,3× lebih terang dari Rigel, dan pada
      # ukuran kartu jam keduanya terukur **0 piksel berbeda**: tidak ada satu
      # pun gambar di repo ini yang pernah membuktikan ukuran mengikuti
      # magnitudo. Yang berbohong bukan jamnya, melainkan perlengkapan
      # render — dan perlengkapan itulah yang diukur gerbang gambar.
      #
      # Harness ini menempuh jalur gerbang yang sama, atas tiga keadaan yang
      # memang salah: fixture kembali ke satu magnitudo, penggambar mengabaikan
      # `relative_size`, dan pembaca magnitudo bergeser. Keadaan ketiga itulah
      # yang memperlihatkan pemeriksaan pertama saya masih membandingkan
      # pembaca dengan dirinya sendiri.
      - name: Buktikan gerbang ukuran bintang berbunyi
        run: python3 Tools/bukti-mutasi-bintang.py

      # Dan bukti yang sama untuk **denyut bintang** — gerbang yang menutup
      # satu-satunya hal yang tidak bisa dilihat gerbang gambar mana pun yang
      # sudah ada: **geraknya**. Setiap gerbang lain di repo ini menggambar
      # pada satu fase, dan `star-pulse-peak` ada di `build_cases()` sejak
      # siklus pertama tanpa pernah disebut satu gerbang pun. Terukur:
      # `pulse_factor = 1.0` → 17 pemeriksaan bintang, **0 merah**; pada
      # 200 px piksel menyala turun 7044 → 3724 dan tidak ada yang melihat.
      #
      # Gerbangnya mengukur **amplitudo yang dipulihkan dari gambar** (akar
      # dari nisbah luas, karena yang dikalikan denyut adalah radius cakram),
      # lalu membandingkannya dengan `pulseAmplitude` **dari model Swift**.
      # Bentuk yang salah karena itu terbaca sebagai tanda yang salah:
      # `cos` membalik puncaknya, `sin²` membalik palungnya — masing-masing
      # berjarak 0.20 dari model, sementara kode benar terukur dalam 0.005.
      #
      # Harness ini menuntut pemeriksaan **mana** yang berbunyi, bukan
      # berapa: keadaan 1 dan 2 harus menyalakan pemeriksaan amplitudo yang
      # **berbeda** (puncak vs palung). Kalau keduanya menyalakan yang sama,
      # separuh gerbangnya mubazir — dan tidak ada yang akan tahu.
      # Keadaan 5 wajib **hijau**: sukunya dibalik tanpa mengubah hasil,
      # jadi gerbang yang sebenarnya cuma mencocokkan tulisan akan tertangkap
      # di sana, bukan di lima keadaan lainnya.
      - name: Buktikan gerbang denyut bintang berbunyi
        run: python3 Tools/bukti-mutasi-denyut.py

      # Dan bukti yang sama untuk pemeriksaan **penekanan bentuk saat ragu** —
      # satu pemeriksaan yang dipisah keluar dari `check_features_disappear_when_uncertain`
      # justru karena dua versi pertamanya hijau pada kode yang jelas salah.
      #
      # Versi pertama memakai `diff > 0` mentah, dan karena hanya gambar "ragu"
      # yang memakai lencana "?", seluruh selisihnya bisa **hanya** lencana:
      # terukur, penekanan bentuk dihapus seluruhnya dari port dan pemeriksaan
      # itu tetap hijau (3434 piksel, semuanya lencana). Versi kedua
      # membandingkan keenam morfologi terhadap **satu** kabut netral
      # ber-morfologi `galaxy`, jadi `galaxy` dibandingkan dengan dirinya
      # sendiri — nol piksel selamanya — sementara kelima yang lain "lulus"
      # pada 6073…6881 piksel yang seluruhnya **warna**, bukan bentuk.
      #
      # Harness ini menjalankan pemeriksaan yang sama atas empat keadaan dan
      # menuntut pemeriksaan mana yang berbunyi, bukan berapa yang merah.
      # Keadaan ketiga ("bentuk diabaikan selamanya, warna tetap benar") hijau
      # di **seluruh** 42 pemeriksaan morfologi lain — hanya arah "bentuk
      # sampai ke gambar saat terkunci" yang melihatnya.
      - name: Buktikan gerbang penekanan bentuk langit dalam berbunyi
        run: python3 Tools/bukti-mutasi-langit-dalam.py

      # Dan bukti yang sama untuk **arah fase saat benda mengecil** — gerbang
      # yang lahir dari celah yang tidak dijaga satu pun gerbang lain.
      #
      # `terminatorRotationRadians` punya dua jalur: pita yang dasarnya di
      # kanan (membesar) memakai sudut Matahari apa adanya, dan pita yang
      # dasarnya di **kiri** (mengecil) membalikkannya dengan `+ pi`. Sebelum
      # lima kasus `is_waxing=False` ditambahkan bersama gerbang baru, seluruh
      # katalog render repo ini hanya berisi `waxing=True`, dan di seluruh
      # `check-visuals.py` tidak ada satu pun `is_waxing=False` — jadi jalur
      # kedua tidak pernah digambar dan tidak pernah diukur.
      #
      # Terukur: dengan `+ pi` dihapus, `check_crescent_direction` (4
      # pemeriksaan), `check_inner_planet_phase` (5), `check_moon_phase_fraction`
      # (9), dan `check_moon_phase_survives_uncertainty` (3) semuanya tetap
      # **0 merah**. Yang terjadi bukan pemeriksaan merah, melainkan Bulan
      # yang mengecil menghadap berlawanan arah — sabit yang masih berbentuk
      # sabit, sehingga tidak ada teks di layar mana pun yang bisa
      # membuktikannya. Harness ini menjalankan keempat gerbang itu **plus**
      # yang baru, dan menuntut keadaan itu menyalakan **hanya** gerbang baru.
      - name: Buktikan gerbang arah fase saat mengecil berbunyi
        run: python3 Tools/bukti-mutasi-fase.py

      # Dan bukti yang sama untuk **Bintik Merah Besar** — ciri permukaan
      # terakhir yang belum pernah disapu, dan yang gerbangnya punya lubang
      # yang sama dengan pita Jupiter: ciri digambar sebagai elips warna
      # **rata** di atas bola yang sudah dinaungi gradien, jadi lengkung bola
      # di dalamnya terhapus. Untuk pita itu sudah dijaga
      # `check_banded_disc_keeps_its_curvature` — tetapi gerbang itu mengukur
      # **baris ekuator**, sementara bintiknya duduk di `centerY = +0.31`.
      # Diukur pada baris pusat bintik: bola di bawahnya meredup 0.580 → 0.532
      # (lengkung +8.4%), baris yang sama **dengan** bintik menanjak
      # 0.449 → 0.532 (lengkung −18.4%) — tandanya terbalik.
      #
      # Harness ini menguji **dua** gerbang sekaligus: yang piksel (lengkung
      # + ciri masih terbaca) dan yang teks (tiga entri baru di
      # `check_port_matches_swift_constants`, supaya view tidak bisa berhenti
      # memanggil pemulihannya atau menulis angkanya sendiri).
      #
      # Keadaan "`clip_ellipse` dihapus" sengaja **tidak** ada di sini: percobaan
      # pertama siklus ini menambah parameter itu ke `Canvas.ellipse`, dan
      # terukur ia mengubah **0 piksel** (elipsnya sudah membatasi diri ke
      # bentuknya sendiri). Ia dihapus dari port, bukan dijaga gerbang.
      - name: Buktikan gerbang bintik Jupiter berbunyi
        run: python3 Tools/bukti-mutasi-bintik.py

      # `moonSphereGradientEndRadius` adalah konstanta yang **dipakai dua
      # pemanggil** — piringan Bulan dan pita terang planet dalam — tetapi
      # sampai siklus ini hanya Bulan yang membacanya. Jalur planet menulis
      # `1.15` sendiri di view **dan** di port, jadi mengubah konstantanya
      # memindahkan nol piksel pada Venus/Merkurius: konstanta yang ada,
      # dinamai, dibandingkan gerbang drift, diuji di Linux, dan tidak
      # mengatur apa pun di separuh pemanggilnya. Tidak ada galat kompilasi.
      #
      # Harness ini menguji kelima keadaan, termasuk satu yang **diharapkan
      # hijau** (jalur Bulan memakai literal — gerbang ini mengukur planet
      # dalam, jadi batas cakupannya teruji, bukan tersirat).
      - name: Buktikan gerbang radius akhir gradien berbunyi
        run: python3 Tools/bukti-mutasi-radius-akhir.py

      # Pembaca gerbang di atas (`_gradient_end_factors`) ikut diubah oleh
      # perbaikan itu: ia hanya mengenali `radius * 1.15`, sehingga pada kode
      # yang sudah **benar** ia melaporkan "limb tidak terbaca" — gerbang yang
      # merah pada kode benar, kelas cacat yang lebih berbahaya dari gerbang
      # yang hijau pada kode salah, karena orang yang sedang terburu-buru akan
      # mengembalikan kodenya ke bentuk salah supaya gerbangnya diam.
      #
      # Harness ini membuktikan perluasan pembacanya tidak membuatnya tumpul:
      # tujuh keadaan, termasuk satu yang **diharapkan hijau** (kedua bahasa
      # sepakat) dan satu yang hanya terlihat oleh pemeriksaan "para pemanggil
      # sepakat" (dua pemanggil gradien limb tidak sepakat).
      - name: Buktikan pembaca radius akhir gradien masih menggigit
        run: python3 Tools/bukti-mutasi-radius-gradasi.py

      # Dan bukti yang sama untuk **kesinambungan cangkang nebula planetari** —
      # gerbang yang lahir dari cacat yang dilihat mata lebih dulu daripada
      # diukur alat.
      #
      # `testPlanetaryNebulaShellSitsOnOneRadius` menuntut semua blobnya sejauh
      # sama dari pusat; `testPlanetaryNebulaIsHollowAtTheCentre` menuntut
      # bagian tengahnya kosong. Keduanya benar, dan keduanya tetap benar pada
      # gambar yang rusak — **untaian delapan manik juga duduk pada satu radius
      # dan juga berongga di tengah.** Yang tidak dijaga siapa pun adalah apakah
      # manik-manik itu **bertemu**. Terukur pada 132 pt: celah di antara blob
      # turun ke 0.18 dari puncaknya, dan penilaian atas gambarnya menyebutnya
      # persis begitu — "string of pearls". Pada tata letak 16-blob sekarang
      # celah itu 0.77.
      #
      # Versi pertama gerbangnya memakai perbandingan terang/gelap dan **buta
      # justru pada cacat yang diklaimnya**: opasitas blob terbesar 0.54, jadi
      # puncaknya tersaturasi sementara celahnya tidak, dan versi 16-blob
      # terukur *lebih buruk* (1.13) daripada 8-blob (0.15) — persis terbalik.
      # Harness ini menuntut gerbangnya merah pada tata letak lama, dan tetap
      # merah pada mutasi paling tajam: 8 titik @45° pada lebar **sekarang**,
      # yang berbeda hanya jaraknya.
      - name: Buktikan gerbang cangkang nebula planetari berbunyi
        run: python3 Tools/bukti-mutasi-cangkang.py

      # Dan bukti yang sama untuk **bentuk lengan spiral** — gerbang yang
      # lahir dari lubang yang paling sulit dilihat: gerbang lengan yang sudah
      # ada (`check_spiral_arms_stay_continuous`) benar, dan ia merah kalau
      # lengannya dihapus dari model. Yang tidak bisa dilihatnya adalah
      # **bentuk**.
      #
      # Terukur: tata letak `.spiralGalaxy` diganti dengan **cincin** —
      # jari-jari blob lengan sama persis, tiap jari-jari disebar merata ke
      # delapan arah — dan seluruh **45 pemeriksaannya hijau**. Cincin adalah
      # kebalikan dari galaksi berlengan: M51 dan M101 dikenali justru dari
      # lengannya yang melengkung. Dan tata letak cincin bukan karangan — itu
      # bentuk yang dihasilkan cacat yang paling mungkin terjadi saat
      # menyunting spiral, menyalin satu titik lengan dan memutarnya alih-alih
      # melanjutkan kurvanya.
      #
      # Gerbang lama buta di sana karena mengukur "ada goresan terang di
      # jari-jari ini", dan cincin punya goresan terang di **setiap**
      # jari-jari. Gerbang barunya mengukur yang membedakan keduanya:
      # **pergeseran sudut punggungannya**. Diukur pada ukuran jam — spiral
      # asli +88°, cincin 8 arah +0°, cincin 4 arah −2°, cakram polos −2°,
      # lengan dihapus −2°.
      #
      # Keadaan 5 ("lengan diredupkan sampai tak terlihat") sengaja ada: ia
      # **hijau** di pemeriksaan pergeseran (+79°, murni kebisingan karena
      # profilnya nyaris rata) dan hanya merah di lantai kekuatan punggungan.
      # Tanpa keadaan itu, lantai tersebut bisa dihapus dan tidak ada satu pun
      # keadaan di sini yang akan tahu.
      #
      # Keadaan 7 ("dicerminkan") **wajib hijau**, dan itu batas yang
      # dinyatakan: gerbangnya mengukur ada-tidaknya lengkungan, bukan arah
      # putaran.
      #
      # Keadaan 8–11 memutasi **berkas gerbangnya sendiri**, bukan port render:
      # yang diuji di sana bukan gambarnya melainkan **angka yang ditulis
      # tentang gambar itu**. Gerbang ini lahir dengan dua tabel angka di
      # berkas yang sama yang saling bertentangan (+111° lawan +88° untuk
      # pengukuran yang sama) dan tidak satu pun cocok dengan render — cincin 4
      # arah tertulis 13.1 padahal 16.0, cakram polos tertulis 14.0 padahal 0.0,
      # dan "redup 10% memberi +160°" padahal +79°. Gerbang paritas
      # `check_spiral_arm_docstring_quotes_measured_values` menutupnya, dan
      # keempat keadaan ini membuktikan ia berbunyi:
      #
      #   8.  satu angka komentar digeser (gambar tak berubah) → merah
      #   9.  satu dari dua tabel digeser                  → merah (kedua tabel
      #                                                        tak lagi sepakat)
      #   10. **kedua** tabel digeser bersama-sama         → merah (sepakat,
      #        tapi sama-sama salah: arah 1 saja tidak cukup)
      #   11. ambang lantai digeser, tak dikutip di tabel  → WAJIB HIJAU
      #
      # Keadaan 11 yang menjaga gerbangnya tetap berarti: tanpa dia, gerbang
      # yang berbunyi pada **setiap** suntingan berkas ini akan terlihat sama
      # dengan gerbang yang berbunyi pada angka yang melenceng.
      - name: Buktikan gerbang bentuk lengan spiral berbunyi
        run: python3 Tools/bukti-mutasi-lengan.py

      # Dan bukti untuk gerbang **inti bintang gugus** — gerbang yang versi
      # pertamanya hijau pada gugus tanpa satu pun bintang.
      #
      # Versi pertama hanya mengukur puncak inti di atas lengkungan sekitarnya,
      # pada **satu** render. Lengkungan itu milik **kabut** yang menaungi
      # inti, bukan intinya, jadi dengan inti dihapus seluruhnya dari port
      # (`for star in []:`) keempat pemeriksaannya tetap hijau — gugus bola
      # 38 pt pada 0.2035 terhadap ambang 0.20. Gerbangnya mengesahkan gugus
      # tanpa bintang dan menyebutnya "inti bintang gugus terbaca".
      #
      # Gerbangnya sekarang mengukur **dua** nisbah, dan harness ini menuntut
      # masing-masing berbunyi pada kelasnya sendiri: kontras (dengan inti vs
      # tanpa inti) menangkap inti yang hilang, ketajaman (puncak di atas
      # lengkungan) menangkap inti yang menyatu dengan halonya. Keadaan #2
      # penting justru karena ia hijau di seluruh pemeriksaan kontras — tanpa
      # dia, `MIN_CLUSTER_CORE_SHARPNESS` tidak dijaga siapa pun.
      - name: Buktikan gerbang inti bintang gugus berbunyi
        run: python3 Tools/bukti-mutasi-inti-gugus.py

      # Dan bukti untuk **M27 sebagai cangkang yang dipetkan**, bukan cangkang
      # bulat: siluet yang memipih, lubang yang tetap terbuka, dan — yang baru
      # dan paling mudah hilang — **model yang berhenti memetkan sementara port
      # tetap memetkan**. Yang terakhir itu tidak bisa dilihat pemeriksaan
      # siluet mana pun, karena semuanya membaca port: port menggambar M27
      # memanjang, jam menggambarnya bulat, dan tidak satu pun PNG berubah.
      # Hanya gerbang drift antar-bahasa yang melihatnya, dan sampai siklus ini
      # komponen y cangkang tidak punya gerbang drift sama sekali — cangkangnya
      # belum pernah dipetkan.
      - name: Buktikan gerbang Dumbel (M27) berbunyi
        run: python3 Tools/bukti-mutasi-dumbel.py

      # Dan bukti untuk gerbang **bola netral planet tak dikenal** — jalur
      # jujur PRD di kelas planet, yang tidak dijaga siapa pun.
      #
      # Seluruh `build_cases()` disaring terhadap nama yang pernah disebut
      # `check-visuals.py`: dua kasus tidak pernah disebut, dan
      # `planet-unknown-confirmed` salah satunya. Terukur: mengganti cabang
      # `planet is None` dengan palet Mars — di port **dan** di view —
      # menghasilkan 0 piksel berbeda dari gambar Mars, dan seluruh 654
      # pemeriksaan tetap hijau. Jadi engine bisa menampilkan bola Mars untuk
      # planet yang tidak dikenali, menyatakan identitas yang tidak
      # dimilikinya, tanpa satu pun gerbang berbunyi.
      #
      # Keadaan #2 dan #3 penting justru karena keduanya **tidak menggerakkan
      # satu piksel pun**: yang diukur gerbang piksel adalah port, sedangkan
      # yang dikirim ke jam adalah view. Tanpa keduanya, sisi view bisa
      # menyimpang dari port tanpa ada yang tahu.
      - name: Buktikan gerbang bola netral planet tak dikenal berbunyi
        run: python3 Tools/bukti-mutasi-bola-netral.py

      # Dan bukti untuk gerbang **piringan kedua Saturnus** — gerbang yang
      # menutup kelas cacat yang tidak bisa dilihat gerbang lain mana pun.
      #
      # `drawPlanet` menggambar bola 1.0 R, lalu `drawRings` menggambar
      # bolanya sendiri pada 0.53 R; yang sampai ke layar dua piringan
      # bersarang, dan cakram 1.0 R-nya bocor ke seluruh frame di luar bidang
      # cincin. Gerbang terdekat ("cincin lebih lebar dari bola", ambang
      # `reach > 0.8`) **buta** terhadapnya: cakram bocor itu sendiri
      # menjangkau 1.0 R, jadi ambangnya dilewati — terukur, gerbang itu tetap
      # hijau bahkan ketika cincinnya dihapus seluruhnya.
      #
      # **Harness ini sempat tidak berjalan di CI sama sekali**, dan itu
      # bentuk kegagalan yang khas: berkasnya ada, isinya benar, dan tidak ada
      # yang mengeksekusinya. Ia ditemukan karena daftar `Tools/bukti-mutasi-*`
      # di disk (13) tidak sama dengan yang dirujuk alur kerja (12).
      - name: Buktikan gerbang piringan kedua Saturnus berbunyi
        run: python3 Tools/bukti-mutasi-piringan.py

      # Dan bukti untuk gerbang **ciri planet berfase tidak bocor ke sisi
      # gelap** — akibat dari pemotongan yang tidak diukur siapa pun.
      #
      # Kawah Merkurius dan kabut Venus digambar di dalam pita yang menyala di
      # kedua bahasa, tapi sampai gerbang ini ada, tidak satu pun dari 666
      # pemeriksaan mengukur **akibatnya**. Terukur: melepas `inside_lit` dari
      # pemanggilan `_draw_craters` di port membuat kawah melompat keluar
      # sabit — 2004 piksel menyala di belahan gelap pada 200 px, 71 di ukuran
      # kartu jam — dan seluruh `check-visuals.py --check` tetap 0 gagal.
      # Untuk Venus, melepas potongan kabutnya mengisi seluruh belahan gelap:
      # 14714 piksel pada 200 px.
      #
      # Keadaan #3 adalah arah sebaliknya, dan justru yang paling penting:
      # tanpa gerbang pasangannya, cara termurah memenuhi "nol piksel di
      # belahan gelap" adalah berhenti menggambar cirinya sama sekali. Ia harus
      # menyalakan **hanya** gerbang "masih tergambar", bukan gerbang
      # pemotongan — kalau keduanya berbunyi, gerbangnya tidak memisahkan
      # "dipotong" dari "dihapus", dan itu dua perbaikan yang berlawanan arah.
      - name: Buktikan gerbang ciri planet berfase tidak bocor berbunyi
        run: python3 Tools/bukti-mutasi-fase-ciri.py

      # Dan bukti untuk gerbang **maria Bulan tidak bocor ke belahan gelap**
      # — kelas yang tidak bisa ditutup gerbang planet berfase.
      #
      # Gerbang itu mengukur piksel **menyala** di belahan gelap terhadap
      # latar sudut frame. Piringan gelap Bulan (moonUnlit 0.13) lebih terang
      # dari latar (0.058), jadi memasukkannya ke daftar kasus planet
      # berfase akan melaporkan 14714 piksel "menyala" di belahan gelap pada
      # berkas yang BERSIH — seluruh piringan gelapnya, bukan maria. Bercak
      # gelap yang bocor karena itu butuh ukuran lain: selisih terhadap
      # gambar tanpa ciri itu. Terukur dengan ukuran itu: melepas klip maria
      # di port memunculkan 5516 piksel di belahan gelap pada 200 px dan 236
      # di ukuran kartu jam, sementara `check-visuals.py --check` tetap
      # 688 pemeriksaan, 0 gagal.
      #
      # Keadaan #2 adalah arah sebaliknya, dan justru yang paling penting:
      # tanpa gerbang pasangannya, cara termurah memenuhi "nol piksel di
      # belahan gelap" adalah berhenti menggambar maria sama sekali. Ia harus
      # menyalakan **hanya** gerbang "masih tergambar", bukan gerbang
      # kebocoran — kalau keduanya berbunyi, gerbangnya tidak memisahkan
      # "dipotong" dari "dihapus".
      - name: Buktikan gerbang maria Bulan tidak bocor berbunyi
        run: python3 Tools/bukti-mutasi-maria.py

      # Setiap harness `bukti-mutasi-*.py` di disk wajib dirujuk alur kerja
      # ini. Gerbang yang tidak pernah dijalankan selalu hijau, dan ia menutupi
      # cacat yang justru ditulisnya untuk menangkap — tanpa jejak apa pun di
      # laporan CI. Diukur: 13 berkas di disk, 12 dirujuk.
      - name: Setiap harness bukti-mutasi dijalankan CI
        run: python3 Tools/check-harness-terdaftar.py

      # Dan bukti untuk penjaga yang **melindungi semua harness di atas**.
      #
      # `mutasi_sumber.require_clean_sources` menolak jalan bila berkas
      # produksi yang akan dimutasi sudah menyimpang dari HEAD. Tanpa itu,
      # harness yang gagal pulih — mis. karena `timeout` di tengah langkah —
      # membuat harness **berikutnya** mengadopsi berkas yang sudah termutasi
      # sebagai «aslinya», lalu melaporkan «pulih persis» untuk perbandingan
      # dengan dirinya sendiri. Seluruh laporan hijau, dan tidak satu pun
      # angkanya berarti.
      #
      # Itu sudah terjadi pada 8 Okt: sebuah harness yang di-`timeout` di
      # tengah langkah meninggalkan satu baris mutasi hidup di
      # `render-visuals.py`, dan `bukti-mutasi-langit-dalam.py` berikutnya
      # melaporkan 15 kelemahan bukti **sekaligus** «pulih persis» atas berkas
      # yang tidak pernah pulih.
      #
      # Harness ini mengukur penjaganya sendiri, dan tiga keadaannya penting:
      # yang pertama **diharapkan lulus** (penjaga yang menyalak pada sumber
      # bersih akan dimatikan orang), yang kedua menuntut pesannya menyebut
      # **hanya** berkas yang kotor, dan yang ketiga menuntut penjaganya
      # **tidak lulus-terbuka** ketika `git diff` sendiri gagal.
      - name: Buktikan penjaga sumber-bersih harness mutasi berbunyi
        run: python3 Tools/bukti-penjaga-bersih.py

      # Gerbang `public` berlebih pada anggota `public extension`.
      #
      # Kenapa di sini, bukan di `swift-ui-lint.sh`: cacat ini hidup di
      # **paket**, bukan di `Apps/`, dan sapuan UI itu khusus SwiftUI. Kenapa
      # juga tidak cukup di `ios-build.yml`: job itu macOS dan butuh menit,
      # sementara ini gerbang teks yang berjalan dalam sekejap di Linux — dan
      # lebih cepat berbunyi, lebih murah diperbaiki.
      #
      # Cacat yang ditutupnya sudah pernah lolos ke `main`: 15 peringatan
      # produksi (`'public' modifier is redundant for … declared in a public
      # extension`) dari `CelestialVisual.swift` dan `NightVisual.swift`
      # duduk di setiap build tanpa satu pun gerbang melihatnya, karena
      # `ios-build.yml` hanya menyapu `Apps/`. Peringatan yang tak pernah
      # dibaca adalah cara paling halus untuk menutupi niat kode yang sudah
      # tidak berlaku.
      #
      # Dua arah, dan keduanya diuji di `prove_itself()` di dalam skripnya:
      # menemukan `public` yang berlebih, dan **tidak** menyentuh `public`
      # yang diperlukan pada anggota tipe bersarang — yang terakhir itu tidak
      # memicu peringatan apa pun, tapi membuat `Apps/` gagal dikompilasi.
      # Gerbang yang selalu keluar 0 terlihat persis sama dengan gerbang yang
      # bersih, jadi laporan ini sengaja keluar 1 saat ada temuan.
      - name: Gerbang `public` berlebih di public extension
        run: python3 Tools/bersihkan-public-berlebih.py

      - name: Uji PointingKit
        run: swift test --package-path Packages/PointingKit
