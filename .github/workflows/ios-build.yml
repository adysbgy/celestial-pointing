name: Apple Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # Hanya build terbaru per ref yang perlu jalan; push berikutnya membatalkan
  # yang masih mengantre.
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:

  # Paket Swift murni di Apple SDK. Linux (engine-tests.yml) sudah menguji
  # logikanya; di sini yang diperiksa adalah apakah paketnya benar-benar
  # dikompilasi SDK Apple — tempat `canImport(AstronomyKit)` dan ketersediaan
  # API berbeda dari Linux.
  packages:
    name: Paket (Apple SDK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versi toolchain
        run: swift --version
      - name: Build CelestialEngine
        run: swift build --package-path Packages/CelestialEngine
      - name: Build PointingKit
        run: swift build --package-path Packages/PointingKit
      - name: Uji PointingKit di Apple SDK
        run: swift test --package-path Packages/PointingKit

  # App iPhone + app jam. Dijalankan lewat proyek yang dihasilkan XcodeGen,
  # karena .xcodeproj tidak di-commit.
  apps:
    name: App (iPhone + Watch)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Aturan UI yang tidak bisa ditegakkan compiler (ukuran font tetap
      # mengabaikan Dynamic Type) diperiksa di sini **sebelum** build panjang,
      # supaya pelanggarannya ketahuan dalam detik, bukan menit. Sapunya murni
      # teks, jadi ia berjalan di Linux maupun macOS.
      - name: Gerbang sapu UI (font tetap)
        run: ./swift-ui-lint.sh

      - name: Pasang XcodeGen
        run: brew install xcodegen

      - name: Versi Xcode & XcodeGen
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Hasilkan proyek Xcode
        run: xcodegen generate

      - name: Pastikan skema terbentuk
        run: xcodebuild -list -project PointAndKnow.xcodeproj

      # Skema iPhone ikut membangun app jam, karena app jam adalah dependensi
      # yang ditanam ke dalam bundel iPhone. Jadi satu perintah ini mencakup
      # kedua target.
      #
      # Keluarannya disimpan ke berkas supaya bisa diperiksa: peringatan
      # compiler hanya terlihat di sini, dan siklus sebelumnya meninggalkan
      # tiga peringatan yang bertentangan dengan komentar di kodenya sendiri
      # (`@preconcurrency ... has no effect`). Peringatan yang menganggur
      # adalah cara paling halus untuk menutupi niat kode yang sudah tidak
      # berlaku, jadi ia dijadikan gerbang — bukan dibiarkan lewat.
      - name: Build app iPhone (termasuk app jam)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PointAndKnow.xcodeproj \
            -scheme PointAndKnow \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-iphone.log

      - name: Build app jam sendiri
        run: |
          set -o pipefail
          xcodebuild build \
            -project PointAndKnow.xcodeproj \
            -scheme PointAndKnowWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-watch.log

      # Gerbang peringatan: satu-satunya peringatan yang dianggap kegagalan
      # adalah peringatan yang menunjuk berkas **kode kita sendiri**
      # (`Apps/...`). Peringatan dari alat Xcode (urutan build manual, metadata
      # AppIntents, swift-format) sengaja tidak dihitung — itu bukan kode ini,
      # dan menjadikannya kegagalan hanya akan membuat gerbangnya dimatikan
      # orang lain saat ia berbunyi.
      - name: Gerbang peringatan (kode sendiri)
        run: |
          set -e
          hits=$(grep -hE '^/.*/Apps/.*: warning:' build-iphone.log build-watch.log || true)
          if [ -n "$hits" ]; then
            echo "Peringatan compiler pada kode sendiri:"
            echo "$hits"
            exit 1
          fi
          echo "Tidak ada peringatan compiler pada Apps/."

      # Log diagnostik hanya berguna saat gagal, tapi menaruhnya di sini
      # membuat kegagalan pertama bisa langsung dibaca tanpa perlu mengulang
      # build dengan flag tambahan.
      - name: Ringkasan log (saat gagal)
        if: failure()
        run: |
          echo "=== Hasil generate terakhir ==="
          ls -la PointAndKnow.xcodeproj 2>/dev/null || echo "proyek tidak terbentuk"
