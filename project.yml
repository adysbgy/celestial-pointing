# Spesifikasi proyek Xcode untuk CELESTIAL POINTING ENGINE.
#
# Kenapa XcodeGen dan bukan .xcodeproj yang di-commit: file .xcodeproj adalah
# format yang tidak bisa ditinjau di pull request dan konfliknya hampir selalu
# diselesaikan dengan menimpa milik orang lain. Di proyek ini seluruh logika
# diuji di Linux lewat `swift test`, jadi satu-satunya bagian yang bergantung
# pada Mac adalah pembungkus app — dan pembungkus itu lebih baik didefinisikan
# sebagai teks yang bisa dibaca.
#
# Cara pakai di Mac:
#   brew install xcodegen
#   cd <root repo> && xcodegen generate
#   open PointAndKnow.xcodeproj
#
# Target:
#   - PointAndKnow       : app iPhone (diagnostik + Experiment 1)
#   - PointAndKnow Watch : app jam (pointing + kalibrasi)
#
# Kedua app memakai paket SwiftPM lokal `PointingKit` (logika lapisan app) yang
# di atasnya berdiri `CelestialEngine`. Tidak ada logika yang diduplikasi di
# sini — app hanya berisi UI dan pembungkus sensor.

name: PointAndKnow

options:
  bundleIdPrefix: dev.celestial
  # `id` = bahasa pengembangan, dan ini yang **benar-benar** mengisi
  # `developmentRegion` di proyek yang dihasilkan
  # (`PBXProjGenerator`: `project.options.developmentLanguage ?? "en"`).
  # `developmentRegion` lalu ikut masuk `knownRegions`, yang bersama daftar
  # bahasa dari katalog menentukan bahasa apa yang bisa dipilih di Xcode.
  #
  # Kenapa tidak cukup `DEVELOPMENT_LANGUAGE` di `settings.base` (yang juga
  # ada): build setting itu hanya memengaruhi proses build, **bukan** spec
  # XcodeGen. Tanpa baris di sini, `developmentRegion` jatuh ke `"en"`
  # sedangkan teks sumbernya bahasa Indonesia — jadi proyek menyatakan dua
  # bahasa pengembangan yang berbeda, dan yang salah adalah yang tampil di
  # Xcode. Dua hal ini harus ditulis bersama; hanya satu tidak cukup.
  developmentLanguage: id
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # CATATAN: `knownRegions` sengaja TIDAK ditulis di sini karena itu bukan
  # opsi XcodeGen. `SpecOptions` tidak punya field tersebut; XcodeGen
  # menurunkan `knownRegions` sendiri dari isi katalog string
  # (`SourceGenerator`: `knownRegions.formUnion(stringCatalogsLocales)`),
  # lalu menambah `developmentRegion` dan `Base`. Baris `knownRegions` pernah
  # ada di sini dengan komentar yang terdengar benar, tapi tidak beersília
  # apa pun ke hasil generate.
  #
  # Kenapa dicatat: opsi yang tidak dikenal TIDAK menggagalkan
  # `xcodegen generate`, jadi kunci yang keliru di `project.yml` lolos tanpa
  # suara. Gerbang yang bisa menangkapnya bukan Xcode, melainkan pemeriksaan
  # `project.yml` di `./swift-ui-lint.sh`.
  # Tidak ada postGenCommand. Dulu ada sed yang memindahkan app jam dari
  # <Host>.app/Watch/ ke <Host>.app/PlugIns/ dengan alasan "Xcode 16+
  # mewajibkannya". Itu keliru: Watch/ adalah lokasi standar Xcode untuk app
  # watchOS pendamping (fase "Embed Watch Content", dstSubfolderSpec 16,
  # $(CONTENTS_FOLDER_PATH)/Watch), dan XcodeGen 2.46 menghasilkannya sendiri.
  # Di PlugIns/, installd memasang app iPhone tapi diam-diam mengabaikan app
  # jam — terbukti di simulator berpasangan (lihat Docs/DECISIONS.md, ADR-001).

# Tanda tangan & awalan bundle ID dari xcconfig (ADR-005): satu-satunya yang
# diisi pengembang adalah DEVELOPMENT_TEAM di Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  # Paket logika lapisan app: kalibrasi, alur kalibrasi, perekam Experiment 1,
  # format pesan Watch<->iPhone, model visual, palet. Semuanya teruji di
  # Linux. Jumlah tes ikut berubah tiap siklus — `STATUS.md` yang mencatatnya
  # lebih jujur daripada angka yang dibekukan di sini, jadi yang penting
  # adalah bahwa paketnya **tidak** punya logika yang hanya bisa diuji di Mac.
  PointingKit:
    path: Packages/PointingKit
  # Mesin inti: katalog, efemeris, resolver, keyakinan, pengaman slew.
  CelestialEngine:
    path: Packages/CelestialEngine

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Pasangan dari `options.developmentLanguage: id` di atas, dan keduanya
    # memang perlu: opsi itu mengisi `developmentRegion` di proyek, sedangkan
    # build setting ini memberi tahu proses build apa bahasa sumbernya.
    # Tanpa build setting ini, Xcode tetap menandai kunci katalog sebagai
    # "missing from Indonesian" walau `developmentRegion` sudah `id`.
    DEVELOPMENT_LANGUAGE: id
    # Katalog `Localizable.xcstrings` **ditulis tangan** dan di-commit, jadi
    # `SWIFT_EMIT_LOC_STRINGS` sengaja TIDAK dinyalakan: flag itu membuat
    # Xcode menulis ulang katalog dari literal yang ditemukan di kode. Itu
    # akan menimpa terjemahan Inggris dan membalikkan katalog ke keadaan
    # "63 kunci tanpa terjemahan" setiap kali proyek dibangun.
    #
    # Konsekuensinya, katalog tidak ikut **terisi otomatis**: kunci yang
    # baru dipakai di kode tetapi belum ada di katalog akan terlihat sebagai
    # teks tak terlokalisasi, tanpa peringatan. `./swift-ui-lint.sh` yang
    # menjaga itu (aturan 4), karena tidak ada gerbang lain yang bisa.
    SWIFT_EMIT_LOC_STRINGS: NO
    # Versi ditulis sekali di sini supaya ketiga target (app iPhone, app jam,
    # complication) mewarisi angka yang sama. Complication dulu tidak punya
    # CURRENT_PROJECT_VERSION sama sekali, jadi CFBundleVersion-nya kosong dan
    # installd menolak memasang app jam begitu ia ditanam di lokasi yang benar.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:

  # ─────────────────────────────────────────────────────────────────────────
  # App iPhone: diagnostik + Experiment 1
  # ─────────────────────────────────────────────────────────────────────────
  PointAndKnow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Apps/PointAndKnowiOS/Sources
      - path: Apps/Shared
      # Teks izin (`NS*UsageDescription`) dibaca **sistem** dari bundel, bukan
      # lewat `Localizable.xcstrings` — jadi ia butuh `InfoPlist.strings` per
      # bahasa, dan berkas itu harus ikut ke dalam bundel. Ikut lewat glob
      # `Apps/Shared` di atas; dicatat di sini karena Aturan 14 di
      # `swift-ui-lint.sh` membaca path ini dan akan merah bila direktori
      # `.lproj`-nya dihapus dari repo.
      - path: Apps/PointAndKnowiOS/Resources
      # Katalog string ikut lewat glob `Apps/Shared` di atas: file
      # `Localizable.xcstrings` ada di dalam direktori itu. Dulu ada entri
      # kedua yang menyebut `Apps/Shared/Resources` secara eksplisit dengan
      # `buildPhase: resources`, dengan alasan "XcodeGen hanya mengenali
      # `.xcstrings` sebagai resource bila path-nya disebut langsung".
      # Alasan itu **salah**: XcodeGen sudah memetakan
      # `"xcstrings": FileType(buildPhase: .resources)` secara default
      # (Sources/ProjectSpec/FileType.swift). Akibatnya berkas yang sama
      # di-*claim* dua kali oleh dua entri `sources`, dan tidak ada satu
      # pun gerbang yang bisa melihatnya.
    dependencies:
      - package: PointingKit
      - package: CelestialEngine
      # App jam ikut ditanam ke dalam app iPhone: satu bundel, dua perangkat.
      - target: PointAndKnow Watch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pointandknow
        PRODUCT_NAME: PointAndKnow
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # SDKROOT ditulis eksplisit, bukan diwarisi dari preset platform
        # XcodeGen. Nilainya sama dengan yang akan dipakai preset (`iphoneos`),
        # tapi dengan ditulis di sini proyek tetap benar walau berkas preset
        # tidak terbaca — dan spec ini bisa diverifikasi utuh dari Linux.
        SDKROOT: iphoneos
        INFOPLIST_KEY_CFBundleDisplayName: "Point & Know"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lokasi dipakai untuk menghitung posisi benda langit di langit Anda. Tanpa lokasi, aplikasi memakai lokasi bawaan yang jelas berlabel dan hasil pengukurannya ditandai belum tentu sah."
        INFOPLIST_KEY_NSMotionUsageDescription: "Data gerak dipakai untuk mengukur arah tunjuk. Akurasi sensor belum diasumsikan — justru itu yang diukur oleh Experiment 1."
        # Teleskop di jaringan lokal (ADR-008). Hanya dipakai bila fitur
        # `telescope.alpaca.enabled` dinyalakan; tanpa itu app tidak pernah
        # menyentuh jaringan lokal dan dialog izinnya tidak muncul.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Point & Know terhubung langsung ke teleskop Anda di Wi‑Fi lokal untuk mengarahkannya ke objek yang sudah Anda konfirmasi."
    # Info.plist parsial: ATS untuk HTTP Alpaca ke alamat lokal (192.168.x.x,
    # *.local). Hanya jaringan lokal yang dibuka, bukan HTTP ke internet.
    info:
      path: Apps/PointAndKnowiOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Handoff "Lihat 3D di iPhone" dari jam (ADR-017).
        NSUserActivityTypes:
          - dev.celestial.pointandknow.view-object

  # ─────────────────────────────────────────────────────────────────────────
  # Complication watchOS (WidgetKit) — terbenam di dalam app jam.
  # ─────────────────────────────────────────────────────────────────────────
  PointAndKnow Watch Complication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Apps/PointAndKnowWatch/Complications
      # Store bersama (App Group) dipakai app jam (tulis) & complication (baca).
      # Hanya berkas ini yang dibutuhkan complication — ia tidak perlu tahu
      # PointingKit/CelestialEngine sama sekali.
      - path: Apps/Shared/Complication
      # Katalog string **wajib** ikut ke sini, dan ini satu-satunya baris yang
      # membuatnya terjadi: tanpa entri eksplisit di bawah, katalog TIDAK ikut
      # ke bundel complication.
      #
      # Kenapa ia perlu: complication menampilkan `ComplicationDigest.headline`,
      # yang isinya `PointingState.shortLabel`, dan baris kedua
      # `objectKind.displayName` — keduanya teks yang **dihasilkan di
      # PointingKit** lewat `TextLocalization`. Dua hal harus benar
      # bersamaan: katalog ikut terbawa **dan** ada yang membacanya
      # (`ComplicationLocalization`, dipasang di `ComplicationProvider.init()`).
      # Kalau hanya satu, hasilnya tetap Bahasa Indonesia tanpa penjelasan.
      #
      # Status lama mengira katalog sudah ikut "lewat glob `Apps/Shared`".
      # Terbukti salah: target ini tidak pernah menarik `Apps/Shared` sebagai
      # sumber — hanya `Apps/Shared/Complication`. Dibuktikan dengan membangun
      # XcodeGen lalu membaca `project.pbxproj` yang dihasilkannya: sebelum
      # perubahan ini target complication **tidak punya fase Resources sama
      # sekali**, dan `Localizable.xcstrings` hanya ada di dua app.
      #
      # Yang TIDAK ikut ke sini: `LocalizationBridge.swift`. Itu milik app dan
      # tidak boleh ikut karena `Bundle.main` dalam proses extension menunjuk
      # ke bundel widget, bukan ke app jam — bridge-nya adalah
      # `ComplicationLocalization`.
      - path: Apps/Shared/Resources
        buildPhase: resources
    dependencies:
      - package: PointingKit
      - package: CelestialEngine
    info:
      path: Apps/PointAndKnowWatch/Complications/Info.plist
      properties:
        # Ditulis di sini, bukan hanya di berkas plist: `xcodegen generate`
        # menulis ulang plist dari daftar ini, jadi kunci yang tidak ada di
        # sini hilang setiap kali proyek dibuat.
        CFBundleDisplayName: Point & Know
        CPAppGroupID: group.$(BUNDLE_ID_PREFIX).pointandknow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # App Group agar app jam & complication berbagi berkas snapshot.
    # Di CI (tanpa tanda tangan) container ini `nil` → store pakai fallback
    # cache, jadi build tetap hijau; di perangkat nyata dengan profil yang
    # mengaktifkan group ini, complication benar-benar membaca tulisan app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pointandknow.watchkitapp.widgets
        PRODUCT_NAME: PointAndKnowWatchComplication
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        # Lewat variabel xcconfig, bukan `entitlementsPath`, supaya tim tanpa
        # App Group bisa mengosongkannya di Config/Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(CP_COMPLICATION_ENTITLEMENTS)

  # ─────────────────────────────────────────────────────────────────────────
  # App jam: pointing, kalibrasi, haptic
  # ─────────────────────────────────────────────────────────────────────────
  PointAndKnow Watch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Apps/PointAndKnowWatch/Sources
      - path: Apps/Shared
      # Teks izin ikut lewat glob `Apps/Shared` di atas — sama dengan app
      # iPhone: satu berkas `InfoPlist.strings`, dua perangkat. Aturan 14
      # memeriksa keberadaannya per bahasa.
      - path: Apps/PointAndKnowWatch/Resources
      # Katalog string ikut lewat glob `Apps/Shared` di atas — sama dengan
      # app iPhone: satu teks, dua perangkat. Kalau katalognya terpisah per
      # app, perubahan satu kalimat harus diulang dua kali, dan cepat-cepat
      # berbeda.
    dependencies:
      - package: PointingKit
      - package: CelestialEngine
      # Complication terbenam di dalam app jam: satu bundel, dua proses.
      - target: PointAndKnow Watch Complication
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).pointandknow.watchkitapp
        PRODUCT_NAME: PointAndKnowWatch
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Lihat catatan SDKROOT di target iPhone: ditulis eksplisit supaya
        # proyek tidak bergantung pada preset platform yang ter-load.
        SDKROOT: watchos
        # App jam selalu diinstal bersama app iPhone, jadi ia tidak pernah
        # dibuat sebagai arsip mandiri.
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Point & Know"
        # Wajib untuk app jam mandiri berbasis SwiftUI: tanpa `WKApplication`,
        # validasi App Store menolak bundelnya.
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).pointandknow
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lokasi dipakai untuk menghitung posisi benda langit di langit Anda. Tanpa lokasi, aplikasi memakai lokasi bawaan yang jelas berlabel, dan hasilnya ditandai belum tentu sah."
        INFOPLIST_KEY_NSMotionUsageDescription: "Data gerak dipakai untuk mengukur arah tunjuk jam. Akurasi sensor belum diasumsikan — justru itu yang diukur oleh Experiment 1."
        # App Group agar app jam & complication berbagi berkas snapshot.
        # Sama dengan target complication; tanpa ini complication hanya membaca
        # cache-nya sendiri (fallback store), bukan tulisan app.
        CODE_SIGN_ENTITLEMENTS: $(CP_WATCH_ENTITLEMENTS)
    # Info.plist parsial; kunci `INFOPLIST_KEY_*` di atas tetap digabung
    # karena `GENERATE_INFOPLIST_FILE: YES`. Satu-satunya isi yang tidak punya
    # padanan `INFOPLIST_KEY_*`: mode latar untuk `WKExtendedRuntimeSession`
    # Pointing Lab (ADR-004), supaya rekaman tidak berhenti saat layar meredup
    # dengan lengan terangkat.
    info:
      path: Apps/PointAndKnowWatch/Info.plist
      properties:
        WKBackgroundModes:
          - physical-therapy
        # Dibaca `ComplicationStore`: ID App Group mengikuti BUNDLE_ID_PREFIX.
        CPAppGroupID: group.$(BUNDLE_ID_PREFIX).pointandknow

# Skema ditulis eksplisit supaya CI tidak bergantung pada skema yang
# dihasilkan otomatis (dan supaya namanya stabil untuk `xcodebuild -scheme`).
schemes:
  PointAndKnow:
    build:
      targets:
        PointAndKnow: all
      # Urutan dependensi (bukan manual): Xcode 16+ memperingatkan "Building
      # targets in manual order is deprecated" untuk skema non-paralel, dan
      # urutan app jam → app iPhone sudah dijamin oleh dependensi target.
      parallelizeBuild: true
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  PointAndKnowWatch:
    build:
      targets:
        PointAndKnow Watch: all
      parallelizeBuild: true
    run:
      config: Debug
    archive:
      config: Release
